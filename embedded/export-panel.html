<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSM7 · App-wide Export — concept</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-soft:#f7fafb; --panel:#eef3f2;
  --line:#cfdad5; --line-strong:#9dafaa; --ink:#1f2935; --muted:#667482;
  --blue:#3386bf; --blue-soft:#e8f2f9; --teal:#178275; --teal-soft:#e5f3ef;
  --green:#63b16c; --green-soft:#e8f5e9; --amber:#efbd45; --amber-soft:#fff5d8;
  --red:#df6353; --red-soft:#fbe8e5; --violet:#8171b4; --violet-soft:#eeeaf8; --magenta:#c0399f;
  --radius:10px; --shadow:0 6px 22px rgba(20,40,40,.10);
}
body[data-skin="deck"]{
  --bg:#0f1822; --surface:#172430; --surface-soft:#1c2c3a; --panel:#13202b;
  --line:#2c3f4f; --line-strong:#3d5568; --ink:#eaf1f6; --muted:#90a6b6;
  --blue:#57aee6; --blue-soft:#16303f; --teal:#3fb9a6; --teal-soft:#123330;
  --green:#6fd07c; --green-soft:#14331c; --amber:#f1c75c; --amber-soft:#33290c;
  --red:#f0796a; --red-soft:#341615; --violet:#a596d8; --violet-soft:#241f37; --magenta:#e070c0;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
/* faux app shell */
.shell{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}
.brand b{font-size:16px}
.brand .crumb{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.split{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:3px}
.rstep{display:flex;align-items:center;gap:9px;border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12.5px}
.rstep:hover{background:var(--surface-soft)}
.rstep.on{background:var(--blue-soft);border-color:var(--blue);font-weight:750}
.rstep .rn{width:20px;height:20px;border-radius:5px;background:var(--panel);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted)}
.rstep.on .rn{background:var(--blue);color:#fff}
/* step surface */
.stephead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.stephead .lab{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.stephead h1{margin:2px 0 0;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.tile.mono{grid-column:1/-1}
.tile-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.tile-head h3{font-size:13.5px}
.tile-head .tk{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.tile-acts{display:flex;gap:6px}
.ticon{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:7px;width:30px;height:30px;font-size:13px;cursor:pointer}
.ticon:hover{border-color:var(--blue);color:var(--blue)}
.ticon.exp:hover{border-color:var(--teal);color:var(--teal)}
.tile-body{padding:10px 13px;color:var(--muted);font-size:11.5px;min-height:64px}
.count{font-size:11px;color:var(--muted);margin-top:6px}
.note{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.55}.note b{color:var(--ink)}
/* export panel (the ONE reusable surface) */
.scrim{position:fixed;inset:0;background:rgba(15,25,35,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.expanel{position:fixed;top:0;right:0;height:100%;width:min(430px,94vw);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);z-index:50;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column}
.expanel.on{transform:none}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ex-head .lab{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.ex-head h2{font-size:15.5px;margin-top:2px}
.ex-close{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.ex-body{overflow:auto;padding:4px 16px 16px;flex:1}
.sec{margin-top:15px}
.sec>.sh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:7px;display:flex;gap:7px;align-items:center}
.fmts{display:flex;gap:7px;flex-wrap:wrap}
.fmt{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;background:var(--surface)}
.fmt .fi{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:900}
.fmt.on{border-color:var(--blue);background:var(--blue-soft)} .fmt.dim{opacity:.42}
.fi.pptx{background:#c64f2b}.fi.docx{background:#2b579a}.fi.xlsx{background:#217346}.fi.pdf{background:#b3312c}.fi.png{background:#7a5bb0}.fi.svg{background:#c0399f}.fi.json{background:#555b66}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;background:var(--surface)}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)} .chip.off{opacity:.4;cursor:not-allowed}
.incs{display:flex;flex-wrap:wrap;gap:6px}
.inc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11.5px;cursor:pointer;background:var(--surface);color:var(--muted)}
.inc.on{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.inc .bx{width:13px;height:13px;border-radius:4px;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:9px;color:#fff}
.inc.on .bx{background:var(--teal);border-color:var(--teal)}
.subs{display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11.5px;cursor:pointer;background:var(--surface)}
.sub.on{border-color:var(--blue);background:var(--blue-soft)}
.bund{display:flex;flex-direction:column;gap:4px}
.fname{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface-soft);color:var(--ink);font-size:12px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace}
.preview{border:1px solid var(--line);border-radius:9px;background:var(--surface-soft);padding:11px 12px}
.preview .psum{font-size:11.5px;color:var(--ink);font-weight:600;line-height:1.5}.preview .psum b{color:var(--blue)}
.thumb{margin-top:9px;border:1px dashed var(--line-strong);border-radius:7px;background:var(--surface);min-height:70px;padding:9px;display:flex;gap:6px;flex-wrap:wrap}
.slide{width:60px;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--panel);position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;top:6px;left:6px;right:18px;height:4px;background:var(--blue);border-radius:2px;opacity:.7}
.slide::after{content:"";position:absolute;top:14px;left:6px;right:9px;bottom:5px;background:repeating-linear-gradient(var(--line) 0 2px,transparent 2px 7px)}
.docpage{width:66px;min-height:58px;border:1px solid var(--line);border-radius:3px;background:#fff;padding:6px}
body[data-skin="deck"] .docpage{background:#dfe6ea}
.docpage .l{height:3px;background:var(--line-strong);border-radius:2px;margin-bottom:3px}
.xgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;width:100%}
.xcell{height:12px;background:var(--surface);border:1px solid var(--line);border-radius:2px}.xcell.h{background:var(--green-soft);border-color:var(--green)}
.imgph{width:100%;height:56px;border:1px solid var(--line);border-radius:5px;background:conic-gradient(from 45deg,var(--panel),var(--surface-soft),var(--panel));display:grid;place-items:center;color:var(--muted);font-size:10px}
.ex-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:9px;align-items:center;background:var(--surface)}
.btn{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:750;font-size:13px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;flex:1}
.btn.ghost{border-color:transparent}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 15px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(600px,92vw)}
.toast.show{opacity:1}.toast code{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--amber);display:block;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.legend{margin-top:16px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:11.5px;color:var(--muted);line-height:1.6}.legend b{color:var(--ink)}
/* embed mode — when Codex mounts this as an iframe overlay, the demo shell disappears
   and only the scrim + panel remain (the host owns everything behind them). */
body.embed{background:transparent}
body.embed .shell{display:none}
body.embed .scrim{background:rgba(15,25,35,.34)}
/* skeleton (waiting on the host view-model) */
.skel{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.skel .sk{height:34px;border-radius:8px;background:linear-gradient(90deg,var(--surface-soft) 25%,var(--panel) 37%,var(--surface-soft) 63%);background-size:400% 100%;animation:shim 1.3s ease-in-out infinite}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
/* generating + result states */
.genrow{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--blue);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbar{margin:0 0 2px;padding:8px 11px;border:1px solid var(--red);background:var(--red-soft);color:var(--red);border-radius:8px;font-size:11.5px;font-weight:650}
body[data-skin="deck"] .errbar{color:var(--red)}
</style>
</head>
<body data-skin="workshop">
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="badge">V7</div><div><div class="crumb">VSM7 · Transformation 2026</div><b>Workshop</b></div></div>
    <button class="tbtn" data-app="1" title="Export the whole workshop">⬇ Export workshop</button>
  </div>
  <div class="split">
    <div class="rail" id="rail"></div>
    <div id="surface"></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="expanel" id="expanel" aria-label="Export"></aside>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PROJECT='Transformation 2026';

/* the seven steps + Implementation (host ids pinned to step1..step7/implementation) */
const STEPS=[
  {id:'step1',rom:'I',name:'Operative Units',tiles:['units','segmentation']},
  {id:'step2',rom:'II',name:'Manageability',tiles:['manageability']},
  {id:'step3',rom:'III',name:'SCTs',tiles:['scts']},
  {id:'step4',rom:'IV',name:'Central / Decentral',tiles:['contribution-matrix']},
  {id:'step5',rom:'V',name:'Design Steering System',tiles:['steering-map']},
  {id:'step6',rom:'VI',name:'Channels',tiles:['channel-variety','e2e-routes']},
  {id:'step7',rom:'VII',name:'Representation',tiles:['charter','org-chart']},
  {id:'implementation',rom:'∎',name:'Implementation',tiles:['workspace']},
];
const stepById=id=>STEPS.find(s=>s.id===id);

/* per-tile EXPORT VIEW-MODELS (in production: fed by Codex's getExportViewModel). The panel renders PURELY from these. */
const ALLINC=['notes','warnings','scores','owners','provenance','timestamps','gaps'];
const VM={
  units:{stepId:'step1',tileId:'units',title:'Operative Units',kind:'list',count:12,unitNoun:'units',mono:false,def:'exec',
    formats:['pptx','docx','pdf'],scopes:[['tile','This tile',12],['selection','Selected',0],['step','Whole step',12]],inc:['notes','provenance','timestamps','gaps'],body:'Mobility · Industrial Technology · Consumer Goods · Energy & Building …'},
  segmentation:{stepId:'step1',tileId:'segmentation',title:'Segmentation matrix',kind:'matrix',count:5,unitNoun:'options',mono:false,def:'exec',
    formats:['pptx','pdf','xlsx'],scopes:[['tile','This tile',5],['step','Whole step',12]],inc:['notes','provenance','gaps'],body:'Buying-criteria × options'},
  manageability:{stepId:'step2',tileId:'manageability',title:'Manageability assessment',kind:'matrix',count:6,unitNoun:'dimensions',mono:true,def:'memo',
    formats:['pptx','docx','pdf'],scopes:[['step','Whole step',6]],inc:['notes','warnings','scores','provenance','timestamps','gaps'],body:'Variety balance · Autonomy · Coordination …'},
  scts:{stepId:'step3',tileId:'scts',title:'System Control Tasks',kind:'list',count:22,unitNoun:'SCTs',mono:false,def:'data',
    formats:['xlsx','docx','pptx','pdf'],scopes:[['tile','This tile',22],['selection','Selected',4],['step','Whole step',22]],inc:ALLINC.slice(),body:'SCT-001 … SCT-022 (4 selected)'},
  'contribution-matrix':{stepId:'step4',tileId:'contribution-matrix',title:'Central / Decentral contribution matrix',kind:'matrix',count:14,unitNoun:'contributions',mono:false,def:'data',
    formats:['xlsx','pptx','pdf'],scopes:[['tile','This tile',14],['step','Whole step',14]],inc:['scores','owners','warnings','provenance','timestamps','gaps'],body:'SCT × organisation heatmap'},
  'steering-map':{stepId:'step5',tileId:'steering-map',title:'Design steering-system map',kind:'canvas',count:14,unitNoun:'mappings',mono:true,def:'doc',
    formats:['docx','pptx','pdf'],scopes:[['step','Whole step',14]],inc:['notes','warnings','owners','provenance','timestamps','gaps'],body:'SCT → VSM system (S1–S5, S3*)'},
  'channel-variety':{stepId:'step6',tileId:'channel-variety',title:'Communication variety',kind:'matrix',count:8,unitNoun:'loops',mono:false,def:'memo',
    formats:['svg','png','pdf','pptx','xlsx'],scopes:[['tile','This tile',8],['step','Whole step',8]],inc:['warnings','scores','owners','gaps','provenance','timestamps'],body:'RAG matrix + robustness radar'},
  'e2e-routes':{stepId:'step6',tileId:'e2e-routes',title:'End-to-end flight routes',kind:'canvas',count:6,unitNoun:'routes',mono:false,def:'memo',
    formats:['svg','png','pdf','pptx'],scopes:[['tile','This tile',6],['step','Whole step',6]],inc:['warnings','owners','gaps','provenance','timestamps'],body:'Route findings across SCTs'},
  charter:{stepId:'step7',tileId:'charter',title:'Meeting charters (7.6)',kind:'list',count:6,unitNoun:'meetings',mono:false,def:'doc',
    formats:['docx','pdf'],scopes:[['tile','This tile',6],['step','Whole step',6]],inc:['owners','gaps','notes','provenance','timestamps','warnings'],body:'Steering organs + reuse graph'},
  'org-chart':{stepId:'step7',tileId:'org-chart',title:'Org representation (7.7)',kind:'canvas',count:1,unitNoun:'chart',mono:false,def:'exec',
    formats:['pptx','pdf','svg','png'],scopes:[['tile','This tile',1],['step','Whole step',1]],inc:['owners','gaps','provenance','timestamps'],body:'Levels / VSM · accountability honesty line'},
  workspace:{stepId:'implementation',tileId:'workspace',title:'Whole workshop',kind:'substeps',count:8,unitNoun:'steps',mono:true,def:'appendix',
    formats:['pdf','docx','xlsx'],scopes:[['bundle','Custom bundle','—']],inc:ALLINC.slice(),bundle:true,body:'Pick the steps to include'},
};
/* step-level ⬇ view-model: reuse the step's first tile vm, forced to step scope; step7 uses a substep checklist */
const STEP7ALL={stepId:'step7',tileId:'all',title:'All Step VII substeps',kind:'substeps',count:7,unitNoun:'substeps',mono:true,def:'doc',
  formats:['docx','pdf'],scopes:[['step','Whole step',7]],inc:['owners','gaps','notes','provenance','timestamps','warnings'],
  substeps:['7.1 Vessels','7.2 RASIC','7.3 Metrics','7.4 Roles','7.5 Functions','7.6 Meetings','7.7 Org chart'],body:''};
function stepVm(stepId){ if(stepId==='step7')return STEP7ALL; if(stepId==='implementation')return VM.workspace; return VM[stepById(stepId).tiles[0]]; }

/* the "Purpose" presets were removed 2026-07-24 (PO): the panel is format-led. ALLINC still defines the include vocabulary. */
const FMTS=[['pptx','PowerPoint','P'],['docx','Word','W'],['xlsx','Excel','X'],['pdf','PDF','▤'],['png','PNG','▦'],['svg','SVG','∿'],['json','JSON','{}']]; /* legacy 'doc' removed — the host only emits real OOXML docx (buildSimpleDocx) */
const FMTNICE={pptx:'PowerPoint',docx:'Word',xlsx:'Excel',pdf:'PDF',png:'PNG',svg:'SVG',json:'JSON'};
const INCLABEL={notes:'Notes',warnings:'Warnings',scores:'Scores',owners:'Owners',provenance:'Provenance',timestamps:'Timestamps',gaps:'Unresolved gaps'};

let selStep='step3', state=null;

/* app-bundle manifest: host-enumerated (setBundle) when present, else the panel's own steps (standalone demo) */
function stepName(id){ const s=stepById(id); return s?`Step ${s.rom} · ${s.name}`:id; }
function bundleItems(){ return (hostBundle&&hostBundle.length)
  ? hostBundle.map(b=>({stepId:b.stepId,tileId:(b.tileId===undefined?null:b.tileId),scope:b.scope||'step',label:b.label||stepName(b.stepId)}))
  : STEPS.map(s=>({stepId:s.id,tileId:stepVm(s.id).tileId,scope:'step',label:stepName(s.id)})); }

/* ---- shell ---- */
function renderShell(){
  $('#rail').innerHTML=STEPS.map(s=>`<div class="rstep ${s.id===selStep?'on':''}" data-step="${s.id}"><span class="rn">${esc(s.rom)}</span>${esc(s.name)}</div>`).join('');
  const st=stepById(selStep);
  $('#surface').innerHTML=`<div class="stephead"><div><div class="lab">Step ${st.rom}</div><h1>${esc(st.name)}</h1></div>
      <button class="tbtn" data-stepexp="${st.id}" title="Export this whole step">⬇ Export step</button></div>
    <div class="tiles">${st.tiles.map(tid=>{const v=VM[tid];return `<div class="tile ${v.mono?'mono':''}">
      <div class="tile-head"><div><div class="tk">${esc(v.kind)}</div><h3>${esc(v.title)}</h3></div>
        <div class="tile-acts"><button class="ticon exp" data-tileexp="${tid}" title="Export…">⬇</button><button class="ticon" title="Full screen">⛶</button></div></div>
      <div class="tile-body">${esc(v.body)}<div class="count">${v.count} ${esc(v.unitNoun)}${(v.scopes.find(s=>s[0]==='selection')||[])[2]?` · ${v.scopes.find(s=>s[0]==='selection')[2]} selected`:''}</div></div></div>`;}).join('')}</div>`;
  $('#legend').innerHTML='<b>One panel, everywhere.</b> The SAME export surface opens from a tile ⬇, a step ⬇, or the app ⬇ — and adapts to each tile’s <b>view-model</b>: Operative Units offers no <i>scores/owners</i>; the 7.7 org chart offers <b>PNG/SVG</b>; monolithic steps drop <i>selection</i>; Step VII shows a <b>substep checklist</b>. Surface = Claude · file generation = Codex.';
}

/* ---- open panel from a view-model ---- */
/* No "Purpose" model (PO 2026-07-24): the FORMAT is the choice. The panel offers only what the target can really
   deliver (tables → xlsx, canvases → pptx/svg/png, narrative → docx); every available include defaults ON. */
function defScope(vm){ const kinds=vm.scopes.map(s=>s[0]); const enabled=k=>{const s=vm.scopes.find(x=>x[0]===k);return s&&s[2]!==0;};
  return ['tile','step','selection','bundle'].find(k=>kinds.includes(k)&&enabled(k))||kinds[0]; }
function allInc(vm){ const o={}; vm.inc.forEach(k=>o[k]=true); return o; }
function openFor(vm,origin){
  const bitems=vm.bundle?bundleItems():[];
  state={vm,origin,fmt:vm.formats[0],scope:defScope(vm),inc:allInc(vm),
    subs:(vm.substeps||[]).map(()=>true),bundleItems:bitems,bundle:bitems.map(()=>true)};
  state.filename=defName(); renderPanel(); $('#scrim').classList.add('on'); $('#expanel').classList.add('on'); reportResize();
}
function defName(){ const v=state.vm,d=new Date().toISOString().slice(0,10),clean=s=>s.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return `VSM7_${clean(PROJECT)}_${clean((stepById(v.stepId)||{}).name||v.stepId)}-${clean(v.title.split('(')[0]).slice(0,16)}_${d}.${state.fmt}`; }
function closePanel(userCancelled){
  const wasOpen=$('#expanel').classList.contains('on');
  $('#scrim').classList.remove('on'); $('#expanel').classList.remove('on'); state=null; pendingOpen=null; inflightReq=null;
  if(userCancelled&&wasOpen) postHost({evt:'cancel',api:1});      // panel → HOST
  reportResize(); }

function renderPanel(){
  const v=state.vm, st=stepById(v.stepId)||{rom:'',name:''};   // robust to host stepIds outside the built-in list (overview, app, future)
  $('#expanel').innerHTML=`
    <div class="ex-head"><div><div class="lab">Export${st.rom?(' · Step '+st.rom):''}${state.origin==='app'?' · workshop':''}</div><h2>${esc(v.title)}</h2></div><button class="ex-close" data-close="1">✕</button></div>
    <div class="ex-body">
      <div class="sec"><div class="sh">Format</div>
        <div class="fmts">${v.formats.map(f=>{const F=FMTS.find(x=>x[0]===f)||[f,f.toUpperCase(),f.charAt(0).toUpperCase()];return `<button class="fmt ${f===state.fmt?'on':''}" data-fmt="${f}"><span class="fi ${f}">${F[2]}</span>${F[1]}</button>`;}).join('')}</div></div>
      ${v.substeps?`<div class="sec"><div class="sh">Substeps</div><div class="subs">${v.substeps.map((s,i)=>`<div class="sub ${state.subs[i]?'on':''}" data-sub="${i}"><span class="bx" style="width:13px">${state.subs[i]?'✓':''}</span>${esc(s)}</div>`).join('')}</div></div>`:''}
      ${v.bundle?`<div class="sec"><div class="sh">Steps in the bundle</div><div class="bund">${state.bundleItems.map((it,i)=>`<div class="sub ${state.bundle[i]?'on':''}" data-bund="${i}"><span class="bx" style="width:13px">${state.bundle[i]?'✓':''}</span>${esc(it.label)}</div>`).join('')}</div></div>`:`
      <div class="sec"><div class="sh">Scope</div>
        <div class="seg">${v.scopes.map(s=>{const off=s[2]===0;return `<button class="chip ${s[0]===state.scope?'on':''} ${off?'off':''}" data-scope="${s[0]}" ${off?'disabled':''}>${esc(s[1])}${s[2]!=='—'&&s[2]!=null?` · ${s[2]}`:''}</button>`;}).join('')}</div></div>`}
      <div class="sec"><div class="sh">Include</div>
        <div class="incs">${v.inc.map(k=>`<button class="inc ${state.inc[k]?'on':''}" data-inc="${k}"><span class="bx">${state.inc[k]?'✓':''}</span>${esc(INCLABEL[k])}</button>`).join('')}</div></div>
      <div class="sec"><div class="sh">Filename</div><input class="fname" id="fname" value="${esc(state.filename)}" spellcheck="false"></div>
      <div class="sec"><div class="sh">Preview</div><div class="preview"><div class="psum">You'll get <b>${FMTNICE[state.fmt]||String(state.fmt).toUpperCase()}</b> · ${scopeLabel()} · ${incOn().length?incOn().map(k=>INCLABEL[k].toLowerCase()).join(', '):'headline only'}.</div><div class="thumb">${thumb()}</div></div></div>
    </div>
    <div class="ex-foot"><button class="btn ghost" data-close="1">Cancel</button><button class="btn primary" data-go="1">⬇ Export ${FMTNICE[state.fmt]||String(state.fmt).toUpperCase()}</button></div>`;
  reportResize();
}
function incOn(){ return state.vm.inc.filter(k=>state.inc[k]); }
function scopeLabel(){ const v=state.vm;
  if(v.bundle)return `${state.bundle.filter(Boolean).length} of ${state.bundleItems.length} steps`;
  if(v.substeps)return `${state.subs.filter(Boolean).length} of ${v.substeps.length} substeps`;
  const s=v.scopes.find(x=>x[0]===state.scope)||[]; return (s[1]||'')+(s[2]&&s[2]!=='—'?` (${s[2]} ${v.unitNoun})`:''); }
function thumb(){ const f=state.fmt;
  if(f==='pptx')return `<div class="slide"></div><div class="slide"></div><div class="slide"></div>`;
  if(f==='xlsx'){let c='';for(let i=0;i<20;i++)c+=`<div class="xcell ${i<4?'h':''}"></div>`;return `<div class="xgrid">${c}</div>`;}
  if(f==='png'||f==='svg')return `<div class="imgph">${f.toUpperCase()} — vector/raster board image</div>`;
  return `<div class="docpage"><div class="l" style="width:60%"></div><div class="l" style="width:90%"></div><div class="l" style="width:82%"></div><div class="l" style="width:70%"></div><div class="l" style="width:88%"></div></div>`; }

/* ---- the ONE intent ---- */
function intent(){ const v=state.vm; const target={};
  if(v.substeps)target.substeps=v.substeps.filter((_,i)=>state.subs[i]).map(s=>s.split(' ')[0]);
  if(v.bundle)target.bundle=state.bundleItems.filter((_,i)=>state.bundle[i]).map(it=>({stepId:it.stepId,tileId:it.tileId,scope:it.scope}));
  if(!v.bundle&&!v.substeps&&state.scope==='selection')target.selection=(v.selectionRefs||[]).map(r=>({kind:r.kind,id:r.id}));
  return { evt:'export', api:1, origin:state.origin, stepId:v.stepId, tileId:v.bundle?null:v.tileId,
    scope:v.bundle?'bundle':(v.substeps?'step':state.scope), target, format:state.fmt, preset:null,
    options:ALLINC.reduce((o,k)=>(o[k]=!!state.inc[k],o),{}),   // all 7 keys, always real booleans
    filename:$('#fname')?$('#fname').value:state.filename, skin:document.body.dataset.skin, requestId:newReqId() }; }
function toast(html){ const el=$('#toast'); el.innerHTML=html; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),4600); }
function emit(){ const m=intent(); pending[m.requestId]={filename:m.filename}; inflightReq=m.requestId;
  postHost(m);                                  // panel → HOST  { evt:'export', api:1, … }
  if(inFrame){ showGenerating(m); }             // embedded: keep panel, await exportReady/exportError
  else { toast(`Export intent → host (Codex generates the file).<code>${esc(JSON.stringify(m))}</code>`); closePanel(); } }
function showGenerating(m){ const foot=$('#expanel')&&$('#expanel').querySelector('.ex-foot');
  if(foot)foot.innerHTML=`<span class="genrow"><span class="spin"></span>Generating ${esc(FMTNICE[m.format]||String(m.format).toUpperCase())}…</span>`; }

/* ---- events ---- */
document.addEventListener('click',e=>{
  const rs=e.target.closest('[data-step]'); if(rs){ selStep=rs.dataset.step; renderShell(); return; }
  const te=e.target.closest('[data-tileexp]'); if(te){ openFor(VM[te.dataset.tileexp],'tile'); return; }
  const se=e.target.closest('[data-stepexp]'); if(se){ openFor(stepVm(se.dataset.stepexp),'step'); return; }
  if(e.target.closest('[data-app]')){ openFor(VM.workspace,'app'); return; }
  if(e.target.closest('[data-close]')||e.target===$('#scrim'))return closePanel(true);
  if(!state)return;
  const fm=e.target.closest('[data-fmt]'); if(fm){ state.fmt=fm.dataset.fmt; state.filename=($('#fname')?$('#fname').value:state.filename).replace(/\.(pptx|docx|xlsx|pdf|png|svg|json)$/i,'.'+state.fmt); renderPanel(); return; }
  const sc=e.target.closest('[data-scope]'); if(sc&&!sc.disabled){ state.scope=sc.dataset.scope; renderPanel(); return; }
  const ic=e.target.closest('[data-inc]'); if(ic){ state.inc[ic.dataset.inc]=!state.inc[ic.dataset.inc]; renderPanel(); return; }
  const su=e.target.closest('[data-sub]'); if(su){ const i=+su.dataset.sub; state.subs[i]=!state.subs[i]; renderPanel(); return; }
  const bu=e.target.closest('[data-bund]'); if(bu){ const i=+bu.dataset.bund; state.bundle[i]=!state.bundle[i]; renderPanel(); return; }
  if(e.target.closest('[data-go]'))return emit();
});
document.addEventListener('input',e=>{ if(e.target.id==='fname'&&state)state.filename=e.target.value; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#expanel').classList.contains('on'))closePanel(true); });

/* ============================================================================
   window.EXPORT — the app-wide export bridge (api:1)
   HOST → panel : setViewModel · open · setBundle · setSkin · close · exportReady · exportError
   panel → HOST : ready · needViewModel · export · cancel · resize
   The panel renders PURELY from a host-supplied view-model. Codex authors
   getExportViewModel(workspace, appState, {stepId,tileId,origin,scope}) → vm and
   drives this bridge; this surface never reaches into canonical host state.
   ============================================================================ */
const inFrame=(()=>{ try{ return window.parent&&window.parent!==window; }catch(_){ return true; } })();
if(inFrame) document.body.classList.add('embed');
const HOSTVM={};                 // "stepId/tileId" -> normalized internal view-model
let   hostBundle=null;           // host-enumerated [{stepId,tileId,scope,label}] for the app bundle
let   pendingOpen=null;          // {stepId,tileId,origin,scope} awaiting a view-model
const pending={};                // requestId -> {filename}
let   inflightReq=null;          // the requestId of the in-flight export (for exportReady/exportError correlation)
const listeners=[];              // onEmit callbacks (in-page / tests)
let   reqSeq=0;
const vmKey=(s,t)=>s+'/'+(t==null?'*':t);
function postHost(msg){ try{ if(inFrame)window.parent.postMessage(msg,'*'); }catch(_){} listeners.forEach(fn=>{try{fn(msg);}catch(_){}});}
function newReqId(){ return 'req-'+Date.now().toString(36)+'-'+(reqSeq++); }
function reportResize(){ try{ const h=Math.max(document.body.scrollHeight,($('#expanel')?$('#expanel').scrollHeight:0)); postHost({evt:'resize',api:1,height:h}); }catch(_){}}

/* Codex's contract view-model  →  the panel's internal render shape.
   Contract fields (availableFormats/availableScopes/availableIncludes/…) are load-bearing
   host truth: the panel advertises ONLY what the view-model carries. */
function normalizeVm(h){
  if(!h||typeof h!=='object') return null;
  if(Array.isArray(h.formats)) return h;                         // already internal (demo seed)
  const scopes=(h.availableScopes||[]).map(s=>Array.isArray(s)?s:[s.kind,s.label,(s.count==null?'—':s.count)]);
  const subs=(h.substeps||[]).map(s=>typeof s==='string'?s:`${s.id} ${s.title}`);
  return {
    stepId:h.stepId, tileId:(h.tileId==null?null:h.tileId), title:h.title||h.tileId||'Export',
    kind:h.kind||'list', count:(h.count!=null?h.count:((scopes[0]||[])[2]||0)),
    unitNoun:h.unitNoun||'items', mono:!!h.monolithic, def:h.defaultPreset||null,
    formats:(h.availableFormats&&h.availableFormats.length)?h.availableFormats.slice():['pdf'],
    scopes:scopes.length?scopes:[['step','Whole step',(h.count||0)]],
    inc:(h.availableIncludes||[]).slice(),
    substeps:subs.length?subs:null,
    bundle:scopes.some(s=>s[0]==='bundle')||undefined,
    selectionRefs:(h.selection||[]).map(x=>({kind:x.kind,id:x.id})),
    project:h.project||null, body:h.body||''
  };
}
function inferOrigin(stepId,tileId){ if(tileId==null)return 'step'; if(stepId==='implementation'&&tileId==='workspace')return 'app'; return 'tile'; }

/* transient panel states while waiting on / failing the host */
function showPanel(html){ $('#expanel').innerHTML=html; $('#scrim').classList.add('on'); $('#expanel').classList.add('on'); reportResize(); }
function openSkeleton(stepId,tileId){ state=null;
  showPanel(`<div class="ex-head"><div><div class="lab">Export</div><h2>Preparing…</h2></div><button class="ex-close" data-close="1">✕</button></div>
    <div class="ex-body"><div class="skel"><div class="sk"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div>
      <div class="preview"><div class="psum">Waiting for <b>${esc(stepId)}${tileId?' · '+esc(tileId):''}</b> from the host…</div></div></div>
    <div class="ex-foot"><button class="btn ghost" data-close="1">Cancel</button></div>`); }
function openUnavailable(stepId,tileId,message){ state=null;
  showPanel(`<div class="ex-head"><div><div class="lab">Export</div><h2>Not available</h2></div><button class="ex-close" data-close="1">✕</button></div>
    <div class="ex-body"><div class="errbar">${esc(message||'This item can’t be exported yet.')}</div>
      <div class="preview"><div class="psum" style="color:var(--muted)">${esc(stepId)}${tileId?' · '+esc(tileId):''}</div></div></div>
    <div class="ex-foot"><button class="btn ghost" data-close="1">Close</button></div>`); }

/* open by (stepId,tileId): render the cached view-model, else ask the host for one */
function openTarget(stepId,tileId,origin,scope){
  origin=origin||inferOrigin(stepId,tileId);
  const vm=HOSTVM[vmKey(stepId,tileId==null?null:tileId)];
  if(vm){ openFor(vm,origin); if(scope&&state&&vm.scopes.some(s=>s[0]===scope)){ state.scope=scope; renderPanel(); } return; }
  pendingOpen={stepId,tileId:(tileId==null?null:tileId),origin,scope};
  openSkeleton(stepId,tileId);
  postHost({evt:'needViewModel',api:1,stepId,tileId:(tileId==null?null:tileId),requestId:newReqId()});   // panel → HOST
}

function onExportReady(m){ if(m.requestId&&inflightReq&&m.requestId!==inflightReq)return;   // ignore stale/superseded reply
  const info=pending[m.requestId]; delete pending[m.requestId]; inflightReq=null;
  const name=m.downloadName||(info&&info.filename)||'file';
  closePanel(false); toast(`Saved <code>${esc(name)}</code>`); }
function onExportError(m){ if(m.requestId&&inflightReq&&m.requestId!==inflightReq)return;   // ignore stale/superseded reply
  delete pending[m.requestId]; inflightReq=null;
  if(state){ renderPanel(); const foot=$('#expanel').querySelector('.ex-foot'); if(foot)foot.insertAdjacentHTML('beforebegin',`<div class="sec"><div class="errbar">Export failed: ${esc(m.message||'unknown error')}</div></div>`); reportResize(); }
  else toast(`Export failed: ${esc(m.message||'unknown error')}`); }

/* HOST → panel command dispatch (postMessage OR direct window.EXPORT.* calls) */
function handleHostCmd(m){
  if(!m||typeof m!=='object') return;
  switch(m.cmd){
    case 'setViewModel':{ if(!m.vm)break; const sid=m.stepId||m.vm.stepId, tid=(m.tileId!==undefined?m.tileId:m.vm.tileId);
      HOSTVM[vmKey(sid,tid==null?null:tid)]=normalizeVm(m.vm);
      if(pendingOpen&&pendingOpen.stepId===sid&&(pendingOpen.tileId==null?null:pendingOpen.tileId)===(tid==null?null:tid)){
        const p=pendingOpen; pendingOpen=null; openTarget(p.stepId,p.tileId,p.origin,p.scope); } break; }
    case 'open': openTarget(m.stepId,(m.tileId===undefined?null:m.tileId),m.origin,m.scope); break;
    case 'setBundle': hostBundle=Array.isArray(m.bundle)?m.bundle:null;
      if(state&&state.vm&&state.vm.bundle){ state.bundleItems=bundleItems(); state.bundle=state.bundleItems.map(()=>true); renderPanel(); } break;
    case 'setSkin': case 'skin': if(m.skin==='workshop'||m.skin==='deck')document.body.dataset.skin=m.skin; break;
    case 'close': closePanel(false); break;
    case 'exportReady': onExportReady(m); break;
    case 'exportError': onExportError(m); break;
  }
}
window.addEventListener('message',e=>handleHostCmd(e.data));

window.EXPORT={
  api:1,
  setViewModel:(stepId,tileId,vm)=>handleHostCmd({cmd:'setViewModel',stepId,tileId,vm}),
  open:(stepId,tileId,scope,origin)=>handleHostCmd({cmd:'open',stepId,tileId,scope,origin}),
  setBundle:(bundle)=>handleHostCmd({cmd:'setBundle',bundle}),
  setSkin:(skin)=>handleHostCmd({cmd:'setSkin',skin}),
  close:()=>closePanel(false),
  exportReady:(requestId,downloadName)=>handleHostCmd({cmd:'exportReady',requestId,downloadName}),
  exportError:(requestId,message)=>handleHostCmd({cmd:'exportError',requestId,message}),
  onEmit:(fn)=>{ if(typeof fn==='function')listeners.push(fn); },
  intent:()=> state?intent():null,
  getState:()=> state?{stepId:state.vm.stepId,tileId:state.vm.tileId,origin:state.origin,fmt:state.fmt,scope:state.scope,inc:Object.assign({},state.inc)}:null,
  _registry:HOSTVM
};

/* boot */
renderShell();
/* seed the built-in demo view-models so EXPORT.open() works standalone & in tests */
Object.keys(VM).forEach(t=>{ const v=VM[t]; HOSTVM[vmKey(v.stepId,v.tileId)]=v; });
STEPS.forEach(s=>{ HOSTVM[vmKey(s.id,null)]=stepVm(s.id); });     // step-level targets (tileId:null)
postHost({evt:'ready',api:1});                                     // panel → HOST
reportResize();
</script>
</body>
</html>
