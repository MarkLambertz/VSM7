<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSM7 · Step VII — Representation</title>
<style>
* { box-sizing: border-box; }
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-soft:#f7fafb; --panel:#eef3f2;
  --line:#cfdad5; --line-strong:#9dafaa; --ink:#1f2935; --muted:#667482;
  --blue:#3386bf; --blue-soft:#e8f2f9; --teal:#178275; --teal-soft:#e5f3ef;
  --green:#63b16c; --green-soft:#e8f5e9; --amber:#efbd45; --amber-soft:#fff5d8;
  --red:#df6353; --red-soft:#fbe8e5; --violet:#8171b4; --violet-soft:#eeeaf8;
  --magenta:#c0399f; --magenta-soft:#fbe6f2;
  --s1:#34404c; --s2:#efbd45; --s3:#df6353; --s3star:#b85045; --s4:#63b16c; --s5:#9dbed2;
  --radius:9px; --shadow:0 4px 16px rgba(20,40,40,.08);
}
/* ---- Command Deck skin (high-contrast, segmented) ---- */
body[data-skin="deck"]{
  --bg:#0f1822; --surface:#172430; --surface-soft:#1c2c3a; --panel:#13202b;
  --line:#2c3f4f; --line-strong:#3d5568; --ink:#eaf1f6; --muted:#90a6b6;
  --blue:#57aee6; --blue-soft:#16303f; --teal:#3fb9a6; --teal-soft:#123330;
  --green:#6fd07c; --green-soft:#14331c; --amber:#f1c75c; --amber-soft:#33290c;
  --red:#f0796a; --red-soft:#341615; --violet:#a596d8; --violet-soft:#241f37;
  --magenta:#e070c0; --magenta-soft:#33112a;
  --s5:#7fa9c8; --shadow:0 6px 22px rgba(0,0,0,.45);
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
small{color:var(--muted)}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ---- topbar ---- */
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;height:64px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
/* embedded in the host app (body.embed, same pattern as org-chart): the host topbar already shows
   brand + organization/project/SIF — collapse our duplicate chrome, keep only the ⬇/⛶ tools slim + right-aligned */
body.embed .topbar{display:none}   /* embedded: host provides brand/org/project/SIF chrome, and export/fullscreen now live in each substep head — no internal topbar needed */
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line-strong);border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:15px}
.brand b{font-size:18px;letter-spacing:.2px}
.ctx{display:flex;gap:22px;min-width:0;overflow:hidden}
.ctx div{min-width:0}
.ctx label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}
.ctx strong{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:200px}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
body[data-skin="deck"] .seg button.on{color:#04121c}
.btn{border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:7px 12px;font-weight:750;font-size:12.5px;min-height:34px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
body[data-skin="deck"] .btn.primary{color:#04121c}
.btn.ghost{border-color:transparent;background:transparent}
.btn:hover{border-color:var(--blue)}

/* ---- shell: single column; substeps render as a horizontal numbered tab bar (matches the host .substep-bar) ---- */
.shell{flex:1;display:flex;flex-direction:column;min-height:0}
.substep-wrap{padding:16px 22px 0}
.substep-wrap .grp{font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.6px;margin:0 2px 7px}
.substep-bar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.step1-substep-bar{gap:6px;padding:6px;border-radius:12px;background:var(--surface);box-shadow:0 10px 28px rgba(31,41,51,.05)}
.substep-button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:36px;min-height:0;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-weight:800;line-height:1.1;padding:0 12px;white-space:nowrap}
.step1-substep-bar .substep-button{gap:8px;height:38px;border-radius:9px;padding:0 12px 0 10px;font-size:13px}
.step1-substep-bar .substep-button span{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:900}
.substep-button:hover{border-color:var(--blue)}
.substep-button.is-active{border-color:var(--blue);background:var(--blue);color:#fff}
body[data-skin="deck"] .substep-button.is-active{color:#04121c}
.step1-substep-bar .substep-button.is-active span{background:rgba(255,255,255,.22);color:#fff}
body[data-skin="deck"] .step1-substep-bar .substep-button.is-active span{color:#04121c}

.main{flex:1;min-height:0;min-width:0;overflow:auto;padding:14px 22px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
/* tile-level fullscreen (house pattern): per-work-surface ⛶, Codex-tile look */
.tilefs{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:7px;width:36px;height:36px;font-size:15px;cursor:pointer}
/* canonical host tile-action pair (matches Step II assessment): green ⬇ export + blue ⛶ fullscreen, 34px icon squares, side by side */
.head-actions{display:flex;gap:6px;align-items:center;flex:none}
.tile-export-button,.tile-fullscreen-button{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:6px;box-shadow:0 8px 18px rgba(31,41,51,.05);cursor:pointer;flex:none}
.tile-export-button{border:1px solid rgba(20,129,113,.32);background:#e8f5e9;color:#148171;font-size:15px;font-weight:850;line-height:1}
.tile-export-button:hover,.tile-export-button:focus-visible{border-color:#148171;background:#fff;outline:none}
.tile-fullscreen-button{border:1px solid rgba(0,123,192,.32);background:#e8f2f8;color:#2f7fb9}
.tile-fullscreen-button:hover,.tile-fullscreen-button:focus-visible{border-color:#2f7fb9;background:#fff;outline:none}
.fullscreen-corners{position:relative;width:18px;height:18px;display:block}
.fullscreen-corners span{display:block}
.fullscreen-corners::before,.fullscreen-corners::after,.fullscreen-corners span::before,.fullscreen-corners span::after{position:absolute;width:7px;height:7px;border-color:currentColor;content:""}
.fullscreen-corners::before{top:0;left:0;border-top:2px solid;border-left:2px solid}
.fullscreen-corners::after{top:0;right:0;border-top:2px solid;border-right:2px solid}
.fullscreen-corners span::before{right:0;bottom:0;border-right:2px solid;border-bottom:2px solid}
.fullscreen-corners span::after{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid}
body[data-skin="deck"] .tile-export-button,body[data-skin="deck"] .tile-fullscreen-button{border-color:#4b5260;background:#171b24;color:var(--ink);box-shadow:none;border-radius:14px 3px 3px 14px}
.tilefs:hover{border-color:var(--blue);color:var(--blue)}
#tileFsHost{display:none}
#tileFsHost.on{display:block;position:fixed;inset:0;z-index:300;background:var(--bg);overflow:auto;padding:18px 22px}
#tileFsHost:fullscreen,#tileFsHost:-webkit-full-screen{background:var(--bg)}
.tilefs-exit{position:fixed;top:12px;right:16px;z-index:320}
.head h1{margin:0;font-size:21px}
.head p{margin:3px 0 0;color:var(--muted);font-size:12.5px;max-width:620px}

/* ---- generic ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;border:1px solid var(--line)}
.sys{display:inline-grid;place-items:center;min-width:30px;height:20px;border-radius:6px;font-size:10.5px;font-weight:800;color:#22303b;padding:0 6px}
.sys.S1{background:#cdd5dd;color:#26313c}.sys.S2{background:var(--s2)}.sys.S3{background:var(--s3);color:#fff}
.sys.S3\*{background:var(--s3star);color:#fff}.sys.S4{background:var(--s4);color:#13340f}.sys.S5{background:var(--s5);color:#1b3346}
.muted{color:var(--muted)}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:2px 6px}
.tag.derived{background:var(--violet-soft);color:var(--violet)}
.tag.human{background:var(--teal-soft);color:var(--teal)}
.tag.cand{background:var(--amber-soft);color:#9a6a06}
.tag.acc{background:var(--green-soft);color:#3c7a44}
body[data-skin="deck"] .tag.cand{color:var(--amber)} body[data-skin="deck"] .tag.acc{color:var(--green)}
.warn{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;border-radius:7px;padding:6px 9px;background:var(--amber-soft);color:#8a5b04;border:1px solid #f0d896}
.warn.red{background:var(--red-soft);color:#a8392b;border-color:#eebcb3}
body[data-skin="deck"] .warn{color:var(--amber)} body[data-skin="deck"] .warn.red{color:var(--red)}
.warn .ico{font-weight:900}
.alg{color:var(--magenta);font-weight:900}

/* ---- 7.1 vessels ---- */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.vcol h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
.vcol .count{font-size:10.5px;color:var(--muted);font-weight:700}
/* vessel cards reuse the Step-5 contribution-card language: flat card, 4px state-coloured left stripe, identity row + body + footer */
.vcard{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:11px 12px;margin-bottom:9px;background:var(--surface);display:grid;gap:7px}
.vcard.cand{border:1px dashed var(--line-strong);border-left:4px solid var(--amber);background:var(--surface-soft)}
.videntity{display:flex;gap:9px;align-items:flex-start}
.vid-main{display:grid;gap:2px;min-width:0}
.vid-main strong{font-size:13px;overflow-wrap:anywhere}
.vid-main .vsub{font-size:10px;color:var(--muted);overflow-wrap:anywhere}
.vcard .vpp{margin:0;font-size:11.5px;color:var(--ink);line-height:1.45;overflow-wrap:anywhere}
.vcard .vpp.tbd{color:var(--muted);font-style:italic}
.vcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.vcol-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.vcol-head h3{margin:0}
.vsort-sel{font-size:10.5px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--muted);padding:2px 6px}
.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700}
.mini.go{border-color:var(--green);color:var(--green)} .mini.no{border-color:var(--red);color:var(--red)}
.prov{font-size:10px;color:var(--muted);font-style:italic}
.dupe{font-size:10.5px;color:#9a6a06;background:var(--amber-soft);border-radius:5px;padding:3px 7px;margin-top:6px;display:inline-block}

/* ---- 7.2 rasic ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:6px 9px;font-size:12px}
.rasic-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.rasic-wrap>div{min-width:0}
.matrix-scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-height:62vh}
table.rasic{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.rasic th,table.rasic td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.rasic thead th{position:sticky;z-index:3;background:var(--panel);font-weight:800;font-size:10.5px;text-align:center;padding:7px 6px;vertical-align:bottom}
table.rasic thead tr:first-child th{top:0;height:24px}
table.rasic thead tr:nth-child(2) th{top:24px}
table.rasic .grouphdr{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);cursor:pointer}
table.rasic .idcol{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:7px 9px;min-width:250px;max-width:250px}
table.rasic thead .idcol{z-index:4}
table.rasic tbody tr:hover .idcol{background:var(--surface-soft)}
table.rasic tr.sel .idcol{background:var(--blue-soft)}
.idcol .sname{font-weight:700;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.idcol .sscope{font-size:10.5px;color:var(--muted);display:block}
.idcol .sctext{font-size:10.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;margin-top:1px;font-style:italic}
.cell{width:42px;height:38px;text-align:center;vertical-align:middle}
.cell button{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:900;font-size:12px;color:var(--muted)}
/* RASIC pastel spectrum: A=red · R=yellow · S=blue · I=light grey · C=dark grey */
.cell button.A{background:#f4cfc8;border-color:#df6353;color:#a8392b}
.cell button.R{background:#fbecbb;border-color:#e0b236;color:#856012}
.cell button.S{background:#d2e6f5;border-color:#5a9bd0;color:#2b6492}
.cell button.I{background:#edf0f2;border-color:#cfd7dd;color:#7b848c}
.cell button.C{background:#aab6c0;border-color:#8a97a3;color:#2c353e}
.cell button.attn{box-shadow:0 0 0 2px var(--amber)}
/* LOUDER double-accountability: two A's on one SCT is an exception → bright red ring + pulse */
.cell button.A.conflict{border-color:#cf2e1e;color:#9a2c1e;font-weight:900;box-shadow:0 0 0 2px var(--surface),0 0 0 4px #d83a29;animation:dblA 1.4s ease-in-out infinite}
@keyframes dblA{0%,100%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #d83a29}50%{box-shadow:0 0 0 2px var(--surface),0 0 0 5px #f4796a}}
/* subtle column-group banding so Roles / Functions / Meetings read apart */
table.rasic td.cell.g-role{background:rgba(51,134,191,.055)}
table.rasic td.cell.g-function{background:rgba(23,130,117,.06)}
table.rasic td.cell.g-meeting{background:rgba(239,189,69,.10)}
table.rasic thead th.g-role{background:#e4eff7}
table.rasic thead th.g-function{background:#e1efec}
table.rasic thead th.g-meeting{background:#fbf2da}
body[data-skin="deck"] table.rasic thead th.g-role{background:#1a2e3c}
body[data-skin="deck"] table.rasic thead th.g-function{background:#173138}
body[data-skin="deck"] table.rasic thead th.g-meeting{background:#36321f}
.vhname{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:10.5px;font-weight:700;color:var(--ink);line-height:1.18;max-width:96px;min-width:72px;margin:0 auto;overflow-wrap:anywhere;hyphens:auto}
/* header hover-peek: reading 20-30 narrow vessel columns (esp. several "Director …" that clip to the same stub) — hover any header to pop its full name */
/* header hover tooltip: position:fixed so it is NOT clipped by the matrix's overflow:auto and never jumps (replaces the old label-morph peek) */
.vhtip{position:fixed;transform:translateX(-50%);background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:7px;padding:5px 9px;box-shadow:var(--shadow);font-size:11.5px;line-height:1.28;z-index:200;pointer-events:none;white-space:normal;max-width:240px;text-align:center;display:none}
.dblA-tag{display:inline-block;background:#d83a29;color:#fff;font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;letter-spacing:.3px}
table.rasic tr.rowdbl .idcol{box-shadow:inset 3px 0 0 #d83a29}
.lk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-weight:900;font-size:11px;border:1px solid}
.lk.A{background:#f4cfc8;border-color:#df6353;color:#a8392b}
.lk.R{background:#fbecbb;border-color:#e0b236;color:#856012}
.lk.S{background:#d2e6f5;border-color:#5a9bd0;color:#2b6492}
.lk.I{background:#edf0f2;border-color:#cfd7dd;color:#7b848c}
.lk.C{background:#aab6c0;border-color:#8a97a3;color:#2c353e}
.warn.loud{font-size:12.5px;font-weight:700;padding:10px 12px;border-width:2px;box-shadow:0 0 0 3px rgba(216,58,41,.12)}
.warn.loud .ico{font-size:15px}
.colgroup-collapsed{color:var(--blue)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:8px;color:var(--muted)}
.legend b{font-weight:900}
.insp{position:sticky;top:0}
.insp h3{margin:0 0 4px;font-size:14px}
.insp .kv{font-size:12px;margin:8px 0}
.insp .kv label{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;margin-bottom:2px}
.assign-list{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.assign-list div{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:4px 8px}

/* ---- 7.3 / 7.4 descriptions ---- */
.split{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.list{display:flex;flex-direction:column;gap:5px}
.lirow{text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 10px;width:100%}
.lirow.on{border-color:var(--blue);background:var(--blue-soft)}
.lirow b{font-size:12.5px;display:block}
.lirow span{font-size:10.5px;color:var(--muted)}
.desc-sec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.desc-sec .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.desc-sec .sh b{font-size:12px}
.desc-sec p,.desc-sec ul{margin:4px 0;font-size:12.5px;line-height:1.5}
.desc-sec ul{padding-left:18px}
.diff-add{background:var(--green-soft);text-decoration:none;border-radius:3px;padding:0 2px}
.diff-rm{background:var(--red-soft);text-decoration:line-through;border-radius:3px;padding:0 2px}
.preview-box{border:1px solid var(--blue);border-radius:8px;background:var(--blue-soft);padding:11px 13px;margin-bottom:12px}
.guideq2{font-size:12px;color:#4a5560;margin:0 0 8px}
.aspitems{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.asprow{display:flex;gap:6px;align-items:center}
.asprow .fld-i{flex:1;padding:7px 10px;font-size:12.5px}
.asprow .mini.no{flex:none;width:30px;padding:0}
textarea.fld-i{width:100%;min-height:46px;resize:vertical;font-size:12.5px;padding:8px 10px}
.rasic-links{display:flex;flex-direction:column;gap:9px}
.rblock{display:flex;gap:9px;align-items:flex-start}
.rblock .lk{flex:none;margin-top:1px}
.rnames>b{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:1px}
.rnames>div:last-child{font-size:12.5px;line-height:1.55}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-soft);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:11.5px}
.mchip button{border:0;background:none;color:var(--red);font-weight:800;cursor:pointer;padding:0 4px;line-height:1}
.inh-note{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
.inh-items{display:flex;flex-wrap:wrap;gap:5px}
/* source tag on aspect rows: violet = shared/inherited from an SCT (write-through), teal = vessel-specific */
.inh-src{flex:none;font-size:9px;font-weight:800;letter-spacing:.3px;border:1px solid var(--violet);color:var(--violet);background:var(--violet-soft);border-radius:4px;padding:1px 5px;white-space:nowrap}
.inh-src.own{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
/* optional owner per aspect row — compact vessel picker (role / function / meeting) */
.own-sel{flex:none;max-width:150px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);font-size:11px;padding:6px 5px}
.own-sel.set{color:var(--ink);border-color:var(--line-strong)}
/* metric detail sub-row: target · frequency · source (KPIs only) */

function scopeFilter(countsOverride){
  const cur=state.filter.scope||'sif';
  const counts=countsOverride||scopeCounts();
  const levels=[...new Set(UNITS.map(u=>normalizeLevel(u.level)).filter(l=>l&&l!=='R0'))].sort((a,b)=>recursionLevelValue(b)-recursionLevelValue(a));
  const levelOptions=levels.map(l=>{
    const count=counts.levels[l]||0;
    return `<option value="level:${esc(l)}" ${cur===`level:${l}`?'selected':''} ${count?'':'disabled'}>Scope: ${esc(l)} (${count})</option>`;
  }).join('');
  return `<select data-act="filter" data-key="scope">
    <option value="sif" ${cur==='sif'?'selected':''}>Scope: R0 / SIF (${counts.sif})</option>
    <option value="all" ${cur==='all'?'selected':''}>Scope: all recursion levels (${counts.all})</option>
    ${levelOptions}
  </select>`;
}
function normalizeFilterScope(){
  const scope=state.filter.scope||'sif';
  if(!scope.startsWith('level:'))return;
  const level=scope.slice(6);
  if(!(scopeCounts().levels[level]||0))state.filter.scope='sif';
}
function scopeCounts(){
  const counts={sif:0,all:CONTRIBS.length,levels:{}};
  const sifIds=sifScopeUnitIds();
  CONTRIBS.forEach(c=>{
    const level=normalizeLevel(unit(c.unit).level);
    if(level)counts.levels[level]=(counts.levels[level]||0)+1;
    if(sifIds.has(c.unit)||level==='R0')counts.sif+=1;
  });
  return counts;
}
function scopeSctCounts(){
  const counts={sif:0,all:0,levels:{}};
  const sifIds=sifScopeUnitIds();
  const allScts=new Set(), sifScts=new Set(), levelScts={};
  CONTRIBS.forEach(c=>{
    if(!sct(c.sct).id)return;
    allScts.add(c.sct);
    const level=normalizeLevel(unit(c.unit).level);
    if(level){
      if(!levelScts[level])levelScts[level]=new Set();
      levelScts[level].add(c.sct);
    }
    if(sifIds.has(c.unit)||level==='R0')sifScts.add(c.sct);
  });
  counts.all=allScts.size;
  counts.sif=sifScts.size;
  Object.keys(levelScts).forEach(level=>{counts.levels[level]=levelScts[level].size;});
  return counts;
}
function scopeMatchesContribution(c){
  const scope=state.filter.scope||'sif';
  if(scope==='all')return true;
  const u=unit(c.unit);
  if(scope==='sif'){
    return sifScopeUnitIds().has(c.unit)||normalizeLevel(u.level)==='R0';
  }
  if(scope.startsWith('level:'))return normalizeLevel(u.level)===scope.slice(6);
  return c.unit===scope;
}
function sifScopeUnitIds(){
  const ids=new Set();
  if(CTX_META.sif&&UNITS.some(u=>u&&u.id===CTX_META.sif))ids.add(CTX_META.sif);
  UNITS.forEach(u=>{if(u&&(u.sif===true||normalizeLevel(u.level)==='R0'))ids.add(u.id);});
  const fallback=defaultScopeUnitId();
  if(fallback)ids.add(fallback);
  return ids;
}
function normalizeLevel(level){return String(level||'').trim().toUpperCase().replace(/\s+/g,'');}
function recursionLevelValue(level){
  const m=normalizeLevel(level).match(/^R([+-]?\d+)$/);
  return m?Number(m[1]):0;
}
function hasActiveFilters(){
  const f=state.filter;
  return (f.scope&&f.scope!=='sif')||f.sys||f.prio||f.unit||f.vtype||f.attn||f.q;
}
function selF(key,label,opts){
  const cur=state.filter[key];
  const o=opts.map(o=>{const[val,txt]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${cur===val?'selected':''}>${esc(txt)}</option>`;}).join('');

}

/* anchored-popover placement: below the anchor, flip above only if it fits, else clamp inside the viewport (fixes tall pickers overshooting to the top) */
function placePop(el,anchor){ if(!el||!anchor)return; const fixed=popHost()!==document.body;   // inside the tile-fullscreen host: fixed = viewport coords, no page scroll offsets
  el.style.position=fixed?'fixed':'absolute'; el.style.top='0px'; el.style.left='0px';
  const pr=el.getBoundingClientRect(), r=anchor.getBoundingClientRect(), sx=fixed?0:window.scrollX, sy=fixed?0:window.scrollY, vw=window.innerWidth, vh=window.innerHeight;
  let left=r.left+sx; if(left+pr.width>sx+vw-8)left=sx+vw-pr.width-8; if(left<sx+8)left=sx+8;
  let top=r.bottom+sy+6; if(top+pr.height>sy+vh-8){ const above=r.top+sy-pr.height-6; top=above>=sy+8?above:Math.max(sy+8,sy+vh-pr.height-8); }
  el.style.left=left+'px'; el.style.top=top+'px'; }

function sysBadge(s){ const col={S1:'#34404c',S2:'#efbd45',S3:'#df6353','S3*':'#b85045',S4:'#63b16c',S5:'#9dbed2'}[s]||'#8a97a3'; const ink=(s==='S2'||s==='S5')?'#1c2a33':'#fff'; return s?`<b style="display:inline-block;background:${col};color:${ink};border-radius:4px;padding:0 5px;font-size:10px">${esc(s)}</b>`:''; }
function buildStep7Report(){
  const dtParts=new Date().toString();
  const RCOL={A:'#f4cfc8',R:'#fbecbb',S:'#d2e6f5',I:'#edf0f2',C:'#aab6c0'};
  const roles=VESSELS.filter(v=>v.type==='role'),funcs=VESSELS.filter(v=>v.type==='function'),meets=VESSELS.filter(v=>v.type==='meeting');
  // 7.1 registers

  // 7.2 RASIC matrix
  const cols=VESSELS;
  const head=`<tr><th class="idc">SCT · Contribution</th>${cols.map(v=>`<th class="vh"><div>${esc(v.name)}</div></th>`).join('')}</tr>`;
  const body=CONTRIBS.map(c=>{ const w=warnings(c.id);
    const cells=cols.map(v=>{ const l=rg(c.id,v.id); return `<td style="${l?`background:${RCOL[l]}`:''}">${l||''}</td>`; }).join('');
    return `<tr><td class="idc">${sysBadge(c.sys)} <b>${esc(sct(c.sct).did)}</b> ${esc(sct(c.sct).name)}<div class="mut">${esc(unit(c.unit).name)} · ${esc(c.text)}</div>${w.length?`<div class="wf">${w.map(x=>`<span class="${x.red?'r':'a'}">⚠ ${esc(x.t)}</span>`).join('')}</div>`:''}</td>${cells}</tr>`;
  }).join('');
  const gaps=CONTRIBS.filter(c=>needsAttention(c.id)).length;
  // 7.3 aspects per SCT
  const aspDetailTxt=x=>{ if(!x||typeof x!=='object')return ''; const d=[]; if(x.target)d.push(esc(x.target)); if(x.frequency)d.push(esc(x.frequency)); if(x.source)d.push('src: '+esc(objLabel(x.source)||x.source)); if(x.owner)d.push('owner: '+esc(ownerName(x.owner))); return d.length?` <span class="mut">· ${d.join(' · ')}</span>`:''; };
  const asp=SCTS.filter(s=>ASPECTS[s.id]&&aspectCount(s.id)).map(s=>{ const a=ASPECTS[s.id]; const li=(arr)=>arr.length?arr.map(x=>`<li>${esc(itxt(x))}${aspDetailTxt(x)}</li>`).join(''):'<li class="mut">—</li>';
    return `<div class="cardlet"><h4>${sysBadge(s.sys)} ${esc(s.did)} ${esc(s.name)}</h4><div class="g3"><div><label>Metrics &amp; KPIs</label><ul>${li(a.kpis)}</ul></div><div><label>Artifacts</label><ul>${li(a.artifacts)}</ul></div><div><label>Tools / methods</label><ul>${li(a.tools)}</ul></div></div></div>`; }).join('')||'<p class="mut">No aspects authored yet.</p>';
  // 7.4/7.5 descriptions
  const descBlock=(kind)=>VESSELS.filter(v=>v.type===kind).map(v=>{ const g=linkedByRASIC(v.id),h=HUMAN[v.id]||{},inh=inheritedAspects(v.id),va=VASPECTS[v.id]||{kpis:[],artifacts:[],tools:[]},mem=(MEMBERSHIP[v.id]||[]);
    const links=['A','R','S','C','I'].filter(L=>g[L].length).map(L=>`<div><b>${RLABEL[L]}</b>: ${g[L].map(c=>esc(sct(c.sct).did)).join(', ')}</div>`).join('')||'<span class="mut">no RASIC links</span>';
    const asL=(arr)=>arr.map(x=>esc(itxt(x.v||x))).join(', ')||'—';
    return `<div class="cardlet"><h4>${sysBadge(v.sys)} ${esc(v.name)}</h4>
      ${h.purpose?`<p><label>Purpose</label> ${esc(h.purpose)}</p>`:''}${h.interfaces?`<p><label>Interfaces</label> ${esc(h.interfaces)}</p>`:''}
      <div class="mut" style="font-size:11px">${links}</div>
      <p><label>Metrics &amp; KPIs</label> ${asL(inh.kpis)}${va.kpis.length?' · '+va.kpis.map(x=>esc(itxt(x))).join(', '):''}</p>

      <p><label>Tools</label> ${asL(inh.tools)}${va.tools.length?' · '+va.tools.map(x=>esc(itxt(x))).join(', '):''}</p>
      ${mem.length?`<p><label>Meetings</label> ${mem.map(id=>esc(vessel(id).name)).join(', ')}</p>`:''}</div>`; }).join('');
  // 7.6 meeting charters
  const chBlock=meets.map(m=>{ const c=mtg(m.id); const chips=arr=>arr.length?arr.map(x=>`<span class="ck">${esc(x.label||x.decision||'')}${x.roleType?` <i>(${esc(x.roleType)})</i>`:''}${x.kind==='meeting'?' ⟲':''}${x.use?` <i>${esc(x.use.target)} · ${esc(x.use.freq)}</i>`:''}</span>`).join(' '):'<span class="mut">—</span>';

      <p><label>Step VI loops</label> ${c.loops.map(l=>esc(l.relation+' '+l.label)).join(', ')||'<span class="mut">—</span>'}</p></div>`; }).join('');

function step7Model(){ return JSON.parse(JSON.stringify({ vessels:VESSELS, rasic:RASIC, aspects:ASPECTS, descriptions:HUMAN, membership:MEMBERSHIP, vesselAspects:VASPECTS, meetings:mtgModel(), orgHierarchy:ORGHIER })); }

function postToHost(msg){ try{ if(inFrame) window.parent.postMessage(msg,'*'); }catch(_){ } try{ if(window.STEP7&&typeof window.STEP7.onEmit==='function') window.STEP7.onEmit(msg); }catch(_){ } }
function emit(evt,extra){ postToHost(Object.assign({evt},extra||{})); }
function emitChange(){ clearTimeout(_emitT); _emitT=setTimeout(()=>emit('change',{model:step7Model()}),120); }   // authoritative, debounced; fired only on genuine user edits
const _replArr=(a,x)=>{ a.length=0; (Array.isArray(x)?x:[]).forEach(i=>a.push(i)); };
const _replObj=(o,x)=>{ Object.keys(o).forEach(k=>delete o[k]); if(x&&typeof x==='object') Object.assign(o,x); };
function step7Export(o){ exportStep7(o||{}); }   // all-substep report; front-end download (Blob). Host may still orchestrate its own export via the bridge.
window.STEP7={
  setContext:c=>{ if(!c||typeof c!=='object')return; if(c.meta&&typeof c.meta==='object')_replObj(CTX_META,c.meta); if(Array.isArray(c.units))_replArr(UNITS,c.units); if(Array.isArray(c.scts))_replArr(SCTS,c.scts); if(Array.isArray(c.contribs))_replArr(CONTRIBS,c.contribs); if(Array.isArray(c.vessels))_replArr(VESSELS,c.vessels);
    if(Array.isArray(c.metricDefs))_replArr(CTX_METRICDEFS,c.metricDefs); if(Array.isArray(c.artifactDefs))_replArr(CTX_ARTIFACTDEFS,c.artifactDefs); if(Array.isArray(c.toolDefs))_replArr(CTX_TOOLDEFS,c.toolDefs); if(Array.isArray(c.decisionDefs))_replArr(CTX_DECISIONDEFS,c.decisionDefs); if(Array.isArray(c.loops))_replArr(CTX_LOOPS,c.loops);
    _mtgVer++; mtgPrune(); render(); },   // SILENT (host truth in)
  loadModel:m=>{ if(!m||typeof m!=='object')return; if(Array.isArray(m.vessels))_replArr(VESSELS,m.vessels); if(m.rasic)_replObj(RASIC,m.rasic); if(m.aspects)_replObj(ASPECTS,m.aspects); if(m.descriptions)_replObj(HUMAN,m.descriptions); if(m.membership)_replObj(MEMBERSHIP,m.membership); if(m.vesselAspects)_replObj(VASPECTS,m.vesselAspects); if(m.meetings&&typeof m.meetings==='object')_replObj(MEETINGS,m.meetings); if(m.orgHierarchy&&typeof m.orgHierarchy==='object')ORGHIER=JSON.parse(JSON.stringify(m.orgHierarchy)); _mtgVer++; mtgPrune(); state.selContrib=null; render(); },   // SILENT; orgHierarchy = the host echoing back the persisted 7.7 layout (Codex slice)
  setVessels:v=>{ if(Array.isArray(v))_replArr(VESSELS,v); render(); },
  setRasic:r=>{ if(r&&typeof r==='object')_replObj(RASIC,r); render(); },
  goto:s=>{ const map={vessels:'7.1',rasic:'7.2',aspects:'7.3',roles:'7.4',functions:'7.5',meetings:'7.6',org:'7.7'}; const id=map[s]||s; if(STEPS.some(x=>x.id===id)){mClosePicker();mCloseRt();mCloseRc();state.useEdit=null;if(state.tileFs)exitTileFs();state.step=id;render();} },
  /* 'meeting' resolves against mtgList(), not MEETINGS: a charter derived from a meeting vessel is
     only serialized into MEETINGS once it has been opened, so an unopened one would fail that test */
  select:ref=>{ if(ref&&ref.kind==='contrib')state.selContrib=ref.id||ref.contribId;
    else if(ref&&ref.kind==='node')state.selNode=ref.id;
    else if(ref&&ref.kind==='meeting'&&ref.id&&mtgList().some(m=>m.id===ref.id))state.selMtg=ref.id;
    else if(ref==null){state.selContrib=null;state.selNode=null;} render(); },
  filter:spec=>{ state.filter=Object.assign(defaultFilters(),spec||{}); render(); },
  fullscreen:on=>{ if(on===false){const fn=document.exitFullscreen||document.webkitExitFullscreen;fn&&fn.call(document);} else if(on===true){const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;fn&&fn.call(el);} else toggleFs(); },
  isFullscreen:()=>isFs(),
  setSkin:setStep7Skin,
  export:o=>step7Export(o||{}),                 // legacy: front-end Blob report (kept until Codex's VII generator lands)
  openExport:vm=>openStep7Export(vm||null),     // open the SHARED app-wide export panel inside Step VII (B6)
  onEmit:null,
  getState:()=>step7State()
};
window.addEventListener('message',e=>{ const m=e.data; if(!m||typeof m!=='object'||!m.cmd)return;   // HOST -> frame
  const S=window.STEP7;
  if(relayExportDown(m))return;   // B6: shell-driven Step VII export-panel relay (setViewModel/open/…) — handled before STEP7 cmds
  if(m.cmd==='setContext')S.setContext(m);
  else if(m.cmd==='loadModel')S.loadModel(m.model);
  else if(m.cmd==='setVessels')S.setVessels(m.vessels);
  else if(m.cmd==='setRasic')S.setRasic(m.rasic);
  else if(m.cmd==='goto')S.goto(m.substep);
  else if(m.cmd==='select')S.select(m.ref);
  else if(m.cmd==='filter')S.filter(m.spec);
  else if(m.cmd==='setSkin')S.setSkin(m.skin);
  else if(m.cmd==='fullscreen')S.fullscreen(m.on);
  else if(m.cmd==='export')step7Export(m);
});

/* ---- step7-ux is HOST to the embedded org-chart.html (substep 7.7): feed it the canonical model, and
   apply its propose-only requestFix intents to the RASIC store so the accountability loop visibly closes ---- */
let ORGHIER={};   // canonical 7.7 org hierarchy (nodeId → {parent,order,slot}) — mirrored from org-chart's change events, fed back on remount, and shipped to the host inside step7Model() as `orgHierarchy`
function orgSend(msg){ const f=document.getElementById('orgFrame'); if(f&&f.contentWindow) f.contentWindow.postMessage(msg,'*'); }
function orgSendSkin(){ sendSkinToEmbeddedFrame(document.getElementById('orgFrame')); }
function orgFeed(){ orgSend({cmd:'setContext',units:UNITS,vessels:VESSELS,contribs:CONTRIBS,scts:SCTS,rasic:RASIC,sifName:(unit('u-sif').name||'System-in-Focus')}); orgSend({cmd:'loadModel',model:{units:UNITS,vessels:VESSELS,contribs:CONTRIBS,rasic:RASIC,scts:SCTS,hierarchy:ORGHIER}}); orgSendSkin(); }   // hierarchy: {} is ignored by org's loadModel guard, so pre-first-edit feeds leave its own seeding/localStorage untouched
window.addEventListener('message',e=>{ const m=e.data; if(!m||typeof m!=='object'||!m.evt)return;   // org-chart iframe -> step7-ux (this host)
  const f=document.getElementById('orgFrame'); if(!f||e.source!==f.contentWindow)return;
  if(m.evt==='ready'){ orgFeed(); }
  else if(m.evt==='change'&&m.model&&typeof m.model==='object'){   // org structural edit (created/moved/removed 7.7 boxes) → adopt vessels + hierarchy, then ride the EXISTING host change pipeline so it persists in the workspace
    if(Array.isArray(m.model.vessels)) _replArr(VESSELS,m.model.vessels);
    if(m.model.hierarchy&&typeof m.model.hierarchy==='object') ORGHIER=m.model.hierarchy;
    emitChange(); }
  else if(m.evt==='requestExportPanel'){ openStep7Export(orgChartExportVm()); }   // org-chart's own toolbar ⬇ (embedded) → open the SHARED panel for step7/org-chart (UX streamline S3)
  else if(m.evt==='exportRender'&&_orgExp[m.requestId]){   // org returned bytes → forward the held export intent UP, enriched with the artifact (host downloads + exportReady)
    const intent=_orgExp[m.requestId]; delete _orgExp[m.requestId];
    // forward the USER's chosen format (intent.format), NOT the rendered one: for pptx the org frame renders a PNG (m.format==='png') and the HOST wraps that PNG into the deck. For svg/png the two already match.
    postToHost(Object.assign({},intent,{format:intent.format,artifact:{mimeType:m.mimeType,dataUrl:m.dataUrl,suggestedName:m.suggestedName||null}})); }
  else if(m.evt==='exportError'&&_orgExp[m.requestId]){   // org failed to render → tell the nested panel (the intent never reached the host)
    delete _orgExp[m.requestId]; expPost({cmd:'exportError',requestId:m.requestId,message:m.message||'Org chart render failed'}); }
  else if(m.evt==='requestFix'&&m.contribId&&m.vesselId){ RASIC[m.contribId+'|'+m.vesselId]=m.letter||'A'; _mtgVer++; orgFeed(); emit('rasic',{contribId:m.contribId,vesselId:m.vesselId,letter:m.letter||'A',via:'org-chart'}); emitChange(); }
  else if(m.evt==='acknowledgeException'){ emit('warningAction',{action:'acknowledge',contribId:m.contribId,note:m.note||'',via:'org-chart'}); }
});

/* ---- B6 · Step VII embeds the SHARED app-wide export panel (export-panel.html) as a nested overlay and
   RELAYS it to the shell, so the app's ONE export surface works inside Step VII without step7-ux owning any
   file generation. Protocol (proposed for Codex — handoff §J):
     DOWN (shell → this frame): panel commands relayed to the nested panel by name — setViewModel · open ·
       setBundle · exportReady · exportError · closeExport, plus openExport (= open with step7-ux's own
       substeps view-model). setSkin fans out to it like every embedded frame.
     UP (this frame → shell): the panel's api:1 export / needViewModel / cancel events are forwarded
       VERBATIM (per B6 the shell routes them by e.source === the Step VII frame).
   Additive & host-overridable: the legacy #exportBtn Blob report stays live until Codex's Step VII
   generator lands (then the button repoints to openStep7Export). ---- */
function expSrc(){ const q=new URLSearchParams(location.search); const v=q.get('v'); return q.get('exportpanel') || ('export-panel.html'+(v?'?v='+encodeURIComponent(v):'')); }   // sibling in design-previews/; forwards the host cache label
let _expFrame=null, _expReady=false; const _expQueue=[];
function ensureExportFrame(){
  if(_expFrame&&document.body.contains(_expFrame))return _expFrame;
  const f=document.createElement('iframe');
  f.id='exportFrame'; f.title='Export'; f.src=expSrc(); f.setAttribute('allow','fullscreen');
  /* NEVER display:none — release Safari leaves a hidden iframe's internal FrameView stale and re-shows it
     laid out against the OLD viewport (drawer mid-window + dead-white backing store = the Safari "flip").
     visibility:hidden keeps layout live but un-hit-testable; the off-screen transform guards Safari's
     non-spec wheel routing into covered iframes (the earlier Step-7 scroll-swallow bug). */
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:80;background:transparent;visibility:hidden;pointer-events:none;transform:translateX(-200%)';   // % not vw/vh (replaced element: inset alone = 300×150); expShow() pins live px on open
  f.addEventListener('load',()=>sendSkinToEmbeddedFrame(f));
  document.body.appendChild(f); _expFrame=f; return f;
}
function expPost(msg){ const f=ensureExportFrame(); if(_expReady&&f.contentWindow){ try{f.contentWindow.postMessage(msg,'*');}catch(_){ } } else _expQueue.push(msg); }
function expFlush(){ const f=_expFrame; if(!f||!f.contentWindow)return; while(_expQueue.length){ try{f.contentWindow.postMessage(_expQueue.shift(),'*');}catch(_){ break; } } }
function expShow(on){ const f=ensureExportFrame();
  if(on){ const r=document.documentElement;   // Safari heal: pin to the LIVE viewport in px — a real size change forces WebKit to resize the child FrameView
    f.style.width=r.clientWidth+'px'; f.style.height=r.clientHeight+'px'; }
  else { f.style.width=''; f.style.height=''; }
  f.style.visibility=on?'visible':'hidden'; f.style.pointerEvents=on?'auto':'none'; f.style.transform=on?'none':'translateX(-200%)';
  void f.getBoundingClientRect(); }
function step7ExportVm(){ return {
  stepId:'step7', tileId:'all', title:'Step VII · Representation', kind:'substeps', count:STEPS.length,
  unitNoun:'substeps', monolithic:true, defaultPreset:'doc', availableFormats:['docx'],   // Word only (2026-07-24 Stage 2): real OOXML via Codex's buildSimpleDocx. The flat-text PDF was dropped — MUST stay in lockstep with exportViewModels.js getStep7RepresentationExportViewModel (asset-test 'Step VII export formats stay in lockstep' enforces it)
  availableScopes:[{kind:'step',label:'All substeps',count:STEPS.length}],
  availableIncludes:['notes','owners','gaps','warnings'],
  substeps:STEPS.map(s=>({id:s.id,title:s.t})), project:{name:CTX_META.sifName||'VSM7',date:''} }; }
/* 7.7 org-chart export: png/svg client-rendered here; pptx = the host wraps our PNG into a real single-slide 16:9 deck (Stage 2) */
function orgChartExportVm(){ return {
  stepId:'step7', tileId:'org-chart', title:'Org Chart (7.7)', kind:'canvas', count:1,
  unitNoun:'chart', monolithic:true, defaultPreset:'exec', availableFormats:['png','svg','pptx'],
  availableScopes:[{kind:'tile',label:'This chart',count:1}], availableIncludes:[],
  project:{name:CTX_META.sifName||'VSM7',date:''} }; }
const _orgExp={};   // pending org-chart export intents by requestId (awaiting bytes from the org frame)
function openStep7Export(vm){ const model=vm||step7ExportVm(); expShow(true);
  expPost({cmd:'setViewModel',stepId:model.stepId,tileId:model.tileId,vm:model});
  expPost({cmd:'open',stepId:model.stepId,tileId:model.tileId,origin:'step'}); }
const _EXP_CMDS={setViewModel:1,open:1,setBundle:1,exportReady:1,exportError:1};
function relayExportDown(m){   // returns true when it consumes the message
  if(m.cmd==='openExport'){ openStep7Export(m.vm||null); return true; }
  if(m.cmd==='closeExport'){ if(_expFrame){ expPost({cmd:'close'}); expShow(false); } return true; }
  if(_EXP_CMDS[m.cmd]){ if((m.cmd==='exportReady'||m.cmd==='exportError')&&!_expFrame)return true;
    if(m.cmd==='open')expShow(true); expPost(m); if(m.cmd==='exportReady')expShow(false); return true; }
  return false;
}
window.addEventListener('message',e=>{ const m=e.data; if(!m||typeof m!=='object'||!m.evt)return;   // export panel iframe -> step7-ux
  const f=_expFrame; if(!f||e.source!==f.contentWindow)return;
  if(m.evt==='ready'){ _expReady=true; expFlush(); return; }
  if(m.evt==='resize')return;                        // full-viewport overlay; sizing is CSS
  if(m.evt==='cancel')expShow(false);
  if(m.evt==='export'&&m.stepId==='step7'&&m.tileId==='org-chart'){   // 7.7: hold the intent, fetch bytes from the org-chart frame, forward ENRICHED (see org handler)
    _orgExp[m.requestId]=m; orgSend({cmd:'renderExport',format:m.format,requestId:m.requestId}); return; }
  if(m.evt==='export'||m.evt==='needViewModel'||m.evt==='cancel') postToHost(m);   // forward VERBATIM (shell keys on e.source)
});

render();
emit('ready',{api:2});   // fire-once handshake; api:2 = front-end consumes the additive reuse contract (metricDefs/artifactDefs/toolDefs/decisionDefs/loops in + meetings round-trip)
</script>
</body>
</html>
