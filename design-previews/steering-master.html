<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSM7 · Steering Master — the control organization</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f6f5;--surface:#ffffff;--surface-soft:#f7fafb;--panel:#eef3f2;
  --line:#cfdad5;--line-strong:#9dafaa;--ink:#1f2935;--muted:#667482;
  --blue:#3386bf;--blue-soft:#e8f2f9;--teal:#178275;--green:#63b16c;--amber:#efbd45;--red:#df6353;--violet:#8171b4;
  --s1:#34404c;--s2:#efbd45;--s3:#df6353;--s3star:#b85045;--s4:#63b16c;--s5:#9dbed2;--alg:#c0399f;
  --radius:9px;--shadow:0 4px 16px rgba(20,40,40,.08);
}
body[data-skin="deck"]{
  --bg:#0f1822;--surface:#172430;--surface-soft:#1c2c3a;--panel:#13202b;--line:#2c3f4f;--line-strong:#3d5568;
  --ink:#eaf1f6;--muted:#90a6b6;--blue:#57aee6;--blue-soft:#16303f;--teal:#3fb9a6;--green:#6fd07c;--amber:#f1c75c;--red:#f0796a;--violet:#a596d8;--s5:#7fa9c8;
  --shadow:0 6px 22px rgba(0,0,0,.45);
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- topbar (collapses when embedded) ---------- */
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;height:62px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:14px}
.brand b{font-size:17px}
.ctx{display:flex;gap:20px;min-width:0;overflow:hidden}
.ctx div{min-width:0}
.ctx label{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.ctx strong{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tools{display:flex;align-items:center;gap:8px;flex:none}
body.embed .topbar{display:none}

/* the house action pair (identical to the host tiles / org-chart) */
.tile-export-button,.tile-fullscreen-button{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:6px;box-shadow:0 8px 18px rgba(31,41,51,.05);flex:none}
.tile-export-button{border:1px solid rgba(20,129,113,.32);background:#e8f5e9;color:#148171;font-size:15px;font-weight:850;line-height:1}
.tile-export-button:hover,.tile-export-button:focus-visible{border-color:#148171;background:#fff;outline:none}
.tile-fullscreen-button{border:1px solid rgba(0,123,192,.32);background:#e8f2f8;color:#2f7fb9}
.tile-fullscreen-button:hover,.tile-fullscreen-button:focus-visible{border-color:#2f7fb9;background:#fff;outline:none}
.fullscreen-corners{position:relative;width:18px;height:18px;display:block}
.fullscreen-corners span{display:block}
.fullscreen-corners::before,.fullscreen-corners::after,.fullscreen-corners span::before,.fullscreen-corners span::after{position:absolute;width:7px;height:7px;border-color:currentColor;content:""}
.fullscreen-corners::before{top:0;left:0;border-top:2px solid;border-left:2px solid}
.fullscreen-corners::after{top:0;right:0;border-top:2px solid;border-right:2px solid}
.fullscreen-corners span::before{right:0;bottom:0;border-right:2px solid;border-bottom:2px solid}
.fullscreen-corners span::after{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid}
body[data-skin="deck"] .tile-export-button,body[data-skin="deck"] .tile-fullscreen-button{border-color:#4b5260;background:#171b24;color:var(--ink);box-shadow:none}

/* ---------- sub bar: lenses + honesty headline ---------- */
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 22px}
.subbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tog{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tog.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.tog .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.divider{width:1px;height:22px;background:var(--line)}
.hpill{margin-left:auto;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12.5px;background:var(--surface);cursor:pointer}
.hpill.attn{border-color:var(--red);color:var(--red);background:#fdeeeb}
body[data-skin="deck"] .hpill.attn{background:#2b1a18}
.hpill b{font-weight:850}
.hpill .sep{color:var(--line-strong)}

/* ---------- the split: diagram library (left) · bands (right) ---------- */
.wrap{display:grid;grid-template-columns:minmax(320px,38%) minmax(0,1fr);gap:14px;align-items:start;flex:1;min-height:0}
.diagram-card{position:sticky;top:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.diagram-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.diagram-head b{font-size:12.5px}
.diagram-head .hint{font-size:10.5px;color:var(--muted)}
#vsmframe{width:100%;border:0;background:var(--surface);display:block;flex:1;min-height:420px}
.diagram-foot{padding:7px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);background:var(--surface-soft)}

.bands{display:flex;flex-direction:column;gap:10px;min-width:0}

/* ---------- one management band ---------- */
.band{border:1px solid var(--line);border-left-width:5px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.band.sel{border-color:var(--blue);border-left-color:var(--sysc);box-shadow:0 0 0 1px var(--blue) inset,var(--shadow)}
.band.dim{opacity:.42}
.band-head{display:flex;align-items:center;gap:11px;padding:10px 13px;cursor:pointer}
.band-head:hover{background:var(--surface-soft)}
.sysdot{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;font-weight:900;font-size:12px;flex:none;letter-spacing:-.3px}
.band-title{min-width:0;flex:1}
.band-title b{display:block;font-size:14px;line-height:1.25}
.band-title span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.band-counts{display:flex;gap:7px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.cnt{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--muted);background:var(--surface-soft);white-space:nowrap}
.cnt b{color:var(--ink);font-weight:850}
.cnt.warn{border-color:var(--red);color:var(--red);background:#fdeeeb}
body[data-skin="deck"] .cnt.warn{background:#2b1a18}
.band-body{padding:0 13px 13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}
.band.collapsed .band-body{display:none}

.slot{border:1px solid var(--line);border-radius:8px;background:var(--surface-soft);padding:9px 10px;min-width:0}
.slot h4{margin:0 0 7px;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:6px}
.slot h4 .src{margin-left:auto;font-weight:700;font-size:9px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);text-transform:none;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:3px 8px;font-size:11.5px;margin:0 4px 4px 0;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--blue)}
.chip .did{font-weight:850;font-size:10px;color:var(--muted);flex:none}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.cand{border-style:dashed}
.chip.orphan{border-color:var(--red);background:#fdeeeb}
body[data-skin="deck"] .chip.orphan{background:#2b1a18}
.chip .flag{color:var(--red);font-weight:900}
.chip.organ .cad{font-size:10px;color:var(--muted);flex:none}
.chip.gc{border-color:var(--amber);background:#fdf6e3}
body[data-skin="deck"] .chip.gc{background:#2e2712}
.empty{font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.45}
.empty b{font-style:normal;color:var(--ink)}
.instr{display:flex;flex-wrap:wrap;gap:4px}
.itag{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;background:var(--surface)}
.itag i{font-style:normal;color:var(--muted);font-weight:800;margin-right:4px}
.acct{display:flex;flex-direction:column;gap:4px}
.acctrow{display:flex;align-items:center;gap:6px;font-size:11.5px}
.acctrow .who{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctrow .cover{margin-left:auto;font-size:10px;color:var(--muted);flex:none}
.loops{display:flex;flex-direction:column;gap:4px}
.loop{display:flex;align-items:center;gap:7px;font-size:11.5px}
.loop .rag{width:9px;height:9px;border-radius:50%;flex:none}
.loop .lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loop .lnote{margin-left:auto;font-size:10px;color:var(--muted);flex:none}
.rag.g{background:var(--green)}.rag.a{background:var(--amber)}.rag.r{background:var(--red)}.rag.n{background:var(--line-strong)}

/* S1 context strip */
.s1strip{border:1px dashed var(--line-strong);border-radius:var(--radius);background:transparent;padding:9px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.s1strip .lab{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.s1chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;background:var(--surface)}

/* footer note */
.note{margin-top:11px;font-size:11.5px;color:var(--muted);line-height:1.5}
.note b{color:var(--ink)}

/* popover */
.pop{position:fixed;z-index:60;width:min(340px,90vw);border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);box-shadow:0 16px 44px rgba(0,0,0,.22);padding:13px 14px;font-size:12.5px}
.pop h3{margin:0 0 3px;font-size:14px}
.pop .sub{font-size:11px;color:var(--muted);margin-bottom:8px}
.pop .kv{margin-top:7px}
.pop .kv label{display:block;font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
.pop .warnrow{border:1px solid var(--red);background:#fdeeeb;color:#a8452f;border-radius:6px;padding:5px 8px;font-size:11.5px;margin-top:6px}
body[data-skin="deck"] .pop .warnrow{background:#2b1a18;color:var(--red)}
.pop .close{position:absolute;top:8px;right:9px;border:0;background:transparent;color:var(--muted);font-size:15px}
.pop .jump{margin-top:9px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700}
.pop .jump:hover{border-color:var(--blue);color:var(--blue)}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr)} .diagram-card{position:static} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">V7</div><b>VSM7</b></div>
    <div class="ctx">
      <div><label>System-in-Focus</label><strong id="ctxSif">EU AI Solutions SE · R0</strong></div>
      <div><label>View</label><strong>Steering Master — the control organization</strong></div>
    </div>
    <div class="tools">
      <button class="tile-export-button" data-act="export" title="Export the steering overview" aria-label="Export"><span aria-hidden="true">⬇</span></button>
      <button class="tile-fullscreen-button" id="fsBtn" title="Full screen (F)" aria-label="Full screen"><span class="fullscreen-corners" aria-hidden="true"><span></span></span></button>
    </div>
  </header>

  <main class="main">
    <div class="subbar" id="subbar"></div>
    <div class="wrap">
      <div class="diagram-card">
        <div class="diagram-head"><b>Steering systems</b><span class="hint">click a system to focus its band</span></div>
        <iframe id="vsmframe" title="VSM system diagram"></iframe>
        <div class="diagram-foot">The shared VSM diagram — reused as-is. Selecting here filters the bands; selecting a band highlights here.</div>
      </div>
      <div class="bands" id="bands"></div>
    </div>
    <div class="note" id="note"></div>
  </main>
</div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clip=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;};

/* ============================ THE STEERING SYSTEMS (canonical order + epithets from the method) ============================
   Bands run Normative → Strategic → Operative (+ its independent audit lane) → Coordinative, exactly the
   management bands of the target-structure picture. S1 is context only: this page is about the METASYSTEM. */
const SYSTEMS=[
  {id:'S5', band:'Normative',    epithet:'Normative Guidelines',              colour:'--s5',     el:'5',  hl:['s5box','sp54','h5'],   ask:'Who do we want to be? Which guardrails hold?'},
  {id:'S4', band:'Strategic',    epithet:'Now & Then',                        colour:'--s4',     el:'4',  hl:['s4box','s4env','sp43','h34'], ask:'What is coming? Where is the business going?'},
  {id:'S3', band:'Operative',    epithet:'Inside & Now',                      colour:'--s3',     el:'3',  hl:['s3','d','e','feed2','units'], ask:'How do we steer today — resources, targets, synergies?'},
  {id:'S3*',band:'Audit',        epithet:'Auditing & Real-Life Information',  colour:'--s3star', el:'3*', hl:['s3s','b','feed3s','units'], ask:'What is really going on down there?'},
  {id:'S2', band:'Coordinative', epithet:'Coordination Functions',            colour:'--s2',     el:'2',  hl:['s2','f','feed2','units'], ask:'How do units coordinate without escalating?'},
];
const sysOf=id=>SYSTEMS.find(s=>s.id===id);

/* ============================ DEMO WORKSHOP DATA (a plausible R0 mid-workshop state) ============================
   Shapes mirror the canonical model: SCT contributions carry a VSM system (Step V), organs are 7.6 meetings,
   instruments are 7.3 aspects, accountability comes from 7.2 RASIC, loop ratings from Step VI. */
const SCTS=[
  {id:'s1', did:'SCT-001', name:'Maintain the normative frame',            sys:'S5', state:'accepted'},
  {id:'s2', did:'SCT-002', name:'Steward identity & purpose',              sys:'S5', state:'accepted'},
  {id:'s3', did:'SCT-003', name:'Balance today vs tomorrow',               sys:'S5', state:'accepted'},
  {id:'s4', did:'SCT-004', name:'Scan the regulatory horizon',             sys:'S4', state:'accepted'},
  {id:'s5', did:'SCT-005', name:'Develop the portfolio strategy',          sys:'S4', state:'accepted'},
  {id:'s6', did:'SCT-006', name:'Explore new AI business models',          sys:'S4', state:'candidate'},
  {id:'s7', did:'SCT-007', name:'Allocate budget & capacity',              sys:'S3', state:'accepted'},
  {id:'s8', did:'SCT-008', name:'Translate strategy into operative targets',sys:'S3', state:'accepted'},
  {id:'s9', did:'SCT-009', name:'Escalation & prioritization',             sys:'S3', state:'accepted'},
  {id:'s10',did:'SCT-010', name:'Realize cross-unit synergies',            sys:'S3', state:'accepted'},
  {id:'s11',did:'SCT-011', name:'Provide unfiltered operational information',sys:'S3*',state:'accepted'},
  {id:'s12',did:'SCT-012', name:'Coordinate model & data standards',       sys:'S2', state:'accepted'},
  {id:'s13',did:'SCT-013', name:'Harmonize release trains',                sys:'S2', state:'accepted'},
  {id:'s14',did:'SCT-014', name:'Cross-unit resource billing',             sys:'S2', state:'candidate'},
];
/* organs = 7.6 meetings/boards. covers[] = the SCTs this organ actually steers (Step V: every SCT needs an entity) */
const ORGANS=[
  {id:'o1', name:'Executive Board',              sys:'S5', cad:'Quarterly', people:7,  covers:['s1','s2','s3']},
  {id:'o2', name:'Strategy Board',               sys:'S4', cad:'Quarterly', people:9,  covers:['s5']},
  {id:'o3', name:'Regulatory Watch',             sys:'S4', cad:'Monthly',   people:5,  covers:['s4']},
  {id:'o4', name:'Operations Review',            sys:'S3', cad:'Weekly',    people:11, covers:['s8','s9']},
  {id:'o5', name:'Resource & Capacity Board',    sys:'S3', cad:'Monthly',   people:8,  covers:['s7']},
  {id:'o6', name:'Go-to-Gemba visits',           sys:'S3*',cad:'Ad hoc',    people:3,  covers:['s11']},
  {id:'o7', name:'Standards & Platform Circle',  sys:'S2', cad:'Bi-Weekly', people:6,  covers:['s12']},
  {id:'o8', name:'Business Weekly',              sys:'S2', cad:'Weekly',    people:14, covers:[]},
  {id:'o9', name:'Algedonic escalation line',    sys:'S5', cad:'On signal', people:0,  covers:[], alg:true},
];
/* instruments = 7.3 aspects per SCT */
const ASPECTS={
  s1:{kpis:['Policy exceptions'],artifacts:['Normative frame'],tools:[]},
  s3:{kpis:['Exploit/explore ratio'],artifacts:[],tools:['Portfolio radar']},
  s4:{kpis:['Regulatory readiness'],artifacts:['EU AI Act register'],tools:['Horizon scan']},
  s5:{kpis:['Portfolio coverage','Time-to-market'],artifacts:['Strategy paper'],tools:[]},
  s7:{kpis:['Capacity utilization','Budget variance'],artifacts:['Capacity plan'],tools:['Resource model']},
  s8:{kpis:['Target attainment'],artifacts:['OKR set'],tools:[]},
  s9:{kpis:['Escalation lead time'],artifacts:[],tools:[]},
  s11:{kpis:['Gemba cadence'],artifacts:['Audit notes'],tools:['Skip-level survey']},
  s12:{kpis:[],artifacts:['Model standard'],tools:['Standards wiki']},
  s13:{kpis:['Release sync rate'],artifacts:[],tools:[]},
};
/* accountability = 7.2 RASIC A-holders per SCT (roles); a missing entry is an open gap */
const ACC={ s1:'CEO', s2:'CEO', s3:'CEO', s4:'Director Legal', s5:'Head of Strategy',
  s7:'CFO', s8:'COO', s9:'COO', s11:null, s12:'CTO', s13:null, s14:null, s6:null, s10:'COO' };
/* Step VI canonical loops with their variety verdict (rag) + the weakest check */
const LOOPS=[
  {id:'l1', name:'S5–S4/S3 · normative',        sys:['S5','S4','S3'], rag:'g', note:'closed'},
  {id:'l2', name:'S5–S1 · algedonic',           sys:['S5'],           rag:'r', note:'informal only'},
  {id:'l3', name:'S4–Environment · scanning',   sys:['S4'],           rag:'a', note:'synchronicity'},
  {id:'l4', name:'S4–S3 · today vs tomorrow',   sys:['S4','S3'],      rag:'a', note:'capacity'},
  {id:'l5', name:'S3–S1 · resource bargain',    sys:['S3'],           rag:'g', note:'closed'},
  {id:'l6', name:'S3–S1 · command',             sys:['S3'],           rag:'g', note:'closed'},
  {id:'l7', name:'S3*–S1 · audit',              sys:['S3*'],          rag:'r', note:'no closed loop'},
  {id:'l8', name:'S2–S1 · coordination',        sys:['S2'],           rag:'a', note:'intelligibility'},
];
const UNITS=['Industrial AI Copilot','Sovereign AI Assistant Platform','Public Sector AI Suite','Regulated Data & Model Platform','AI Assurance & Compliance Toolkit'];
const CTX={sif:'EU AI Solutions SE', level:'R0'};

/* ============================ STATE ============================ */
const state={sel:null, lens:{instruments:true, accountability:true, channels:true}, collapsed:{}, s1:true};

/* ============================ DERIVATIONS (the honesty spine) ============================
   Everything below is COMPUTED from the canonical data — this page asserts nothing of its own. */
const sctsOf   = sys => SCTS.filter(s=>s.sys===sys);
const organsOf = sys => ORGANS.filter(o=>o.sys===sys);
/* a covered SCT is steered by at least one organ; an ORPHAN is mapped to a system but sits in no organ's agenda
   (the method's explicit Step V trap: "an SCT covered by no entity = future steering failure") */
const coveredIds = () => new Set(ORGANS.flatMap(o=>o.covers));
const orphansOf  = sys => { const c=coveredIds(); return sctsOf(sys).filter(s=>!c.has(s.id)); };
/* "systematic garbage collection": an organ that steers no SCT at all — a candidate for abolition, never an assertion */
const gcOf       = sys => organsOf(sys).filter(o=>!o.alg && (!o.covers||!o.covers.length));
/* an empty seat: a system with neither SCTs nor organs — shown honestly, never hidden */
const isEmptySeat= sys => !sctsOf(sys).length && !organsOf(sys).length;
const instrumentsOf = sys => { const acc={kpis:[],artifacts:[],tools:[]};
  sctsOf(sys).forEach(s=>{ const a=ASPECTS[s.id]; if(!a)return; ['kpis','artifacts','tools'].forEach(k=>(a[k]||[]).forEach(v=>{ if(!acc[k].includes(v))acc[k].push(v); })); });
  return acc; };
const acctOf = sys => { const map={};
  sctsOf(sys).forEach(s=>{ const who=ACC[s.id]||null; const key=who||'—';
    (map[key]=map[key]||{who,scts:[]}).scts.push(s); });
  return Object.values(map); };
const loopsOf = sys => LOOPS.filter(l=>l.sys.includes(sys));
function headline(){
  let orphans=0,gc=0,seats=0,redLoops=0,noAcc=0;
  SYSTEMS.forEach(s=>{ orphans+=orphansOf(s.id).length; gc+=gcOf(s.id).length; if(isEmptySeat(s.id))seats++; });
  LOOPS.forEach(l=>{ if(l.rag==='r')redLoops++; });
  SCTS.forEach(s=>{ if(!ACC[s.id])noAcc++; });
  return {orphans,gc,seats,redLoops,noAcc};
}

/* ============================ THE VSM DIAGRAM — REUSED AS A LIBRARY ============================
   vsm.html is the perfected, shared diagram. This page never redraws it: it embeds the asset and drives it
   through its documented api:1 bridge (loadTree · select · highlight · setChannels), and listens to
   elementClick to sync the bands. Host may point the embed elsewhere with ?vsm=<url>. */
const VSM_SRC=(()=>{ const u=(new URLSearchParams(location.search).get('vsm')||'../vsm'); return u+(u.includes('?')?'&':'?')+'pane=hidden&chrome=min'; })();
let vsmReady=false;
function vsmFrame(){ return $('#vsmframe'); }
function vsmSend(msg){ const f=vsmFrame(); if(vsmReady&&f&&f.contentWindow){ try{f.contentWindow.postMessage(msg,'*');}catch(_){ } } }
function vsmFeed(){
  vsmSend({cmd:'loadTree', tree:{id:'sif', name:CTX.sif, children:UNITS.map((n,i)=>({id:'u'+i,name:n}))}});
  vsmSend({cmd:'setChannels', shown:{a:true,b:true,c:true,d:true,e:true,f:true,g:true}});
  syncDiagram();
}
/* band selection → drive the shared diagram (select + dim everything the focused system does not touch) */
function syncDiagram(){
  const s=state.sel?sysOf(state.sel):null;
  vsmSend({cmd:'select', type: s?s.el:null});
  vsmSend({cmd:'highlight', els: s?s.hl:[]});
}
window.addEventListener('message',e=>{
  const m=e.data; if(!m||typeof m!=='object'||!m.evt)return;
  const f=vsmFrame(); if(!f||e.source!==f.contentWindow)return;
  if(m.evt==='ready'){ vsmReady=true; vsmFeed(); return; }
  if(m.evt==='elementClick'){            // diagram → bands
    const map={'5':'S5','4':'S4','3':'S3','3*':'S3*','2':'S2'};
    const sys=map[m.type];
    if(sys){ selectBand(sys,{fromDiagram:true}); }
    else if(m.type==='unit'){ state.sel=null; render(); }   // an S1 unit is one recursion down — clear the metasystem focus
  }
});

/* ============================ RENDER ============================ */
function renderSubbar(){
  const h=headline();
  const lens=(k,label,title)=>`<button class="tog ${state.lens[k]?'on':''}" data-lens="${k}" title="${esc(title)}">${esc(label)}</button>`;
  const attn=h.orphans+h.redLoops+h.noAcc>0;
  $('#subbar').innerHTML=
    lens('instruments','Instruments','Show the KPIs, artifacts and tools behind each system (7.3)')+
    lens('accountability','Accountability','Show who is Accountable (A in 7.2 RASIC) per system')+
    lens('channels','Channel health','Show the Step VI variety verdict of the loops touching each system')+
    `<span class="divider"></span>`+
    `<button class="tog ${state.s1?'on':''}" data-s1="1" title="Show the operative units as context — this page is about the metasystem">S1 context</button>`+
    `<div class="hpill ${attn?'attn':''}" data-act="walk" title="What the canonical model says is still open">`+
      (h.orphans?`<span><b>${h.orphans}</b> unsteered SCT${h.orphans>1?'s':''}</span><span class="sep">·</span>`:'')+
      (h.noAcc?`<span><b>${h.noAcc}</b> without accountable</span><span class="sep">·</span>`:'')+
      (h.redLoops?`<span><b>${h.redLoops}</b> broken loop${h.redLoops>1?'s':''}</span>`:'')+
      (h.gc?`<span class="sep">·</span><span><b>${h.gc}</b> organ${h.gc>1?'s':''} to review</span>`:'')+
      (attn?'':'<span>every mapped SCT is steered</span>')+
    `</div>`;
}
function slotSCTs(sys){
  const list=sctsOf(sys), c=coveredIds();
  if(!list.length) return `<div class="slot"><h4>Success-critical tasks <span class="src">Step V</span></h4><div class="empty">No SCT is mapped to <b>${sys}</b> yet — Step V decides which contributions this system performs.</div></div>`;
  return `<div class="slot"><h4>Success-critical tasks <span class="src">Step V</span></h4>`+
    list.map(s=>{const orphan=!c.has(s.id);
      return `<button class="chip ${s.state==='candidate'?'cand':''} ${orphan?'orphan':''}" data-sct="${esc(s.id)}" title="${esc(s.name)}${orphan?' — no organ steers this task':''}"><span class="did">${esc(s.did)}</span><span class="nm">${esc(clip(s.name,26))}</span>${orphan?'<span class="flag" title="steered by no organ">⚑</span>':''}</button>`;
    }).join('')+`</div>`;
}
function slotOrgans(sys){
  const list=organsOf(sys);
  if(!list.length) return `<div class="slot"><h4>Steering organs <span class="src">7.6</span></h4><div class="empty">No board, committee or meeting carries <b>${sys}</b> yet.</div></div>`;
  return `<div class="slot"><h4>Steering organs <span class="src">7.6</span></h4>`+
    list.map(o=>{const gc=!o.alg&&(!o.covers||!o.covers.length);
      return `<button class="chip organ ${gc?'gc':''}" data-organ="${esc(o.id)}" title="${esc(o.name)} · ${esc(o.cad)}${gc?' — steers no SCT: review or abolish':''}">${o.alg?'<span class="did" style="color:var(--alg)">▲</span>':'<span class="did">◇</span>'}<span class="nm">${esc(clip(o.name,22))}</span><span class="cad">${esc(o.cad)}</span></button>`;
    }).join('')+`</div>`;
}
function slotInstruments(sys){
  if(!state.lens.instruments) return '';
  const a=instrumentsOf(sys), n=a.kpis.length+a.artifacts.length+a.tools.length;
  if(!n) return `<div class="slot"><h4>Instruments <span class="src">7.3</span></h4><div class="empty">No metrics, artifacts or tools captured for this system's tasks yet.</div></div>`;
  const tag=(k,v)=>`<span class="itag"><i>${k}</i>${esc(clip(v,20))}</span>`;
  return `<div class="slot"><h4>Instruments <span class="src">7.3</span></h4><div class="instr">`+
    a.kpis.map(v=>tag('KPI',v)).join('')+a.artifacts.map(v=>tag('ART',v)).join('')+a.tools.map(v=>tag('TOOL',v)).join('')+
    `</div></div>`;
}
function slotAcct(sys){
  if(!state.lens.accountability) return '';
  const rows=acctOf(sys);
  if(!rows.length) return '';
  return `<div class="slot"><h4>Accountable <span class="src">7.2</span></h4><div class="acct">`+
    rows.map(r=>`<div class="acctrow">${r.who?'<span class="rag g" style="width:9px;height:9px;border-radius:50%;background:var(--teal)"></span>':'<span class="rag r"></span>'}<span class="who" style="${r.who?'':'color:var(--red)'}">${esc(r.who||'no accountable role yet')}</span><span class="cover">${r.scts.length} SCT${r.scts.length>1?'s':''}</span></div>`).join('')+
    `</div></div>`;
}
function slotLoops(sys){
  if(!state.lens.channels) return '';
  const list=loopsOf(sys);
  if(!list.length) return '';
  return `<div class="slot"><h4>Channel health <span class="src">Step VI</span></h4><div class="loops">`+
    list.map(l=>`<div class="loop"><span class="rag ${l.rag}"></span><span class="lname">${esc(l.name)}</span><span class="lnote">${esc(l.note)}</span></div>`).join('')+
    `</div></div>`;
}
function renderBands(){
  const anySel=!!state.sel;
  $('#bands').innerHTML=SYSTEMS.map(s=>{
    const sc=sctsOf(s.id), og=organsOf(s.id), orph=orphansOf(s.id).length, gc=gcOf(s.id).length, seat=isEmptySeat(s.id);
    const sel=state.sel===s.id, collapsed=!!state.collapsed[s.id];
    return `<section class="band ${sel?'sel':''} ${anySel&&!sel?'dim':''} ${collapsed?'collapsed':''}" data-band="${s.id}" style="--sysc:var(${s.colour});border-left-color:var(${s.colour})">
      <div class="band-head" data-headband="${s.id}">
        <span class="sysdot" style="background:var(${s.colour});${s.id==='S5'||s.id==='S2'?'color:#1f2935':''}">${esc(s.id)}</span>
        <div class="band-title"><b>${esc(s.epithet)}</b><span>${esc(s.band)} management</span></div>
        <div class="band-counts">
          <span class="cnt"><b>${sc.length}</b> SCT${sc.length===1?'':'s'}</span>
          <span class="cnt"><b>${og.length}</b> organ${og.length===1?'':'s'}</span>
          ${orph?`<span class="cnt warn"><b>${orph}</b> unsteered</span>`:''}
          ${gc?`<span class="cnt warn" style="border-color:var(--amber);color:#8a5b04;background:#fdf6e3"><b>${gc}</b> to review</span>`:''}
        </div>
      </div>
      <div class="band-body">
        ${seat?`<div class="slot" style="grid-column:1/-1"><div class="empty">An <b>empty seat</b>: nothing designed for ${esc(s.id)} yet. ${esc(s.ask)}</div></div>`
              :slotSCTs(s.id)+slotOrgans(s.id)+slotInstruments(s.id)+slotAcct(s.id)+slotLoops(s.id)}
      </div>
    </section>`;
  }).join('')+
  (state.s1?`<div class="s1strip"><span class="lab">S1 · operative units</span>${UNITS.map(u=>`<span class="s1chip">${esc(clip(u,28))}</span>`).join('')}<span class="lab" style="margin-left:auto">their own steering lives one recursion down</span></div>`:'');
}
function renderNote(){
  $('#note').innerHTML=`This page is a <b>view over the canonical model</b> — it never stores steering data. Tasks come from Step V, organs from 7.6, instruments from 7.3, accountability from 7.2, channel health from Step VI. Nothing here is a completeness score: an empty seat is an honest result of where the workshop stands.`;
}
function render(){ renderSubbar(); renderBands(); renderNote(); }

/* ============================ INTERACTION ============================ */
function selectBand(sys,opts){
  opts=opts||{};
  state.sel = state.sel===sys && !opts.fromDiagram ? null : sys;
  render(); syncDiagram(); emit('select',{system:state.sel});
  if(opts.fromDiagram&&state.sel){ const el=document.querySelector(`.band[data-band="${CSS.escape(state.sel)}"]`); if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}
document.addEventListener('click',e=>{
  const lens=e.target.closest('[data-lens]'); if(lens){ state.lens[lens.dataset.lens]=!state.lens[lens.dataset.lens]; render(); return; }
  const s1=e.target.closest('[data-s1]'); if(s1){ state.s1=!state.s1; render(); return; }
  const hb=e.target.closest('[data-headband]'); if(hb){ selectBand(hb.dataset.headband); return; }
  const sct=e.target.closest('[data-sct]'); if(sct){ popSct(sct.dataset.sct,sct); return; }
  const org=e.target.closest('[data-organ]'); if(org){ popOrgan(org.dataset.organ,org); return; }
  if(e.target.closest('[data-act="walk"]')){ walkOpen(); return; }
  if(e.target.closest('[data-act="export"]')){ doExport(); return; }
  if(!e.target.closest('.pop')) closePop();
});
function closePop(){ const p=$('#pop'); if(p)p.remove(); }
function openPop(html,anchor){
  closePop();
  const d=document.createElement('div'); d.className='pop'; d.id='pop'; d.innerHTML=html+`<button class="close" data-close="1" aria-label="Close">✕</button>`;
  document.body.appendChild(d);
  const r=anchor.getBoundingClientRect(), w=d.offsetWidth, h=d.offsetHeight;
  d.style.left=Math.min(Math.max(8,r.left), innerWidth-w-8)+'px';
  d.style.top=(r.bottom+8+h>innerHeight ? Math.max(8,r.top-h-8) : r.bottom+8)+'px';
  d.addEventListener('click',ev=>{ if(ev.target.closest('[data-close]'))closePop(); });
}
function popSct(id,anchor){
  const s=SCTS.find(x=>x.id===id); if(!s)return;
  const organs=ORGANS.filter(o=>(o.covers||[]).includes(id));
  const a=ASPECTS[id]||{kpis:[],artifacts:[],tools:[]}, who=ACC[id];
  openPop(`<h3>${esc(s.did)} · ${esc(s.name)}</h3><div class="sub">${esc(s.sys)} · ${esc(sysOf(s.sys)?sysOf(s.sys).epithet:'')}${s.state==='candidate'?' · candidate':''}</div>
    ${organs.length?`<div class="kv"><label>Steered in</label>${organs.map(o=>esc(o.name)+' <span style="color:var(--muted)">('+esc(o.cad)+')</span>').join('<br>')}</div>`
                   :`<div class="warnrow">No organ steers this task — it would fall through the steering structure.</div>`}
    <div class="kv"><label>Accountable (7.2)</label>${who?esc(who):'<span style="color:var(--red)">no accountable role yet</span>'}</div>
    ${(a.kpis.length||a.artifacts.length||a.tools.length)?`<div class="kv"><label>Instruments (7.3)</label>${[...a.kpis.map(v=>'KPI · '+esc(v)),...a.artifacts.map(v=>'Artifact · '+esc(v)),...a.tools.map(v=>'Tool · '+esc(v))].join('<br>')}</div>`:''}
    <button class="jump" data-close="1">Open in Step V →</button>`,anchor);
}
function popOrgan(id,anchor){
  const o=ORGANS.find(x=>x.id===id); if(!o)return;
  const covers=SCTS.filter(s=>(o.covers||[]).includes(s.id));
  openPop(`<h3>${o.alg?'▲ ':'◇ '}${esc(o.name)}</h3><div class="sub">${esc(o.sys)} · ${esc(o.cad)}${o.people?' · '+o.people+' participants':''}</div>
    ${covers.length?`<div class="kv"><label>Steers</label>${covers.map(s=>esc(s.did)+' · '+esc(s.name)).join('<br>')}</div>`
      :(o.alg?`<div class="kv"><label>Purpose</label>The algedonic line carries pain and lust signals directly — it steers no task by design.</div>`
             :`<div class="warnrow">This organ steers no success-critical task. What would happen if it were abolished?</div>`)}
    <button class="jump" data-close="1">Open the charter in 7.6 →</button>`,anchor);
}
function walkOpen(){
  const first=SYSTEMS.find(s=>orphansOf(s.id).length)||SYSTEMS.find(s=>gcOf(s.id).length);
  if(first){ selectBand(first.id,{fromDiagram:true}); }
}
function doExport(){ emit('requestExportPanel',{}); if(!inFrame)alert('Export is host-orchestrated (PNG / PDF / deck) — the shared export panel opens in the app.'); }

/* ============================ FULLSCREEN (house pattern) ============================ */
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFs(){try{let p;if(isFs()){const fn=document.exitFullscreen||document.webkitExitFullscreen;p=fn&&fn.call(document);}else{const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;p=fn&&fn.call(el);}if(p&&p.catch)p.catch(()=>{});}catch(_){}}
$('#fsBtn').addEventListener('click',toggleFs);
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>emit('fullscreenchange',{fullscreen:isFs()})));
document.addEventListener('keydown',e=>{
  if(/^(input|textarea|select)$/i.test(e.target.tagName))return;
  if(e.key==='Escape'){ if($('#pop')){closePop();return;} if(state.sel){state.sel=null;render();syncDiagram();return;} }
  if((e.key==='f'||e.key==='F')&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggleFs();}
});

/* ============================ HOST BRIDGE (window.SMASTER api:1) ============================
   DOWN: setContext · setModel · select · setLens · skin · fullscreen      UP: ready · select · requestExportPanel · fullscreenchange
   The page owns NO data: the host feeds one aggregated steering view-model composed from Steps III/V/VI/VII. */
const inFrame=!!(window.parent&&window.parent!==window);
function postToHost(msg){ try{ if(inFrame)window.parent.postMessage(msg,'*'); }catch(_){ } try{ if(window.SMASTER&&typeof window.SMASTER.onEmit==='function')window.SMASTER.onEmit(msg); }catch(_){ } }
function emit(evt,extra){ postToHost(Object.assign({evt,api:1},extra||{})); }
const _rA=(a,x)=>{a.length=0;(Array.isArray(x)?x:[]).forEach(i=>a.push(i));};
const _rO=(o,x)=>{Object.keys(o).forEach(k=>delete o[k]);if(x&&typeof x==='object')Object.assign(o,x);};
window.SMASTER={
  setContext:c=>{ if(!c||typeof c!=='object')return; if(c.sif)CTX.sif=c.sif; if(c.level)CTX.level=c.level;
    if(Array.isArray(c.units))_rA(UNITS,c.units); $('#ctxSif').textContent=CTX.sif+' · '+CTX.level; render(); vsmFeed(); },
  setModel:m=>{ if(!m||typeof m!=='object')return;
    if(Array.isArray(m.scts))_rA(SCTS,m.scts); if(Array.isArray(m.organs))_rA(ORGANS,m.organs);
    if(m.aspects)_rO(ASPECTS,m.aspects); if(m.accountable)_rO(ACC,m.accountable); if(Array.isArray(m.loops))_rA(LOOPS,m.loops);
    render(); },
  select:sys=>{ state.sel=sys&&sysOf(sys)?sys:null; render(); syncDiagram(); },
  setLens:(k,on)=>{ if(k in state.lens){ state.lens[k]=!!on; render(); } },
  skin:s=>{ document.body.dataset.skin=(s==='deck'||s==='command-deck')?'deck':'workshop'; },
  fullscreen:on=>{ if(on===false){const fn=document.exitFullscreen||document.webkitExitFullscreen;fn&&fn.call(document);} else if(on===true){const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;fn&&fn.call(el);} else toggleFs(); },
  isFullscreen:()=>isFs(),
  getState:()=>({ sif:CTX.sif, selected:state.sel, lens:Object.assign({},state.lens),
    systems:SYSTEMS.map(s=>({id:s.id, scts:sctsOf(s.id).length, organs:organsOf(s.id).length,
      orphans:orphansOf(s.id).length, review:gcOf(s.id).length, emptySeat:isEmptySeat(s.id)})),
    headline:headline() }),
  onEmit:null,
};
window.addEventListener('message',e=>{ const m=e.data; if(!m||typeof m!=='object'||!m.cmd)return;
  const S=window.SMASTER;
  if(m.cmd==='setContext')S.setContext(m);
  else if(m.cmd==='setModel')S.setModel(m.model||m);
  else if(m.cmd==='select')S.select(m.system);
  else if(m.cmd==='setLens')S.setLens(m.lens,m.on);
  else if(m.cmd==='skin'||m.cmd==='setSkin')S.skin(m.skin);
  else if(m.cmd==='fullscreen')S.fullscreen(m.on);
});

/* ============================ BOOT ============================ */
(function(){
  const q=new URLSearchParams(location.search);
  if(['min','none','hidden'].includes((q.get('chrome')||'').toLowerCase())||q.get('host'))document.body.classList.add('embed');
  document.body.dataset.skin=document.body.dataset.skin||'workshop';
  $('#ctxSif').textContent=CTX.sif+' · '+CTX.level;
  vsmFrame().src=VSM_SRC;
  render();
  emit('ready',{});
})();
</script>
</body>
