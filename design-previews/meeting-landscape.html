<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSM7 · Meeting Landscape</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f6f5;--surface:#ffffff;--surface-soft:#f7fafb;--panel:#eef3f2;
  --line:#cfdad5;--line-strong:#9dafaa;--ink:#1f2935;--muted:#667482;
  --blue:#3386bf;--blue-soft:#e8f2f9;--teal:#178275;--green:#63b16c;--amber:#efbd45;--red:#df6353;--violet:#8171b4;
  --s1:#34404c;--s2:#efbd45;--s3:#df6353;--s3star:#b85045;--s4:#63b16c;--s5:#9dbed2;
  --radius:9px;--shadow:0 4px 16px rgba(20,40,40,.08);
}
body[data-skin="deck"]{
  --bg:#0f1822;--surface:#172430;--surface-soft:#1c2c3a;--panel:#13202b;--line:#2c3f4f;--line-strong:#3d5568;
  --ink:#eaf1f6;--muted:#90a6b6;--blue:#57aee6;--blue-soft:#16303f;--teal:#3fb9a6;--green:#6fd07c;--amber:#f1c75c;--red:#f0796a;--violet:#a596d8;--s5:#7fa9c8;--shadow:0 6px 22px rgba(0,0,0,.45);
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}small{color:var(--muted)}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;height:62px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:14px}
.brand b{font-size:17px}
.ctx{display:flex;gap:20px;min-width:0;overflow:hidden}
.ctx label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}
.ctx strong{font-size:12px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
body[data-skin="deck"] .seg button.on{color:#04121c}
.btn{border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:7px 12px;font-weight:750;font-size:12.5px;min-height:34px}
.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
body[data-skin="deck"] .btn.primary{color:#04121c}
.btn.ghost{border-color:transparent;background:transparent}
.main{flex:1;min-height:0;overflow:auto;padding:14px 16px 40px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar h1{margin:0;font-size:19px}
.bar .sub{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;background:var(--surface)}
.tf{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.tf button{border:0;background:var(--surface);padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tf button.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 -2px 0 var(--blue)}
.canvas-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.canvas-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:auto;box-shadow:var(--shadow);max-height:70vh}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.palette .ptag{border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface);padding:6px 10px;font-size:11.5px;font-weight:700;cursor:grab}
.inspector{position:sticky;top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:13px 15px}
.kv{font-size:12.5px;margin:9px 0}
.kv label{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;margin-bottom:3px}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px;display:block;margin-bottom:4px}
.hint{font-size:11px;color:var(--muted)}
svg.canvas{display:block;font-family:inherit;user-select:none}
svg.canvas text{fill:var(--ink)}
.lanelabel{font-size:11px;font-weight:600}
.bandhdr{cursor:pointer}
.mk{cursor:grab}
.mk.sel{filter:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* form mode */
.form-wrap{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:5px}
.mrow{text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 10px;width:100%}
.mrow.on{border-color:var(--blue);background:var(--blue-soft)}
.mrow b{font-size:12.5px;display:block}.mrow span{font-size:10.5px;color:var(--muted)}
.tile{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:11px 13px;margin-bottom:10px}
.tile .th{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.tile .th b{font-size:13px}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:2px 6px;background:var(--surface-soft);color:var(--muted)}
.tag.v1{background:var(--blue-soft);color:var(--blue)}
.fld{width:100%;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:8px 10px;font-size:13px;color:var(--ink)}
textarea.fld{min-height:46px;resize:vertical}
.guideq{font-size:12px;color:#4a5560;margin:0 0 7px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 10px;font-size:11.5px;background:var(--surface)}
.chip button{border:0;background:none;color:var(--red);font-weight:800;cursor:pointer;padding:0 3px}
.tog{border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tog.on{background:var(--teal);border-color:var(--teal);color:#fff}
body[data-skin="deck"] .tog.on{color:#04121c}
.sys{display:inline-grid;place-items:center;min-width:26px;height:18px;border-radius:5px;font-size:10px;font-weight:800;padding:0 5px}
.sys.S1{background:#cdd5dd;color:#26313c}.sys.S2{background:var(--s2);color:#5e4708}.sys.S3{background:var(--s3);color:#fff}.sys.S4{background:var(--s4);color:#13340f}.sys.S5{background:var(--s5);color:#1b3346}
.more{margin-top:6px}
.warn{display:flex;gap:7px;font-size:11.5px;border-radius:7px;padding:6px 9px;background:#fff5d8;color:#8a5b04;border:1px solid #f0d896;margin-top:6px}
body[data-skin="deck"] .warn{color:var(--amber)}
/* focus */
.focus-layer{display:none}
body.focus{overflow:hidden}
body.focus .focus-layer{display:flex;flex-direction:column;position:fixed;inset:0;z-index:50;background:var(--bg)}
.focus-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.focus-tiles{flex:1;overflow:auto;padding:24px 28px}
.ftile{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:22px 24px;max-width:760px}
.ftile h2{margin:0 0 6px;font-size:23px}.ftile .lead{font-size:16px;line-height:1.5}
.ftile .outcome{background:#e5f3ef;border-radius:9px;padding:11px 13px;font-size:14px;margin:13px 0}
.ftile ol{font-size:14.5px;line-height:1.7}
</style>
</head>
<body data-skin="workshop">
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">V7</div><b>VSM7</b></div>
    <div class="ctx">
      <div><label>System-in-Focus</label><strong>EU AI Solutions SE · R0</strong></div>
      <div><label>Step VII</label><strong>7.6 · Meeting Landscape</strong></div>
    </div>
    <div class="tools">
      <div class="seg" id="modeSeg"><button data-mode="landscape" class="on">Landscape</button><button data-mode="form">Meeting</button></div>
      <div class="seg" id="skinSeg"><button data-skin="workshop" class="on">Workshop</button><button data-skin="deck">Command Deck</button></div>
      <button class="btn" id="fsBtn" title="Full screen (F)">⛶ Full screen</button>
      <button class="btn" id="focusBtn">▦ Focus</button>
    </div>
  </header>
  <main class="main" id="view"></main>
</div>
<div class="focus-layer">
  <div class="focus-bar"><strong style="font-size:15px">Facilitation · Meeting Landscape</strong><button class="btn" id="focusExit">Esc · Exit focus</button></div>
  <div class="focus-tiles" id="focusTiles"></div>
</div>

<script>
/* ============================ SAMPLE DATA (canonical-id; meetings ARE vessels) ============================ */
const UNITS=[
  {id:'u-grp',name:'AI Solutions Group',level:'R+1'},
  {id:'u-sif',name:'EU AI Solutions SE',level:'R0',sif:true},
  {id:'u-mob',name:'Mobility',level:'R-1'},
  {id:'u-ind',name:'Industrial Technology',level:'R-1'},
  {id:'u-con',name:'Consumer Goods',level:'R-1'},
  {id:'u-ene',name:'Energy & Building',level:'R-1'},
];
const LEVELS=['R+1','R0','R-1'];
const ROLES=[ {id:'r-pf',name:'Portfolio Steering Lead'},{id:'r-co',name:'Coordination Officer'},{id:'r-st',name:'Strategy & Foresight Lead'},{id:'r-rc',name:'Resource Controller'},{id:'r-au',name:'Audit Lead'},{id:'r-mob',name:'MD Mobility'},{id:'r-ind',name:'MD Industrial Technology'} ];
const LOOPS=[ {id:'l-alg',name:'S5–S1 algedonic'},{id:'l-cmd',name:'S3–S1 command'},{id:'l-res',name:'S3–S1 resource bargain'},{id:'l-aud',name:'S3*–S1 audit'},{id:'l-coord',name:'S2–S1 coordination'},{id:'l-h34',name:'S4–S3 homeostat'},{id:'l-norm',name:'S5–S4/S3 normative'} ];
// cadence.kind: rhythmic | on-signal | one-off ; period in DAYS for rhythmic ; day = anchor offset in days from window start
const DAYUNIT={day:1,week:7,month:30,quarter:91,year:365};
function MK(id,name,level,unitId,sys,freqUnit,every,day,extra){
  return Object.assign({id,name,scope:{level,unitId:unitId||'shared'},sys,
    cadence:{kind:freqUnit==='signal'?'on-signal':(freqUnit==='once'?'one-off':'rhythmic'),every:every||1,unit:freqUnit,day:day||0,durationMin:60},
    type:'',purpose:'',intendedResult:'',agenda:[],participations:[],outputs:[],outputRefs:[],decisionModes:[],loops:[]},extra||{});
}
const MEETINGS=[
  MK('m-annual','Annual strategy & budget','R+1','shared','S4','year',1,330,{type:'budget-planning',intendedResult:'Approved strategy & budget envelope',outputs:['decision-list'],participations:[{vesselId:'r-pf',roleType:'owner'},{vesselId:'r-st',roleType:'participant'}],loops:['l-norm']}),
  MK('m-quarterly','Quarterly strategy review','R0','shared','S4','quarter',1,20,{type:'status-report',intendedResult:'Re-prioritised portfolio bets',outputs:['decision-list','action-list'],participations:[{vesselId:'r-st',roleType:'owner'},{vesselId:'r-pf',roleType:'participant'}],loops:['l-h34']}),
  MK('m-weekly','Weekly coordination sync','R0','shared','S2','week',1,2,{type:'team-meeting',intendedResult:'De-conflicted cross-unit plan',outputs:['action-list'],participations:[{vesselId:'r-co',roleType:'owner'}],loops:['l-coord']}),
  MK('m-res','Resource bargain council','R0','shared','S3','month',1,8,{type:'budget-planning',outputs:['decision-list'],participations:[{vesselId:'r-rc',roleType:'owner'}],loops:['l-res']}),
  MK('m-mob-rev','Mobility unit review','R-1','u-mob','S1','month',1,12,{type:'status-report',outputs:['action-list'],participations:[{vesselId:'r-mob',roleType:'owner'}]}),
  MK('m-mob-stand','Mobility daily stand-up','R-1','u-mob','S1','day',1,1,{type:'team-meeting',participations:[{vesselId:'r-mob',roleType:'owner'}]}),
  MK('m-ind-rev','Industrial unit review','R-1','u-ind','S1','month',1,18,{type:'status-report',outputs:['action-list'],participations:[{vesselId:'r-ind',roleType:'owner'}]}),
  MK('m-alg','Algedonic escalation line','R0','shared','S5','signal',1,0,{type:'problem-identification',intendedResult:'Pain signal answered',loops:['l-alg'],participations:[{vesselId:'r-pf',roleType:'owner'}]}),
];
const CONNECTIONS=[ {id:'c1',from:'m-mob-rev',to:'m-quarterly',flow:'report'},{id:'c2',from:'m-ind-rev',to:'m-quarterly',flow:'report'},{id:'c3',from:'m-quarterly',to:'m-annual',flow:'report'} ];

const TYPE_LABEL={'team-meeting':'Team meeting','status-report':'Status report','one-on-one':'1-on-1','budget-planning':'Budget planning','get-to-know':'Get-to-know','idea-generation':'Idea generation','problem-identification':'Problem identification','workshop':'Workshop','conflict-resolution':'Conflict resolution','training':'Training'};
const OUT_LABEL={'action-list':'Action list','decision-list':'Decision list','impediments':'Impediments','parking-lot':'Parking lot','backlog':'Backlog'};
const FLOW_LABEL={report:'report',decision:'decision','action-list':'action list',escalation:'escalation'};
/* host-fed 7.3 aspects (item shape {id,text,...}) + SCT context, so a meeting's outputRefs can reference
   specific ARTIFACT items by stable id. v1 offers ARTIFACTS only as selectable outputs; kpis/tools are
   context for display/future use. Tolerant of extra item fields (source/owner/note); never keys by text. */
let ASPECTS={}, SCTS=[];
function artifactItems(){ const out=[]; Object.keys(ASPECTS||{}).forEach(sctId=>{ const a=ASPECTS[sctId]||{}; (a.artifacts||[]).forEach(it=>{ if(it&&it.id!=null)out.push({id:it.id,text:it.text||'',sctId}); }); }); return out; }
function artifactText(id){ for(const sctId in (ASPECTS||{})){ const a=ASPECTS[sctId]||{}; const hit=(a.artifacts||[]).find(it=>it&&it.id===id); if(hit)return hit.text||''; } return null; }
function sctDid(sctId){ const s=(SCTS||[]).find(x=>x.id===sctId); return s?(s.did||''):''; }

/* ============================ STATE ============================ */
const TIMEFRAMES={quarter:{days:91,label:'Quarter',ticks:13,tickUnit:'wk'},'6m':{days:182,label:'6 months',ticks:6,tickUnit:'mo'},'1y':{days:365,label:'1 year',ticks:12,tickUnit:'mo'},'2-5y':{days:730,label:'2–5 years',ticks:8,tickUnit:'qr'}};
const MARKER_CAP=12;
const state={mode:'landscape',tf:'1y',collapsed:{},sel:null,connectMode:false,connectFrom:null,formMode:false,formMore:{},drag:null};

/* ============================ HELPERS ============================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const unit=id=>UNITS.find(u=>u.id===id)||{}, role=id=>ROLES.find(r=>r.id===id)||{}, meeting=id=>MEETINGS.find(m=>m.id===id)||{};
const sysChip=s=>s?`<span class="sys ${s}">${esc(s)}</span>`:'';
function periodDays(m){ if(m.cadence.kind!=='rhythmic')return 0; return (DAYUNIT[m.cadence.unit]||30)*(m.cadence.every||1); }
function occurrences(m,winDays){ if(m.cadence.kind!=='rhythmic')return [m.cadence.day||0]; const p=periodDays(m); if(p<=0)return [0]; const out=[]; for(let d=m.cadence.day||0; d<=winDays; d+=p) out.push(d); return out; }
function renderKind(m,winDays){ if(m.cadence.kind==='on-signal')return 'signal'; if(m.cadence.kind==='one-off')return 'marker'; return occurrences(m,winDays).length>MARKER_CAP?'band':'marker'; }
function cadenceLabel(m){ const c=m.cadence; if(c.kind==='on-signal')return 'on signal'; if(c.kind==='one-off')return 'one-off'; const u=c.unit; const e=c.every||1; const base={day:'daily',week:'weekly',month:'monthly',quarter:'quarterly',year:'annual'}[u]||u; return e===1?base:('every '+e+' '+u+'s'); }
function subLanesFor(level){ const us=UNITS.filter(u=>u.level===level); return [...us.map(u=>({id:u.id,name:u.name})),{id:'shared',name:level==='R-1'?'cross-unit':'shared'}]; }

/* ============================ LAYOUT (variable height bands) ============================ */
const HEAD_W=176,TIME_TOP=30,SUBLANE_H=42,BAND_HEADER_H=24,BAND_COLLAPSED_H=44,BAND_PAD=4,COL0=HEAD_W+14,MARKER_R=8,BAND_THICK=13,ROW_H=22,SUB_PAD=7;
function layout(){
  let y=TIME_TOP, bands=[];
  LEVELS.forEach(level=>{
    const subs=subLanesFor(level), collapsed=!!state.collapsed[level];
    const top=y, contentTop=top+BAND_HEADER_H; let cy=contentTop, subInfo=[];
    if(collapsed){ const ms=MEETINGS.filter(m=>m.scope.level===level); const h=Math.max(BAND_COLLAPSED_H, ms.length*ROW_H+2*SUB_PAD); subInfo.push({id:'__c',name:'',top:contentTop,h,meetings:ms}); cy=contentTop+h; }
    else subs.forEach(sb=>{ const ms=MEETINGS.filter(m=>m.scope.level===level&&m.scope.unitId===sb.id); const h=Math.max(SUBLANE_H, ms.length*ROW_H+2*SUB_PAD); subInfo.push({id:sb.id,name:sb.name,top:cy,h,meetings:ms}); cy+=h; });
    const h=BAND_HEADER_H+(cy-contentTop)+BAND_PAD;
    bands.push({level,subs,collapsed,top,h,contentTop,subInfo});
    y=top+h;
  });
  const mY={};
  bands.forEach(b=>b.subInfo.forEach(si=>{ si.meetings.forEach((m,i)=>{ mY[m.id]=si.top+SUB_PAD+i*ROW_H+ROW_H/2; }); }));
  return {bands,height:y,mY};
}
function meetingY(m,L){ return L.mY[m.id]!=null?L.mY[m.id]:TIME_TOP; }

/* ============================ RENDER: LANDSCAPE ============================ */
function viewLandscape(){
  const tf=TIMEFRAMES[state.tf];
  return `<div class="bar">
      <h1>Meeting landscape</h1><span class="sub">recursion × time · markers (discrete) vs bands (continuous rhythm)</span>
      <span style="flex:1"></span>
      <span class="hint">timeframe:</span>
      <div class="tf" id="tfSeg">${Object.keys(TIMEFRAMES).map(k=>`<button data-tf="${k}" class="${k===state.tf?'on':''}">${TIMEFRAMES[k].label}</button>`).join('')}</div>
    </div>
    <div class="palette">
      <span class="hint">add:</span>
      <button class="ptag" data-act="addmeeting">+ Meeting</button>
      <button class="btn ghost ${state.connectMode?'primary':''}" data-act="connecttoggle" style="font-size:12px">${state.connectMode?'connecting… (click two meetings)':'⤳ Connect'}</button>
      <span class="hint">drag a meeting to re-place it (snaps to lane + time); click to inspect.</span>
    </div>
    <div class="canvas-wrap"><div class="canvas-card" id="canvasCard">${renderSVG()}</div><div>${inspector()}</div></div>
    <div class="legend">
      <span><svg width="16" height="16"><path d="M8,2 L14,8 L8,14 L2,8 Z" fill="var(--blue)"/></svg> scheduled occurrence (marker)</span>
      <span><svg width="22" height="12"><rect x="0" y="1" width="22" height="10" rx="2" fill="var(--blue-soft)" stroke="var(--blue)"/></svg> continuous rhythm (band)</span>
      <span><svg width="22" height="12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="var(--muted)" stroke-dasharray="3 2"/></svg> on signal</span>
      <span>→ connection (output feeds input)</span>
    </div>`;
}
function renderSVG(){
  const L=layout(), tf=TIMEFRAMES[state.tf], W=900, canW=W-COL0-16, H=L.height+14;
  const xOf=day=>COL0+(day/tf.days)*canW;
  let s=`<svg class="canvas" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  // time ruler
  s+=`<rect x="${COL0}" y="0" width="${canW+16}" height="${TIME_TOP}" fill="var(--panel)"/>`;
  for(let i=0;i<=tf.ticks;i++){ const day=tf.days*i/tf.ticks, x=xOf(day);
    s+=`<line x1="${x}" y1="${TIME_TOP-5}" x2="${x}" y2="${L.height}" stroke="var(--line)"/>`;
    if(i<tf.ticks)s+=`<text x="${x+3}" y="${TIME_TOP-9}" font-size="10" fill="var(--muted)">${tf.tickUnit} ${i+1}</text>`;
  }
  // bands + sub-lanes
  L.bands.forEach((b,bi)=>{
    s+=`<rect x="0" y="${b.top}" width="${W}" height="${b.h}" fill="${bi%2?'var(--surface)':'var(--surface-soft)'}"/>`;
    s+=`<rect x="0" y="${b.top}" width="${HEAD_W}" height="${b.h}" fill="var(--panel)"/>`;
    s+=`<g class="bandhdr" data-act="togglelevel" data-level="${b.level}"><text x="10" y="${b.top+16}" class="lanelabel">${b.collapsed?'▸':'▾'} ${esc(b.level)}</text>`;
    if(b.collapsed){const n=MEETINGS.filter(m=>m.scope.level===b.level).length; s+=`<text x="${HEAD_W-8}" y="${b.top+16}" text-anchor="end" font-size="10" fill="var(--muted)">${n} meeting${n!==1?'s':''} · ${b.subs.length-1} unit${b.subs.length-1!==1?'s':''}</text>`;}
    s+=`</g>`;
    b.subInfo.forEach((si,i)=>{ if(i)s+=`<line x1="0" y1="${si.top}" x2="${W}" y2="${si.top}" stroke="var(--line)" stroke-opacity=".6"/>`;
      if(si.name)s+=`<text x="20" y="${si.top+si.h/2+4}" font-size="10.5" fill="var(--muted)">${esc(si.name)}</text>`;});
    s+=`<line x1="0" y1="${b.top+b.h}" x2="${W}" y2="${b.top+b.h}" stroke="var(--line-strong)"/>`;
  });
  s+=`<line x1="${HEAD_W}" y1="0" x2="${HEAD_W}" y2="${L.height}" stroke="var(--line-strong)"/>`;
  // connections (drawn under meetings)
  CONNECTIONS.forEach(cn=>{ const a=meeting(cn.from),z=meeting(cn.to); if(!a.id||!z.id)return;
    const ax=mx(a,L,xOf),ay=meetingY(a,L),zx=mx(z,L,xOf),zy=meetingY(z,L);
    const mxp=(ax+zx)/2;
    s+=`<path d="M${ax},${ay} C${mxp},${ay} ${mxp},${zy} ${zx},${zy}" fill="none" stroke="var(--violet)" stroke-width="1.4" opacity=".75" marker-end="url(#ah)"/>`;
  });
  // meetings
  MEETINGS.forEach(m=>{ const y=meetingY(m,L), kind=renderKind(m,tf.days), seld=state.sel===m.id;
    const col=`var(--s${m.sys?m.sys.replace('*','star').slice(1):'1'})`;
    if(kind==='band'){ const x0=xOf(m.cadence.day||0), x1=COL0+canW;
      s+=`<g class="mk" data-act="selmeeting" data-id="${m.id}"><rect x="${x0}" y="${y-BAND_THICK/2}" width="${Math.max(40,x1-x0)}" height="${BAND_THICK}" rx="3" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="${seld?2:1}"/><text x="${x0+6}" y="${y+4}" font-size="10" fill="var(--ink)">${esc(m.name)} · ${cadenceLabel(m)}</text></g>`;
    } else if(kind==='signal'){ const x=xOf(40);
      s+=`<g class="mk" data-act="selmeeting" data-id="${m.id}"><path d="M${x},${y-9} L${x+5},${y} L${x},${y+9} L${x-5},${y} Z" fill="none" stroke="var(--violet)" stroke-width="${seld?2.4:1.6}" stroke-dasharray="3 2"/><text x="${x+10}" y="${y+4}" font-size="10" fill="var(--muted)">${esc(m.name)} · on signal</text></g>`;
    } else { const occ=occurrences(m,tf.days);
      let g=`<g class="mk" data-act="selmeeting" data-id="${m.id}">`;
      occ.forEach((d,i)=>{const x=xOf(d); g+=`<path d="M${x},${y-MARKER_R} L${x+MARKER_R},${y} L${x},${y+MARKER_R} L${x-MARKER_R},${y} Z" fill="${col}" fill-opacity="${i===0?'1':'.62'}" stroke="${col}" stroke-width="${seld&&i===0?2:.8}"/>`;});
      const lx=xOf(occ[0])+MARKER_R+5; g+=`<text x="${lx}" y="${y+3.5}" font-size="10" fill="var(--ink)">${esc(m.name)}</text></g>`;
      s+=g;
    }
  });
  s=`<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--violet)"/></marker></defs>`+s;
  return s+'</svg>';
}
function mx(m,L,xOf){ const kind=renderKind(m,TIMEFRAMES[state.tf].days); if(kind==='band'||kind==='signal')return xOf(m.cadence.day||0)+30; return xOf((occurrences(m,TIMEFRAMES[state.tf].days)[0]||0)); }

/* ============================ EVENTS ============================ */
document.addEventListener('click',e=>{
  const sk=e.target.closest('#skinSeg button'); if(sk){document.body.dataset.skin=sk.dataset.skin;[...sk.parentNode.children].forEach(b=>b.classList.toggle('on',b===sk));return;}
  const md=e.target.closest('#modeSeg button'); if(md){state.mode=md.dataset.mode;[...md.parentNode.children].forEach(b=>b.classList.toggle('on',b===md));render();emit('mode',{mode:state.mode});return;}
  if(e.target.closest('#fsBtn')){toggleFs();return;}
  if(e.target.closest('#focusBtn')){document.body.classList.add('focus');renderFocus();return;}
  if(e.target.closest('#focusExit')){document.body.classList.remove('focus');return;}
  const tf=e.target.closest('#tfSeg button'); if(tf){state.tf=tf.dataset.tf;render();return;}
  const a=e.target.closest('[data-act]'); if(!a)return; const act=a.dataset.act;
  if(act==='togglelevel'){state.collapsed[a.dataset.level]=!state.collapsed[a.dataset.level];render();}
  else if(act==='selmeeting'){ if(state.connectMode){handleConnect(a.dataset.id);return;} state.sel=a.dataset.id;render();emit('select',{meetingId:a.dataset.id});}
  else if(act==='openform'){state.mode='form';[...$('#modeSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.mode==='form'));render();}
  else if(act==='addmeeting'){addMeeting();}
  else if(act==='delmeeting'){const m=meeting(state.sel);if(m.id&&confirm('Delete meeting “'+m.name+'”? This preview does not persist.')){const i=MEETINGS.findIndex(x=>x.id===m.id);MEETINGS.splice(i,1);for(let j=CONNECTIONS.length-1;j>=0;j--)if(CONNECTIONS[j].from===m.id||CONNECTIONS[j].to===m.id)CONNECTIONS.splice(j,1);state.sel=null;render();emit('meeting',{op:'delete',id:m.id});emitChange();}}
  else if(act==='connecttoggle'){state.connectMode=!state.connectMode;state.connectFrom=null;render();}
  else if(act==='togglemore'){state.formMore[state.sel]=!state.formMore[state.sel];render();}
  else if(act==='cadkind'){const m=meeting(curForm());m.cadence.kind=a.dataset.k;render();emitChange();}
  else if(act==='toggleout'){const m=meeting(curForm());m.outputs=m.outputs||[];const o=a.dataset.o;const i=m.outputs.indexOf(o);i>=0?m.outputs.splice(i,1):m.outputs.push(o);render();emitChange();}
  else if(act==='toggledec'){const m=meeting(curForm());m.decisionModes=m.decisionModes||[];const d=a.dataset.d;const i=m.decisionModes.indexOf(d);i>=0?m.decisionModes.splice(i,1):m.decisionModes.push(d);render();emitChange();}
  else if(act==='rmrole'){const m=meeting(curForm());m.participations.splice(+a.dataset.i,1);render();emit('participation',{meetingId:m.id,op:'remove'});emitChange();}
  else if(act==='rmoutref'){const m=meeting(curForm());m.outputRefs=m.outputRefs||[];m.outputRefs.splice(+a.dataset.i,1);render();emit('meeting',{op:'output',id:m.id,outputRefs:m.outputRefs.slice()});emitChange();}
});
function curForm(){ return state.sel||(MEETINGS[0]&&MEETINGS[0].id); }
document.addEventListener('input',e=>{ const a=e.target.closest('[data-act]'); if(!a)return; const m=meeting(curForm()); if(!m.id)return;
  if(a.dataset.act==='mfield'){ const f=a.dataset.f; if(f==='agendaText')m.agenda=a.value.split('\n').filter(x=>x.trim()); else m[f]=a.value; if(f==='name'||f==='type')render2soon(); emitChange(); }
  else if(a.dataset.act==='cadevery'){m.cadence.every=Math.max(1,+a.value||1);emitChange();renderPreviewPill();}
  else if(a.dataset.act==='caddur'){m.cadence.durationMin=+a.value||60;emitChange();}
});
document.addEventListener('change',e=>{ const a=e.target.closest('[data-act]'); if(!a)return; const m=meeting(curForm()); if(!m.id)return;
  if(a.dataset.act==='cadunit'){m.cadence.unit=a.value;render();emitChange();}

function addMeeting(){ const id='m-new-'+(MEETINGS.length+1); MEETINGS.push(MK(id,'New meeting','R0','shared','S3','week',1,4,{type:'team-meeting'})); state.sel=id; render(); emit('meeting',{op:'create',id,tempId:id}); emitChange(); }
function handleConnect(id){ if(!state.connectFrom){state.connectFrom=id;return;} if(state.connectFrom!==id){const cid='c-new-'+(CONNECTIONS.length+1);CONNECTIONS.push({id:cid,from:state.connectFrom,to:id,flow:'report'});emit('connection',{op:'create',from:state.connectFrom,to:id});emitChange();} state.connectMode=false;state.connectFrom=null;render(); }

/* ============================ DRAG (re-place a meeting: snap lane + time) ============================ */
view.addEventListener('pointerdown',e=>{ const g=e.target.closest('.mk'); if(!g||state.mode!=='landscape'||state.connectMode)return; const id=g.getAttribute('data-id'); const svg=g.closest('svg'); const r=svg.getBoundingClientRect();
  state.drag={id,svg,r,moved:false}; g.setPointerCapture&&g.setPointerCapture(e.pointerId); });
view.addEventListener('pointermove',e=>{ if(!state.drag)return; state.drag.moved=true; });
view.addEventListener('pointerup',e=>{ if(!state.drag)return; const d=state.drag; state.drag=null; const m=meeting(d.id); if(!m.id)return;
  if(!d.moved){ state.sel=d.id; render(); return; }
  const L=layout(), tf=TIMEFRAMES[state.tf], W=900, canW=W-COL0-16;
  const sx=(e.clientX-d.r.left)*(W/d.r.width), sy=(e.clientY-d.r.top)*(L.height/d.r.height);
  // snap lane: nearest sub-lane across bands
  let best=null,bd=1e9; L.bands.forEach(b=>b.subInfo.forEach(si=>{const yy=si.top+si.h/2;const dist=Math.abs(sy-yy);if(dist<bd){bd=dist;best={level:b.level,unitId:(si.id==='__c'?'shared':si.id)};}}));
  if(best){m.scope.level=best.level;m.scope.unitId=best.unitId;}
  // snap time to nearest tick
  const day=Math.max(0,Math.min(tf.days,(sx-COL0)/canW*tf.days)); const step=tf.days/tf.ticks; m.cadence.day=Math.round(day/step)*step;
  state.sel=d.id; render(); emit('meeting',{op:'move',id:m.id,scope:m.scope,day:m.cadence.day}); emitChange();
});

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(document.body.classList.contains('focus')){document.body.classList.remove('focus');return;} if(state.connectMode){state.connectMode=false;state.connectFrom=null;render();return;} }
  if((e.key==='f'||e.key==='F')&&!/^(input|textarea|select)$/i.test(e.target.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggleFs();} });
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFs(){try{let p;if(isFs()){const fn=document.exitFullscreen||document.webkitExitFullscreen;p=fn&&fn.call(document);}else{const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;p=fn&&fn.call(el);}if(p&&p.catch)p.catch(()=>{});}catch(_){}}
function updFsBtn(){const b=$('#fsBtn');if(b)b.textContent=isFs()?'⛶ Exit full screen':'⛶ Full screen';}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{updFsBtn();emit('fullscreenchange',{fullscreen:isFs()});}));

const inFrame=!!(window.parent&&window.parent!==window); let _emitT=null;
function mtlModel(){ return JSON.parse(JSON.stringify({ meetings:MEETINGS, connections:CONNECTIONS })); }
function mtlState(){ return { ctx:{units:UNITS,roles:ROLES,loops:LOOPS,aspects:ASPECTS,scts:SCTS}, model:mtlModel(), ui:{mode:state.mode,timeframe:state.tf,selected:state.sel,skin:document.body.dataset.skin} }; }
function postToHost(msg){ try{if(inFrame)window.parent.postMessage(msg,'*');}catch(_){} try{if(window.MTL&&typeof window.MTL.onEmit==='function')window.MTL.onEmit(msg);}catch(_){} }
function emit(evt,extra){ postToHost(Object.assign({evt},extra||{})); }
function emitChange(){ clearTimeout(_emitT); _emitT=setTimeout(()=>emit('change',{model:mtlModel()}),120); }
const _rA=(a,x)=>{a.length=0;(Array.isArray(x)?x:[]).forEach(i=>a.push(i));};
window.MTL={
  setContext:c=>{ if(!c||typeof c!=='object')return; if(Array.isArray(c.units))_rA(UNITS,c.units); if(Array.isArray(c.roles))_rA(ROLES,c.roles); if(Array.isArray(c.loops))_rA(LOOPS,c.loops); if(c.aspects&&typeof c.aspects==='object')ASPECTS=c.aspects; if(Array.isArray(c.scts))SCTS=c.scts; render(); },
  loadModel:m=>{ if(!m||typeof m!=='object')return; if(Array.isArray(m.meetings))_rA(MEETINGS,m.meetings); if(Array.isArray(m.connections))_rA(CONNECTIONS,m.connections); state.sel=null; render(); },
  select:id=>{ state.sel=id||null; render(); },
  goto:mode=>{ if(mode==='landscape'||mode==='form'){state.mode=mode;[...$('#modeSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));render();} },
  setHorizon:tf=>{ if(TIMEFRAMES[tf]){state.tf=tf;render();} },
  setSkin:s=>{ if(s==='workshop'||s==='deck'){document.body.dataset.skin=s;[...$('#skinSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.skin===s));} },
  fullscreen:on=>{ if(on===false){const fn=document.exitFullscreen;fn&&fn.call(document);}else if(on===true){const el=document.documentElement;(el.requestFullscreen||(()=>{})).call(el);}else toggleFs(); },
  isFullscreen:()=>isFs(),
  export:o=>emit('exportError',{requestId:(o&&o.requestId)||null,message:'Concept preview — export is host-orchestrated; deferred per the brief.'}),
  onEmit:null,
  getState:()=>mtlState()
};
window.addEventListener('message',e=>{ const m=e.data; if(!m||typeof m!=='object'||!m.cmd)return; const S=window.MTL;
  if(m.cmd==='setContext')S.setContext(m); else if(m.cmd==='loadModel')S.loadModel(m.model); else if(m.cmd==='select')S.select(m.id);
  else if(m.cmd==='goto')S.goto(m.mode); else if(m.cmd==='setHorizon')S.setHorizon(m.timeframe); else if(m.cmd==='setSkin')S.setSkin(m.skin);
  else if(m.cmd==='fullscreen')S.fullscreen(m.on); else if(m.cmd==='export')S.export(m); });

render();
emit('ready',{api:1});
</script>
</body>
