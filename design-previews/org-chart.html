<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSM7 · Organizational Representation — The Nested Estate</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f6f5;--surface:#ffffff;--surface-soft:#f7fafb;--panel:#eef3f2;
  --line:#cfdad5;--line-strong:#9dafaa;--ink:#1f2935;--muted:#667482;
  --blue:#3386bf;--blue-soft:#e8f2f9;--teal:#178275;--green:#63b16c;--amber:#efbd45;--red:#df6353;--violet:#8171b4;
  --s1:#34404c;--s2:#efbd45;--s3:#df6353;--s3star:#b85045;--s4:#63b16c;--s5:#9dbed2;--alg:#c0399f;
  --membrane:#eef3f6;--membrane-line:#c2d2d9;
  --radius:9px;--shadow:0 4px 16px rgba(20,40,40,.08);
}
body[data-skin="deck"]{
  --bg:#0f1822;--surface:#172430;--surface-soft:#1c2c3a;--panel:#13202b;--line:#2c3f4f;--line-strong:#3d5568;
  --ink:#eaf1f6;--muted:#90a6b6;--blue:#57aee6;--blue-soft:#16303f;--teal:#3fb9a6;--green:#6fd07c;--amber:#f1c75c;--red:#f0796a;--violet:#a596d8;--s5:#7fa9c8;
  --membrane:#14212c;--membrane-line:#2c3f4f;--shadow:0 6px 22px rgba(0,0,0,.45);
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}small{color:var(--muted)}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;height:62px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:14px}
.brand b{font-size:17px}
.ctx{display:flex;gap:20px;min-width:0;overflow:hidden}
.ctx label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}
.ctx strong{font-size:12px;white-space:nowrap}
/* embedded (iframe / ?chrome=min): the host already shows brand + org/SIF/step context — collapse the topbar to the functional controls only (no double content) */
body.embed .topbar .brand,body.embed .topbar .ctx{display:none}
body.embed .topbar{grid-template-columns:1fr;justify-items:end;height:auto;padding:7px 12px}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
body[data-skin="deck"] .seg button.on{color:#04121c}
.btn{border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:7px 12px;font-weight:750;font-size:12.5px;min-height:34px}
/* canonical host tile-action pair (matches Step II assessment): green ⬇ export + blue ⛶ fullscreen */
.tile-export-button,.tile-fullscreen-button{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:6px;box-shadow:0 8px 18px rgba(31,41,51,.05);cursor:pointer;flex:none}
.tile-export-button{border:1px solid rgba(20,129,113,.32);background:#e8f5e9;color:#148171;font-size:15px;font-weight:850;line-height:1}
.tile-export-button:hover,.tile-export-button:focus-visible{border-color:#148171;background:#fff;outline:none}
.tile-fullscreen-button{border:1px solid rgba(0,123,192,.32);background:#e8f2f8;color:#2f7fb9}
.tile-fullscreen-button:hover,.tile-fullscreen-button:focus-visible{border-color:#2f7fb9;background:#fff;outline:none}
.fullscreen-corners{position:relative;width:18px;height:18px;display:block}
.fullscreen-corners span{display:block}
.fullscreen-corners::before,.fullscreen-corners::after,.fullscreen-corners span::before,.fullscreen-corners span::after{position:absolute;width:7px;height:7px;border-color:currentColor;content:""}
.fullscreen-corners::before{top:0;left:0;border-top:2px solid;border-left:2px solid}
.fullscreen-corners::after{top:0;right:0;border-top:2px solid;border-right:2px solid}
.fullscreen-corners span::before{right:0;bottom:0;border-right:2px solid;border-bottom:2px solid}
.fullscreen-corners span::after{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid}
body[data-skin="deck"] .tile-export-button,body[data-skin="deck"] .tile-fullscreen-button{border-color:#4b5260;background:#171b24;color:var(--ink);box-shadow:none;border-radius:14px 3px 3px 14px}
.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
body[data-skin="deck"] .btn.primary{color:#04121c}
.btn.ghost{border-color:transparent;background:transparent}
.main{flex:1;min-height:0;overflow:auto;padding:12px 16px 40px}
/* sub-toolbar */
.subbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.subbar .grp{display:flex;align-items:center;gap:6px}
.subbar .divider{width:1px;height:22px;background:var(--line)}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--ink);color:var(--surface)}
.tog{border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);padding:4px 11px;font-size:11.5px;font-weight:700;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tog.on{background:var(--teal);border-color:var(--teal);color:#fff}
body[data-skin="deck"] .tog.on{color:#04121c}
.tog .dot{width:8px;height:8px;border-radius:50%}
.headline{margin-left:auto;display:flex;align-items:center;gap:8px}
.hpill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:750;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer}
.hpill.clean{color:var(--green);border-color:var(--green)}
.hpill.attn{color:#a8452f;border-color:#e6a08f;background:#fdece7}
body[data-skin="deck"] .hpill.attn{color:#f0796a;background:#33201c;border-color:#6b3a30}
.hpill b{font-weight:900}
/* canvas + inspector */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.canvas-card{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
svg.canvas{display:block;width:100%;height:auto;font-family:inherit;user-select:none}
svg.canvas text{fill:var(--ink)}
.node{cursor:pointer}
.node .box{transition:opacity .18s}
/* breadcrumb + mode banner floating on canvas */
.canvas-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:40px}
.edscroll{position:relative;overflow:auto;max-height:74vh;background:var(--surface);cursor:grab}
.edscroll.panning{cursor:grabbing}
#edZoom{transform-origin:0 0;width:max-content}
#vsmframe{width:100%;height:74vh;border:0;display:block;background:var(--surface)}
.zoomctl{position:absolute;right:12px;bottom:12px;z-index:6;display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.zoomctl button{border:0;background:var(--surface);padding:5px 10px;font-size:13px;font-weight:800;color:var(--ink);min-width:32px}
.zoomctl button:hover{background:var(--blue-soft)}
.zoomctl button.on{background:var(--blue-soft);color:var(--blue)}
.zoomctl button:not(:last-child){border-right:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.crumbs b{color:var(--ink)}
.crumbs [data-act="crumb"]{cursor:pointer}
.crumbs [data-act="crumb"]:hover{color:var(--blue);text-decoration:underline}
.backup{display:none;align-items:center;gap:7px;font-size:11.5px;background:var(--amber);color:#5e4708;border-radius:999px;padding:4px 11px;font-weight:800;cursor:pointer}
.backup.show{display:inline-flex}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
/* inspector */
.inspector{position:sticky;top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:13px 15px}
.kv{font-size:12.5px;margin:9px 0}
.kv label{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;margin-bottom:3px}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px;display:block;margin-bottom:4px}
.hint{font-size:11px;color:var(--muted)}
.plainacct{font-size:13px;line-height:1.5;background:var(--surface-soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0}
.plainacct b{color:var(--ink)}
.rgroup{margin:7px 0}
.rgroup>b{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rlet{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;font-size:10px;font-weight:900;color:#22303a}
.rlet.A{background:#f0a79b}.rlet.R{background:#f3d98a}.rlet.S{background:#9fc2dd}.rlet.I{background:#d7dde1}.rlet.C{background:#aab4bc}
.sct-item{font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--line);display:flex;gap:6px}
.sct-item .did{color:var(--muted);font-variant-numeric:tabular-nums}
.expander{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.expander summary{font-size:11.5px;font-weight:750;color:var(--blue);cursor:pointer;list-style:none}
.expander summary::-webkit-details-marker{display:none}
/* Box Inspector editor (leadership · direct reports · head-count/FTE) */
.be{margin:10px 0 2px}
.be-stats{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);background:var(--surface-soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.be-stats b{color:var(--ink);font-weight:850;font-size:12.5px}
.be-sec{margin:9px 0}
.be-h{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px}
.be-shared{color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:0 5px;letter-spacing:0}
.be-row{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;margin-bottom:4px;background:var(--surface)}
.be-star{color:var(--blue);font-weight:900;font-size:12px;flex:none}
.be-dot{width:8px;height:8px;border-radius:50%;flex:none}
.be-name{flex:1;font-size:12.5px;color:var(--ink);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.be-name:hover{color:var(--blue)}
.be-flag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#a8452f;background:#fdece7;border-radius:3px;padding:1px 4px;vertical-align:middle}
.be-fte{width:44px;flex:none;padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font-size:11px;text-align:right;-moz-appearance:textfield}
.be-fte::-webkit-outer-spin-button,.be-fte::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.be-fte:focus{border-color:var(--blue);outline:none}
.be-fte-wide{width:80px;text-align:left}
.be-act{display:flex;gap:3px;flex:none}
.be-act button{width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--muted);font-size:11px;cursor:pointer;line-height:1}
.be-act button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.be-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:3px 2px}
.be-mut{color:var(--muted)}
.be-add{margin-top:2px;font-size:11.5px;font-weight:700;color:var(--blue);background:none;border:1px dashed var(--line-strong);border-radius:7px;padding:5px 9px;cursor:pointer;width:100%;text-align:center}
.be-add:hover{border-color:var(--blue);background:var(--blue-soft)}
.be-hint{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
body[data-skin="deck"] .be-flag{color:#f0796a;background:#33201c}
body[data-skin="deck"] .be-row,body[data-skin="deck"] .be-act button,body[data-skin="deck"] .be-add{background:#171b24}
/* Fullscreen editing — the Structure Editor fills the screen; the chart gets the height, editing chrome stays */
:fullscreen,:-webkit-full-screen{background:var(--bg)}
:fullscreen .main,:-webkit-full-screen .main{padding:10px 18px 18px}
:fullscreen .edscroll,:-webkit-full-screen .edscroll{max-height:calc(100vh - 210px)}
:fullscreen .inspector,:-webkit-full-screen .inspector{max-height:calc(100vh - 96px);overflow:auto}
:fullscreen .wrap,:-webkit-full-screen .wrap{grid-template-columns:minmax(0,1fr) 340px}
.warnrow{font-size:11.5px;border-radius:7px;padding:7px 9px;margin:6px 0;border:1px solid}
.warnrow.red{background:#fdece7;border-color:#e6a08f;color:#a8452f}
.warnrow.loud{background:#fde2dc;border-color:#df6353;box-shadow:0 0 0 2px rgba(223,99,83,.25)}
.warnrow.amber{background:#fff5d8;border-color:#f0d896;color:#8a5b04}
body[data-skin="deck"] .warnrow.red{background:#33201c;color:#f0796a}
body[data-skin="deck"] .warnrow.amber{background:#2e2712;color:var(--amber)}
.fixbtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.fixbtns button{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:4px 8px;font-size:11px;font-weight:700}
.fixbtns button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
body[data-skin="deck"] .fixbtns button.pri{color:#04121c}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:2px 6px;background:var(--surface-soft);color:var(--muted)}
.tag.cand{background:#f5e6c9;color:#8a5b04}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;background:var(--surface);margin:2px 3px 0 0}
/* channel chips (cabinet) */
/* hierarchy editor */
.node .box{cursor:grab}
.node.dragging .box{cursor:grabbing}
.node.dimmed{opacity:.32;pointer-events:none}
.node.blocked .box{cursor:not-allowed}
.node.droptarget>.box{stroke:var(--blue);stroke-width:2.4;fill:var(--blue-soft);transition:fill .35s cubic-bezier(.15,1,.3,1)}
.node.landed>.box{animation:landflash .7s cubic-bezier(.25,.1,.25,1)}
@keyframes landflash{0%{fill:var(--blue-soft)}100%{fill:var(--surface)}}
.drag-ghost{position:absolute;z-index:40;pointer-events:none;background:var(--surface);border:1.5px solid var(--blue);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:750;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;max-width:240px;white-space:nowrap;overflow:hidden}
.drag-ghost .cnt{background:var(--blue);color:#fff;border-radius:999px;font-size:10px;font-weight:900;padding:1px 7px}
body[data-skin="deck"] .drag-ghost .cnt{color:#04121c}
.tray{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px dashed var(--line);min-height:38px}
.tray .tlab{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tray .tchip{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--line-strong);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;background:var(--surface);cursor:grab}
.tray .tchip .dot{width:8px;height:8px;border-radius:50%}
.ctxmenu{position:absolute;z-index:45;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:5px;min-width:180px}
.ctxmenu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 11px;font-size:12.5px}
.ctxmenu button:hover{background:var(--blue-soft)}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 6px}
.snackbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.snackbar button{border:0;background:none;color:var(--amber);font-weight:800;padding:0}
.undoseg button{min-width:34px}
.ftile{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:20px 22px;max-width:820px;margin-bottom:16px}
.ftile h2{margin:0 0 6px;font-size:22px}.ftile .lead{font-size:15.5px;line-height:1.5}
.ftile .outcome{background:#e5f3ef;border-radius:9px;padding:11px 13px;font-size:14px;margin:12px 0}
body[data-skin="deck"] .ftile .outcome{background:#153029}
/* modal (export + tour) */
.modal-layer{display:none;position:fixed;inset:0;z-index:60;background:rgba(15,25,30,.44);align-items:center;justify-content:center;padding:24px}
.modal-layer.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:13px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,96vw);max-height:90vh;overflow:auto}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;border-bottom:1px solid var(--line)}
.m-head b{font-size:15px}
.m-body{padding:15px 17px}
.preset{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
.preset:hover{border-color:var(--blue)}
.preset input{margin-top:3px}
.preset b{font-size:13px}.preset small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.watermark-note{font-size:11.5px;color:#8a5b04;background:#fff5d8;border:1px solid #f0d896;border-radius:7px;padding:8px 10px;margin-top:6px}
body[data-skin="deck"] .watermark-note{background:#2e2712;color:var(--amber)}
/* coach tour */
.tour-spot{position:fixed;inset:0;z-index:58;display:none}
.tour-spot.show{display:block}
.tour-card{position:absolute;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;box-shadow:0 16px 44px rgba(0,0,0,.28);width:min(340px,88vw);padding:15px 16px}
.tour-card h3{margin:0 0 5px;font-size:15px}
.tour-card p{margin:0 0 5px;font-size:13px;line-height:1.45}
.tour-card .why{font-size:11.5px;color:var(--muted)}
.tour-nav{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.tour-dots{display:flex;gap:5px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong);display:inline-block}
.tour-dots i.on{background:var(--blue)}
.tourbanner{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--blue);color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:750}
</style>
</head>
<body data-skin="workshop">
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">V7</div><b>VSM7</b></div>
    <div class="ctx">
      <div><label>System-in-Focus</label><strong id="ctxSif">EU AI Solutions SE · R0</strong></div>
      <div><label>Step VII</label><strong>7.7 · Organizational Representation</strong></div>
    </div>
    <div class="tools">
      <div class="seg" id="modeSeg">
        <button data-mode="orgchart" class="on">Org Chart</button>
        <button data-mode="vsm">VSM</button>
      </div>
      <button class="tile-export-button" data-act="export" title="Export the org chart (PNG / SVG)" aria-label="Export"><span aria-hidden="true">⬇</span></button>
      <button class="tile-fullscreen-button" id="fsBtn" title="Full screen (F)" aria-label="Full screen"><span class="fullscreen-corners" aria-hidden="true"><span></span></span></button>
    </div>
  </header>
  <main class="main">
    <div class="subbar" id="subbar"></div>
    <div class="wrap">
      <div class="canvas-card" id="canvasCard">

let HOSTWARN=null;
const CODEMAP={'no-accountable':'noA','double-accountable':'doubleA','responsible-no-accountable':'respNoA','accountable-out-of-scope':'outOfScope','accountable-no-support':'thinA','candidate-accountable':'candA'};

/* warnings() — COPIED VERBATIM from design-previews/step7-ux.html:442-455. SINGLE SOURCE OF TRUTH (fallback).
   DO NOT re-implement or diverge: the chart must never disagree with the 7.2 RASIC grid. */
function warnings(cid){
  if(HOSTWARN) return (HOSTWARN[cid]||[]).map(hw=>{const sev=hwSev(hw);return {red:sev>=3?1:0,loud:(hw.loud||sev>=4)?1:0,t:hw.message||hw.code||'Flagged for a decision.'};});

  const acc=a.filter(x=>x.l==='A'),resp=a.filter(x=>x.l==='R'),sup=a.filter(x=>x.l==='S');
  if(acc.length===0) W.push({red:1,t:'No accountable vessel for this contribution.'});
  if(acc.length>1) W.push({red:1,loud:1,t:'Double accountability — '+acc.length+' vessels are marked Accountable ('+acc.map(x=>x.v.name).join(', ')+'). One accountable per contribution is the rule; keep two only as a deliberate, recorded exception.'});
  if(resp.length>0 && acc.length===0) W.push({red:0,t:'Responsible assignment without an accountable.'});
  acc.forEach(x=>{ if(x.v.scope!==c.accUnit) W.push({red:0,t:`Accountable vessel “${x.v.name}” (${unit(x.v.scope).name}) sits outside the Step IV accountable scope (${unit(c.accUnit).name}).`}); });
  acc.forEach(x=>{ if(resp.length===0 && sup.length===0) W.push({red:0,t:`“${x.v.name}” is accountable but has no responsible or supporting vessel — thin authority.`}); });
  acc.forEach(x=>{ if(x.v.state==='candidate') W.push({red:0,t:`Accountable vessel “${x.v.name}” is still only a candidate.`}); });
  return W;
}

/* wclass() — structured badge classes derived from the SAME acc/resp/sup primitives warnings() uses,

function wclass(cid){

  if(acc.length>1) out.push({cls:'doubleA',sev:4,loud:1,red:1});

}

function nodeExists(id){ return !!(unit(id).id||vessel(id).id); }

function seedHierarchy(){

     user's deliberate (and political) act. The old heuristic degenerated when roles carried no VSM
     system (sys='') or were scoped to a non-box unit — it piled every director into whatever function
     happened to be first. We now only seed the two placements that actually carry information. */
  VESSELS.filter(v=>v.type==='role').forEach(r=>{
    const holdsAHome=CONTRIBS.some(c=>c.accUnit===r.scope&&rg(c.id,r.id)==='A');
    /* (1) MD pattern: accountable for its OWN unit, and that unit is a placed box → leader of it */
    if(holdsAHome&&HIER[r.scope]&&isBoxNode(r.scope)&&!hLeader(r.scope)){ HIER[r.id]={parent:r.scope,order:ord++,slot:'leader'}; return; }
    /* (2) unambiguous system match: EXACTLY ONE placed function with the same NON-EMPTY scope+sys.
       Requiring sys to be set on both sides and the match to be unique kills the "first function" pile-up. */
    if(r.sys){
      const fns=VESSELS.filter(f=>f.type==='function'&&f.scope===r.scope&&f.sys&&f.sys===r.sys&&HIER[f.id]);
      if(fns.length===1){ const home=fns[0].id; const asLeader=holdsAHome&&!hLeader(home);
        HIER[r.id]=Object.assign({parent:home,order:ord++},asLeader?{slot:'leader'}:{}); return; }
    }
    /* (3) role scoped to an actual placed box → member of that box (scope IS the belonging). Leader only if it holds the box's A. */
    if(HIER[r.scope]&&isBoxNode(r.scope)){ const asLeader=holdsAHome&&!hLeader(r.scope); HIER[r.id]=Object.assign({parent:r.scope,order:ord++},asLeader?{slot:'leader'}:{}); return; }
    /* (4) otherwise: UNPLACED → the Unassigned tray. The boxes are proposed from the model; the people are placed by hand. */
  });
}

/* DEFAULT VISIBILITY: an ACTIVE chart always shows every fed operative unit. Any operative unit missing from a
   non-empty hierarchy is appended as a root box on feed (empty charts stay with seedHierarchy / the user's intent).
   Direct HIER writes on purpose: no undo spam, one persist + one authoritative change when something was added. */
function ensureOperativeUnitsPlaced(){
  if(!Object.keys(HIER).length)return;
  let base=hChildren('root').length, added=0;
  UNITS.filter(isOperativeUnit).forEach(u=>{ if(!HIER[u.id]){ HIER[u.id]={parent:'root',order:base+added}; added++; } });
  if(added){ persist(); emitChange(); }
}
/* ONE move() command behind every input path (drag, menu, picker, keyboard); stores its inverse for undo */
function hierMove(nodeId,newParent,newIndex,newSlot,opts){
  opts=opts||{};
  if(!nodeExists(nodeId))return false;
  if(newParent!=='root'&&!isBoxNode(newParent))return false;                 // only boxes can contain
  if(newParent!=='root'&&(nodeId===newParent||isDescOf(newParent,nodeId)))return false;   // cycle guard
  if(newSlot==='leader'&&!isRoleNode(nodeId))return false;                   // leader slot is a role slot
  const old=HIER[nodeId]?{parent:HIER[nodeId].parent,order:HIER[nodeId].order,slot:HIER[nodeId].slot}:null;
  const demoted=[];
  /* resolve the FINAL slot first ('keep' can also resolve to leader), then enforce one-leader-per-box */
  const finalLeader=newSlot==='leader'||(newSlot==='keep'&&old&&old.slot==='leader');
  /* one-leader-per-box UNLESS opts.share (shared/co-leadership) — then incumbents keep their star */
  if(finalLeader&&!opts.share){ hLeaders(newParent).forEach(cur=>{ if(cur!==nodeId){delete HIER[cur].slot;demoted.push(cur);} }); }
  const sibs=hChildren(newParent).filter(id=>id!==nodeId);
  if(newIndex==null||newIndex>sibs.length)newIndex=sibs.length;
  sibs.splice(newIndex,0,nodeId);
  const entry={parent:newParent,order:0};
  if(finalLeader)entry.slot='leader';
  HIER[nodeId]=entry;
  sibs.forEach((id,i)=>{ HIER[id].order=i; });
  if(!opts.noHistory){ UNDO.push({t:'m',id:nodeId,from:old,to:{parent:newParent,order:newIndex,slot:entry.slot},demoted}); REDO.length=0; }
  state.hierTouched=true; persist(); renderEditorCommit(opts);
  emit('hierarchy',{op:'move',nodeId,parent:newParent,index:newIndex,slot:entry.slot||'member'}); emitChange();
  return true;
}
function hierUnplaceCore(nodeId){
  if(!HIER[nodeId])return null;
  const snap={id:nodeId,old:{parent:HIER[nodeId].parent,order:HIER[nodeId].order,slot:HIER[nodeId].slot},promoted:[]};
  const kids=hChildren(nodeId), boxes=kids.filter(isBoxNode);
  kids.forEach(c=>{ snap.promoted.push({id:c,order:HIER[c].order,slot:HIER[c].slot,wasRole:isRoleNode(c)});
    if(isRoleNode(c))delete HIER[c]; });   // roles → tray
  /* splice promoted BOX children into the parent's sibling list at the removed box's position, then renumber */
  const parentSibs=hChildren(snap.old.parent).filter(id=>id!==nodeId);
  const at=Math.min(snap.old.order,parentSibs.length);
  boxes.forEach((b,i)=>{ HIER[b].parent=snap.old.parent; parentSibs.splice(at+i,0,b); });
  parentSibs.forEach((id,i)=>{ HIER[id].order=i; });
  delete HIER[nodeId];
  if(state.sel===nodeId)state.sel=null;
  return snap;
}
function hierUnplace(nodeId){
  if(!HIER[nodeId])return;
  const snap=hierUnplaceCore(nodeId);
  UNDO.push({t:'u',snap}); REDO.length=0;
  state.hierTouched=true; persist(); renderEditorCommit({});
  emit('hierarchy',{op:'remove',nodeId}); emitChange();
  snackbar(`Removed ${nodeName(nodeId)} from the chart — roles go to Unassigned`,true);
}
function applyEntry(id,e){ if(!e){delete HIER[id];return;} if(!nodeExists(id))return;
  if(e.parent!=='root'&&(!nodeExists(e.parent)||isDescOf(e.parent,id)))return;   // never restore an orphan or a cycle
  HIER[id]=Object.assign({parent:e.parent,order:e.order||0},e.slot?{slot:e.slot}:{}); }
const hSnapshot=()=>JSON.parse(JSON.stringify(HIER));
const hRestore=snap=>{ Object.keys(HIER).forEach(k=>delete HIER[k]); Object.assign(HIER,JSON.parse(JSON.stringify(snap))); };
/* Re-suggest: wipe the placement and propose a fresh honest one (roles the model can't confidently place return to Unassigned).
   For a project whose layout was only ever auto-seeded (never hand-arranged) this is the clean way to adopt the improved suggestion. */
function reseedLayout(){
  if(!confirm('Re-suggest the layout from the model?\n\nThis clears the current placement and proposes a fresh one — roles that can\'t be placed with confidence return to Unassigned for you to place deliberately. You can Undo.'))return;
  const prev=hSnapshot();
  Object.keys(HIER).forEach(k=>delete HIER[k]);
  state.hierTouched=false; seedHierarchy(); state.hierTouched=true;   // the reseed is itself a deliberate authored act
  UNDO.push({t:'reseed',prev,next:hSnapshot()}); REDO.length=0;
  persist(); renderEditorCommit({}); emitChange();
  snackbar('Layout re-suggested — place roles from Unassigned into their departments.',true);
}
function hierUndo(){ const u=UNDO.pop(); if(!u)return;
  if(u.t==='reseed'){ hRestore(u.prev); }
  else if(u.t==='u'){ const x=u.snap; applyEntry(x.id,x.old);
    x.promoted.forEach(p=>{ applyEntry(p.id,{parent:x.id,order:p.order||0,slot:p.slot}); }); }
  else { applyEntry(u.id,u.from); (u.demoted||[]).forEach(id=>{ if(HIER[id])HIER[id].slot='leader'; }); }
  REDO.push(u); persist(); renderEditorCommit({}); emitChange(); snackbar('Undone',false); }
function hierRedo(){ const r=REDO.pop(); if(!r)return;
  let ok=true;
  if(r.t==='reseed'){ hRestore(r.next); }
  else if(r.t==='u'){ ok=!!hierUnplaceCore(r.snap.id); }
  else { ok=hierMove(r.id,r.to.parent,r.to.order,r.to.slot==='leader'?'leader':undefined,{noHistory:true}); }
  if(ok)UNDO.push(r);   // never let a failed replay pretend it happened
  persist(); renderEditorCommit({}); emitChange(); }
function snackbar(msg,withUndo){ let s=$('#snack'); if(s)s.remove(); s=document.createElement('div'); s.id='snack'; s.className='snackbar';
  s.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button data-act="undo">Undo</button>':''}<button data-act="snackx" aria-label="Dismiss">✕</button>`;
  document.body.appendChild(s); clearTimeout(snackbar._t);
  const arm=()=>{snackbar._t=setTimeout(()=>{if(!s.matches(':hover'))s.remove();else arm();},5000);}; arm(); }

/* ============================ ACCOUNTABILITY DERIVATIONS ============================ */
function headlineCounts(){
  let noA=0,doubleA=0,outOfScope=0,thinA=0,candA=0,respNoA=0,other=0;
  CONTRIBS.forEach(c=>{wclass(c.id).forEach(w=>{if(w.cls==='noA')noA++;else if(w.cls==='doubleA')doubleA++;else if(w.cls==='outOfScope')outOfScope++;else if(w.cls==='thinA')thinA++;else if(w.cls==='candA')candA++;else if(w.cls==='respNoA')respNoA++;else other++;});});
  return {noA,doubleA,outOfScope,thinA,candA,respNoA,other,total:noA+doubleA+outOfScope+thinA+candA+other};
}
/* worst badge for a vessel node: max severity across contributions where it is A or R,
   plus, for its home unit, contributions with no accountable at all (the gap belongs to the seat). */
function vesselBadge(vid){
  let best=null;
  CONTRIBS.forEach(c=>{const l=rg(c.id,vid);if(l!=='A'&&l!=='R')return;
    wclass(c.id).forEach(w=>{if(w.vessel&&w.vessel!==vid)return; if(!best||w.sev>best.sev)best={...w,cid:c.id};});});
  return best;
}
function unitBadge(uid){
  let best=null;
  /* no-accountable contributions whose Step IV home is this unit → an empty seat here */
  CONTRIBS.forEach(c=>{if(c.accUnit!==uid)return;wclass(c.id).forEach(w=>{if(w.cls==='noA'||w.cls==='respNoA'){if(!best||w.sev>best.sev)best={...w,cid:c.id};}});});
  /* bubble worst badge of vessels scoped to this unit */
  VESSELS.filter(v=>v.scope===uid).forEach(v=>{const b=vesselBadge(v.id);if(b&&(!best||b.sev>best.sev))best=b;});
  return best;
}
/* all warnings as a flat, severity-sorted walk list (for the stepper) */
function warnWalk(){
  const list=[];
  CONTRIBS.forEach(c=>{wclass(c.id).forEach(w=>list.push({cid:c.id,...w}));});
  list.sort((a,b)=>b.sev-a.sev);
  return list;
}

/* ============================ RENDER (dispatch) ============================ */
/* the Unassigned tray (Levels only) — plain HTML above the zoom/pan viewport */
function renderTray(){
  const tray=trayVessels();
  return `<div class="tray" id="edTray"><span class="tlab">Unassigned</span>${tray.length?tray.map(v=>{const tb=vesselBadge(v.id);return `<span class="tchip" data-tray="${esc(v.id)}"><span class="dot" style="background:${sysColor(v.sys)}"></span>${esc(clip(v.name,22))}${showBadge(tb)?`<span style="color:${tb.sev>=3?'#df6353':'#b8860b'};font-weight:900" title="carries an accountability warning">⚑</span>`:''}</span>`;}).join(''):'<span class="hint">everything is placed</span>'}<span style="margin-left:auto" class="undoseg"><button class="btn ghost" data-act="reseed" title="Clear the placement and re-suggest an honest one from the model (roles return to Unassigned). Undoable.">↻ Re-suggest</button><button class="btn ghost" data-act="undo" title="Undo (Ctrl+Z)">↩</button><button class="btn ghost" data-act="redo" title="Redo (Ctrl+Shift+Z)">↪</button></span></div>`;
}
/* the SVG sits inside a scrollable viewport (#edScroll) with a scaled inner layer (#edZoom) — this is the zoom/pan window */
function zoomWrap(inner){ return `<div class="edscroll" id="edScroll"><div id="edZoom">${inner}</div></div>`; }
function applyZoom(){ const el=$('#edZoom'), sc=$('#edScroll'), s=state.zoom||1;
  if(el){ el.style.transform='scale('+s+')';
    /* size the layout box to the SCALED render: transform alone leaves the box unscaled → clipping at s>1 and dead scroll space at s<1 */
    el.style.width=((state._cw||0)*s)+'px'; el.style.height=((state._ch||0)*s)+'px';
    /* a short chart in a tall viewport sits centred, not top-jammed (uses the vertical space) */
    const contentH=(state._ch||0)*s, vh=sc?sc.clientHeight:0, mt=Math.max(0,(vh-contentH)/2);
    el.style.marginTop=mt?Math.round(mt)+'px':''; }
  const p=$('#zoomPct'); if(p)p.textContent=Math.round(s*100)+'%'; }
function render(){
  document.body.dataset.skin=document.body.dataset.skin||'workshop';
  renderSubbar();
  const host=$('#canvasHost'), zc=$('#zoomCtl');
  const prevSc=$('#edScroll'), keep=prevSc?{l:prevSc.scrollLeft,t:prevSc.scrollTop}:null;   // preserve scroll across re-renders
  if(!sifUnit().id){ unmountCabinet(); host.innerHTML=renderEmpty(); renderCrumbs(); renderInspector(); renderLegend(); wireCanvas(); $('#backup').classList.remove('show'); if(zc)zc.style.display='none'; return; }
  if(state.mode==='vsm'){                              // Cabinet = reuse the polished vsm.html diagram (persistent iframe, no zoom scroller)
    mountCabinet();
    if(zc)zc.style.display='none';
  }else{
    unmountCabinet();
    state.mode='orgchart';   /* only Levels + Cabinet remain */
    const inner=renderLevels(); state._cw=state._layout.EW; state._ch=state._layout.EH;
    host.innerHTML=renderTray()+zoomWrap(inner);
    applyZoom();
    const sc=$('#edScroll');
    if(sc){ if(keep){sc.scrollLeft=keep.l;sc.scrollTop=keep.t;} else requestAnimationFrame(()=>{ if(state.mode==='orgchart'&&state._layout){const rp=state._layout.pos[state._layout.RK];sc.scrollLeft=Math.max(0,(rp.x+rp.w/2)*(state.zoom||1)-sc.clientWidth/2);} }); }
    if(zc)zc.style.display='inline-flex';
    relayoutCanvas();                                 // size the scroller to the screen; fill the height on first mount / height change
  }
  renderCrumbs();
  renderInspector();
  renderLegend();
  wireCanvas();
  $('#backup').classList.toggle('show',state.stack.length>0);
}
function setZoom(z){ z=Math.max(0.4,Math.min(2.4,z)); const sc=$('#edScroll'),old=state.zoom||1; if(z===old)return;
  state._fitMode=false;                              // manual zoom → stop auto-re-fitting until the user hits ⤢ again
  let cx=0,cy=0; if(sc){cx=sc.scrollLeft+sc.clientWidth/2;cy=sc.scrollTop+sc.clientHeight/2;}
  state.zoom=z; applyZoom(); persist();
  if(sc){const k=z/old; sc.scrollLeft=cx*k-sc.clientWidth/2; sc.scrollTop=cy*k-sc.clientHeight/2;} }
/* fillHeight = the AUTO behaviour: fill the full available vertical HEIGHT (org charts are wide-and-flat; PO 2026-07-24)
   and pan horizontally. Runs on first mount (roomy), resize, and full-screen toggle. */
function fillHeight(){ const sc=$('#edScroll'); if(!sc)return; const h=state._ch||720;
  state._fitMode=true;
  const ch=Math.max(1,sc.clientHeight-16);
  state.zoom=Math.max(0.4,Math.min(2.2, ch/h));     // fill the whole vertical height; horizontal pans as needed
  applyZoom(); persist(); centreEditor(); }
/* fitToScreen = the "Fit" BUTTON: fit the WHOLE chart on screen (every box visible), fitting the tighter dimension.
   Distinct from the auto fill-height so the button always visibly does something (it never no-ops on an already-filled view). */
function fitToScreen(){ const sc=$('#edScroll'); if(!sc)return; const w=state._cw||1280,h=state._ch||720;
  state._fitMode=false;                             // a deliberate "show everything" view — don't let auto-refit fill over it
  const cw=Math.max(1,sc.clientWidth-24), ch=Math.max(1,sc.clientHeight-24);
  state.zoom=Math.max(0.15,Math.min(2.2, Math.min(cw/w, ch/h)));
  applyZoom(); persist(); centreEditor(); }
/* horizontally centre on the root so the tree opens balanced, not scrolled to a corner */
function centreEditor(){ const sc=$('#edScroll'); if(!sc)return;
  requestAnimationFrame(()=>{ const rp=state._layout&&state._layout.pos[state._layout.RK], z=state.zoom||1;
    if(rp)sc.scrollLeft=Math.max(0,(rp.x+rp.w/2)*z-sc.clientWidth/2); sc.scrollTop=0; }); }
/* DYNAMIC canvas height: when there is real room below the scroller (full screen, roomy embed) fill from its top
   to the bottom of the viewport, so the chart gets the full available SCREEN height. When it's cramped (a narrow
   embed whose Unassigned tray already overflows) fall back to the CSS max-height — never force a tiny box. */
function sizeCanvas(){ const sc=$('#edScroll'); if(!sc||state.mode!=='orgchart')return 0;
  const top=sc.getBoundingClientRect().top, lg=$('#legend'), lgH=lg?lg.offsetHeight:0;
  const avail=Math.round((window.innerHeight||720) - top - lgH - 22);

  sc.style.height=''; sc.style.maxHeight=''; return 0; }
/* re-fill to the available height when it CHANGES (first mount, resize, full-screen toggle). A manual zoom

function relayoutCanvas(force){ const sc=$('#edScroll'); if(!sc||state.mode!=='orgchart')return;
  const filled=sizeCanvas(), h=sc.clientHeight;

const VSM_SRC=(()=>{ const u=(new URLSearchParams(location.search).get('vsm')||'../vsm'); return u+(u.includes('?')?'&':'?')+'pane=hidden&chrome=min'; })();  // host may point the embed elsewhere via ?vsm=<url>; default = ../vsm (vsm.html lives at the repo root; this asset is under design-previews/)

/* the current focus unit + its operating units, shaped for vsm.html loadTree({id,name,children}) */
function cabinetTree(){ const fu=focusUnit(); const ops=fu.id===sifUnit().id?UNITS.filter(isOperativeUnit):[];   // the SIF's S1 children include the Step I operative units
  const kids=childUnits(fu).concat(ops).map(u=>({id:u.id,name:u.name})); return { id:fu.id||'sif', name:fu.name||'System in focus', children:kids }; }
function pushCabinetTree(force){ const f=vsmFrame(); if(!vsmReady||!f||!f.contentWindow)return;
  const t=cabinetTree(), sig=JSON.stringify(t); if(!force && sig===_cabTree)return; _cabTree=sig;   // skip redundant reloads so an in-frame drill isn't yanked on unrelated re-renders
  f.contentWindow.postMessage({cmd:'loadTree', tree:t}, '*');

function ledgerFor(vid){
  const groups={A:[],R:[],S:[],C:[],I:[]};
  CONTRIBS.forEach(c=>{const l=rg(c.id,vid);if(l&&groups[l])groups[l].push(c);});
  const order=[['A','Accountable for'],['R','Responsible for'],['S','Supports'],['C','Consulted on'],['I','Informed on']];
  let s='';order.forEach(([k,lab])=>{if(!groups[k].length)return;
    s+=`<div class="rgroup"><b><span class="rlet ${k}">${k}</span>${lab}</b>`;
    groups[k].forEach(c=>{s+=`<div class="sct-item" data-act="selc" data-id="${esc(c.id)}" style="cursor:pointer"><span class="did">${esc(sct(c.sct).did)}</span><span>${esc(sct(c.sct).name)}</span></div>`;});
    s+=`</div>`;});

  return {direct:direct.length, leaders:leaders.length, subs:subs.length, headcount:all.length, fteSum:fteVals.reduce((s,n)=>s+n,0), fteKnown:fteVals.length};

  if(inFrame){emit('exportError',{requestId:null,format:preset==='svg'?'svg':'png',message:'Embedded — export is host-orchestrated for higher resolution; here is the standalone fallback.'});}
  if(preset==='svg'){downloadBlob(new Blob([svg],{type:'image/svg+xml'}),base+'.svg');closeModal();toast('SVG exported.');}
  else{svgToPng(svg,2).then(blob=>{downloadBlob(blob,base+'.png');closeModal();toast('PNG exported.');}).catch(()=>{downloadBlob(new Blob([svg],{type:'image/svg+xml'}),base+'.svg');closeModal();toast('PNG raster unavailable — exported SVG instead.');});}
}
/* ---- host-orchestrated export (embedded): produce the bytes on request and hand them UP as a data URL,
   so step7-ux can relay them to the host for a consistent, host-named download. The honest gap count is
   still baked into suggestedName; the accountability layer is always shown (hideAcct:false). ---- */
function _blobToDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read failed')); r.readAsDataURL(blob); }); }
function renderExport(format, requestId){
  const fmt=format==='svg'?'svg':'png';
  const hc=headlineCounts();
  const svg=buildExportSVG({colour:true,gaps:state.overlays.gaps,hideAcct:false,caption:state.caption,hc});
  const base=`org-chart_${focusUnit().id}__${hc.total}-open-accountability-gaps`;
  if(fmt==='svg'){
    emit('exportRender',{requestId:requestId||null,format:'svg',mimeType:'image/svg+xml',
      dataUrl:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),suggestedName:base+'.svg'});
  } else {
    svgToPng(svg,2).then(_blobToDataURL).then(dataUrl=>emit('exportRender',{requestId:requestId||null,format:'png',mimeType:'image/png',dataUrl,suggestedName:base+'.png'}))
      .catch(()=>emit('exportRender',{requestId:requestId||null,format:'svg',mimeType:'image/svg+xml',
        dataUrl:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),suggestedName:base+'.svg',fallback:'png-raster-unavailable'}));
  }
}
/* Build a SEPARATE, token-free, colour-inlined, foreignObject-free SVG for export */
function buildExportSVG(opt){
  /* re-render current mode with overlays forced for legibility, then inline var() colours */
  const savedGaps=state.overlays.gaps,savedSel=state.sel;
  state.overlays.gaps=!!opt.gaps;state.sel=null;state._export=true;
  let inner=state.mode==='vsm'?renderCabinet():renderLevels();
  state.overlays.gaps=savedGaps;state.sel=savedSel;state._export=false;
  /* strip the class + inline computed token colours */
  const cs=getComputedStyle(document.body);
  const tok=n=>cs.getPropertyValue(n).trim()||'#ffffff';
  inner=inner.replace('<svg class="canvas"','<svg').replace(/var\((--[a-z0-9-]+)\)/g,(m,n)=>tok(n));
  /* frame: title, caption, legend, watermark */
  /* size the export frame to the ACTUAL content — the editor tree is often wider than 1280 (never clip the chart) */
  const cw=(state.mode==='orgchart'&&state._layout)?Math.max(1280,state._layout.EW):1280;
  const chh=(state.mode==='orgchart'&&state._layout)?Math.max(720,state._layout.EH):720;
  const W=cw,legendY=chh+20,capY=chh-14,TOTALH=chh+60;
  const sysSw=state.mode==='vsm'?['S5','S4','S3','S3*','S2','S1'].map((s,i)=>`<g transform="translate(${40+i*150},${legendY})"><rect width="13" height="13" rx="3" fill="${sysColor(s)}"/><text x="19" y="11" font-size="12" fill="${tok('--ink')}" font-family="sans-serif">${esc(SYS[s]?(state.lang==='vsm'?SYS[s].vsm:SYS[s].plain):s)}${s==='S3*'?' ▽':''}</text></g>`).join(''):'';
  const sif=focusUnit();
  const cap=`${sif.name} · R0 · ${state.caption?state.caption+' · ':''}organizational representation`;
  let wm='';
  if(opt.hideAcct&&opt.hc.total){wm=`<text x="${W/2}" y="${380}" text-anchor="middle" font-size="30" fill="#df6353" opacity="0.16" font-weight="900" font-family="sans-serif" transform="rotate(-18 ${W/2} 380)">accountability layer hidden — ${opt.hc.total} open items</text>`;}
  const bg=tok('--bg');const darkBg=(function(){const m=bg.match(/#?([0-9a-f]{6})/i);if(!m)return false;const n=parseInt(m[1],16);return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))<110;})();
  const redC=darkBg?'#f79587':'#a8452f',greenC=darkBg?'#7fd98b':'#178275';   // skin-aware so the honesty line stays legible (WCAG AA) on the exported background
  const gapline=opt.hc.total?`<text x="${W-40}" y="${capY}" text-anchor="end" font-size="12.5" font-weight="700" fill="${redC}" font-family="sans-serif">⚑ ${opt.hc.noA} no owner · ${opt.hc.doubleA} doubled · ${opt.hc.outOfScope} out of scope</text>`:`<text x="${W-40}" y="${capY}" text-anchor="end" font-size="12.5" font-weight="700" fill="${greenC}" font-family="sans-serif">✓ every critical contribution has a clear owner</text>`;
  const body=inner.replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');
  return `<svg viewBox="0 0 ${W} ${TOTALH}" width="${W}" height="${TOTALH}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${TOTALH}" fill="${tok('--bg')}"/>${wm}<g>${body}</g><text x="40" y="${capY}" font-size="13" font-weight="700" fill="${tok('--ink')}" font-family="sans-serif">${esc(cap)}</text>${gapline}${sysSw}</svg>`;
}
function svgToPng(svgStr,scale){return new Promise((res,rej)=>{const img=new Image();const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);
  const mw=svgStr.match(/width="(\d+)"/),mh=svgStr.match(/height="(\d+)"/);
  const W=mw?+mw[1]:1280,H=mh?+mh[1]:780;
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=W*scale;c.height=H*scale;const ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('toBlob null')),'image/png');}catch(err){rej(err);}};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img load'));};img.src=url;});}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}

/* ============================ COACH TOUR ============================ */
const TOUR=[
  {t:'The whole organization',b:'This central card is your organization as a whole. Everything else hangs off it.',why:'In VSM this is the “System-in-Focus” — the level you are designing.',sel:()=>'u-sif'},
  {t:'The operating units',b:'These cards are the units that actually make the value — the products and services.',why:'VSM calls these System 1. Each is itself a small organization.',sel:()=>UNITS.find(u=>u.level==='R-1').id},
  {t:'Steering & oversight',b:'This tray holds the roles that steer and oversee the whole — strategy, control, coordination, audit, identity.',why:'Together these are the “metasystem” (S2–S5). Click it to open.',sel:()=>null,open:true},
  {t:'The parent it belongs to',b:'At the very top sits the parent group this organization is part of.',why:'VSM is recursive: every organization sits inside a bigger one (R+1) and contains smaller ones (R-1).',sel:()=>'u-grp'},
  {t:'Who is accountable',b:'Click any box to see who is accountable and for what. The amber/red marks flag where accountability is missing or unclear — the chart never hides them.',why:'This is the honest core: the picture is a true view over the accountability model, not decoration.',sel:()=>UNITS.find(u=>u.level==='R-1').id,gaps:true},
];
function startTour(){state.tourStep=0;renderTour();}
function endTour(){state.tourStep=-1;state.tourSeen=true;persist();$('#tourSpot').classList.remove('show');$('#tourSpot').innerHTML='';}
function renderTour(){
  const step=TOUR[state.tourStep];if(!step){endTour();return;}
  if(step.open)state.trayOpen=true;
  if(step.gaps)state.overlays.gaps=true;
  state.sel=step.sel?step.sel():state.sel;render();
  const spot=$('#tourSpot');spot.classList.add('show');
  spot.innerHTML=`<div class="tour-card" style="left:50%;top:120px;transform:translateX(-50%)">
    <h3>${state.tourStep+1}. ${esc(step.t)}</h3><p>${esc(step.b)}</p><div class="why">Why this matters: ${esc(step.why)}</div>
    <div class="tour-nav"><div class="tour-dots">${TOUR.map((_,i)=>`<i class="${i===state.tourStep?'on':''}"></i>`).join('')}</div>
      <div style="display:flex;gap:6px"><button class="btn ghost" data-act="tourskip">Skip</button>${state.tourStep>0?'<button class="btn ghost" data-act="tourprev">◂</button>':''}<button class="btn primary" data-act="tournext">${state.tourStep===TOUR.length-1?'Done':'Next ▸'}</button></div></div></div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='tournext'){state.tourStep++;renderTour();}
  else if(a.dataset.act==='tourprev'){state.tourStep=Math.max(0,state.tourStep-1);renderTour();}
  else if(a.dataset.act==='tourskip'){endTour();}
});

/* ============================ TOAST ============================ */
let _toastT=null;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:600;z-index:70;box-shadow:0 8px 26px rgba(0,0,0,.3);max-width:520px';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(_toastT);_toastT=setTimeout(()=>{t.style.transition='opacity .5s';t.style.opacity='0';},3600);}

/* ============================ BRIDGE · window.ORG ============================ */
const inFrame=!!(window.parent&&window.parent!==window);let _emitT=null;
/* embedded → the host provides brand/context chrome; collapse ours (no double content). Standalone keeps the full topbar. */
if(inFrame||['min','none','hidden'].includes((new URLSearchParams(location.search).get('chrome')||'').toLowerCase()))document.body.classList.add('embed');
function orgModel(){return JSON.parse(JSON.stringify({units:UNITS,vessels:VESSELS,contribs:CONTRIBS,rasic:RASIC,scts:SCTS,hierarchy:HIER}));}
function orgState(){return {ctx:{sif:sifUnit().id,units:UNITS,scts:SCTS},model:orgModel(),ui:{mode:state.mode,lang:state.lang,overlays:{...state.overlays},selected:state.sel,depth:state.stack.length,skin:document.body.dataset.skin}};}
function postToHost(msg){try{if(inFrame)window.parent.postMessage(msg,'*');}catch(_){}try{if(window.ORG&&typeof window.ORG.onEmit==='function')window.ORG.onEmit(msg);}catch(_){}}
function emit(evt,extra){postToHost(Object.assign({evt},extra||{}));}
function emitChange(){clearTimeout(_emitT);_emitT=setTimeout(()=>emit('change',{model:orgModel()}),120);}
const _rA=(a,x)=>{a.length=0;(Array.isArray(x)?x:[]).forEach(i=>a.push(i));};
const _rO=(o,x)=>{Object.keys(o).forEach(k=>delete o[k]);if(x&&typeof x==='object')Object.assign(o,x);};
/* tolerant ingest of a host contribution — map alias field names to the canonical {id,sct,unit,sys,accUnit,text} */
function normContrib(c){ if(!c||typeof c!=='object')return c; return Object.assign({},c,{
  sct:c.sct!=null?c.sct:c.sctId, unit:c.unit!=null?c.unit:c.organizationId,
  sys:c.sys!=null?c.sys:c.vsmSystem, accUnit:c.accUnit!=null?c.accUnit:c.accountableOrganizationId,
  text:c.text!=null?c.text:(c.contribution||c.description||c.title||'') }); }
const _contribsFrom=x=>(Array.isArray(x)?x:[]).map(normContrib);
/* host warnings are authoritative only when a NON-EMPTY map is present; an empty/absent map falls back to the
   parity predicate — so a not-yet-computed warnings:{} can never render a falsely-clean (dishonest) chart */
function _adoptWarnings(w){ if(w===undefined)return; HOSTWARN=(w&&typeof w==='object'&&Object.keys(w).length)?w:null; }
window.ORG={
  setContext:c=>{if(!c||typeof c!=='object')return;if(Array.isArray(c.units))_rA(UNITS,c.units);if(Array.isArray(c.vessels))_rA(VESSELS,c.vessels);if(Array.isArray(c.contribs)||Array.isArray(c.contributions))_rA(CONTRIBS,_contribsFrom(c.contribs||c.contributions));if(Array.isArray(c.scts))_rA(SCTS,c.scts);if(c.rasic)_rO(RASIC,c.rasic);_adoptWarnings(c.warnings);if(c.hierarchy&&typeof c.hierarchy==='object'&&Object.keys(c.hierarchy).length){_rO(HIER,c.hierarchy);state.hierTouched=true;}UNDO.length=0;REDO.length=0;if(c.sifName)$('#ctxSif').textContent=c.sifName+' · R0';reconcileNav();seedHierarchy();ensureOperativeUnitsPlaced();render();},
  loadModel:m=>{if(!m||typeof m!=='object')return;if(Array.isArray(m.units))_rA(UNITS,m.units);if(Array.isArray(m.vessels))_rA(VESSELS,m.vessels);if(Array.isArray(m.contribs)||Array.isArray(m.contributions))_rA(CONTRIBS,_contribsFrom(m.contribs||m.contributions));if(Array.isArray(m.scts))_rA(SCTS,m.scts);if(m.rasic)_rO(RASIC,m.rasic);_adoptWarnings(m.warnings);if(m.hierarchy&&typeof m.hierarchy==='object'&&Object.keys(m.hierarchy).length){_rO(HIER,m.hierarchy);state.hierTouched=true;}UNDO.length=0;REDO.length=0;reconcileNav();seedHierarchy();ensureOperativeUnitsPlaced();render();},
  select:id=>{state.sel=id||null;render();},
  setMode:mode=>{mode=MODE_ALIAS[mode]||mode;/* legacy ids (levels/cabinet/nested) map forward */ if(mode==='orgchart'||mode==='vsm'){state.mode=mode;syncModeSeg();render();}},
  setOverlay:(id,on)=>{if(id in state.overlays){state.overlays[id]=on!==false;render();}},
  setLang:l=>{if(l==='plain'||l==='vsm'){state.lang=l;render();persist();}},
  skin:s=>{if(s==='workshop'||s==='deck')setSkin(s);},
  focus:()=>{},   /* focus/presentation mode removed — fullscreen is the only presentation control */
  fullscreen:on=>{if(on===false){const fn=document.exitFullscreen;fn&&fn.call(document);}else if(on===true){const el=document.documentElement;(el.requestFullscreen||(()=>{})).call(el);}else toggleFs();},
  isFullscreen:()=>isFs(),
  export:o=>{if(inFrame){emit('exportError',{requestId:(o&&o.requestId)||null,message:'Embedded — export is host-orchestrated; open standalone for direct PNG/SVG download.'});}else openExport();},
  onEmit:null,
  getState:()=>orgState()
};
window.addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object'||!m.cmd)return;const S=window.ORG;
  if(m.cmd==='setContext')S.setContext(m);else if(m.cmd==='loadModel')S.loadModel(m.model);
  else if(m.cmd==='select')S.select(m.id);else if(m.cmd==='setMode')S.setMode(m.mode);
  else if(m.cmd==='setOverlay')S.setOverlay(m.id,m.on);else if(m.cmd==='setLang')S.setLang(m.lang);
  else if(m.cmd==='skin'||m.cmd==='setSkin')S.skin(m.skin);else if(m.cmd==='focus')S.focus(m.on);
  else if(m.cmd==='fullscreen')S.fullscreen(m.on);else if(m.cmd==='renderExport')renderExport(m.format,m.requestId);else if(m.cmd==='export')S.export(m);});

/* ============================ INIT ============================ */
reconcileNav();      // clean a restored localStorage hierarchy against the CURRENT vessels/units (same repair as a host swap)
seedHierarchy();
syncModeSeg();
render();
emit('ready',{api:1});
</script>
